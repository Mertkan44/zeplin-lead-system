name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q api scripts src besiktas.py main.py
      - name: Validate the synthetic lead sample
        run: python scripts/validate_data.py tests/fixtures/leads_sample.json
      - name: Scan working tree for secrets
        run: python scripts/security_check.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check the generated catalog config
        run: python src/dashboard/build.py --check
      - run: npm ci --prefix web
      - name: Audit production dependencies
        run: npm audit --prefix web --omit=dev --audit-level=high
      - name: Typecheck and build
        run: npm --prefix web run build
      - name: Committed build matches the source
        run: |
          if [ -n "$(git status --porcelain -- public)" ]; then
            git status --porcelain -- public
            echo "::error::public/ is out of date; run: npm --prefix web run build"
            exit 1
          fi
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: End-to-end tests
        run: RUN_E2E=1 python -m unittest discover -s tests/e2e -v

  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Docker Hub rate-limits anonymous pulls from shared runners; the same
        # official image from the public ECR mirror is not limited that way.
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Check schema.sql is built from the migrations
        run: python scripts/build_schema.py --check
      - name: Fresh install, historical upgrades and behaviour checks
        run: python scripts/schema_parity.py --dsn postgresql://postgres:postgres@localhost:5432/postgres
      - name: Synthetic backup and restore rehearsal
        run: python scripts/backup_rehearsal.py --dsn postgresql://postgres:postgres@localhost:5432/postgres
