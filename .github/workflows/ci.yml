name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q api scripts src besiktas.py main.py
      - name: Validate the synthetic lead sample
        run: python scripts/validate_data.py tests/fixtures/leads_sample.json
      - name: Scan working tree for secrets
        run: python scripts/security_check.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build static dashboard
        run: python src/dashboard/build.py
      - name: Verify generated HTML contains no lead payload
        run: |
          if grep -q "The Market at Bosphorus" public/index.html; then
            echo "::error::Static dashboard contains embedded CRM lead data."
            exit 1
          fi

  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Check schema.sql is built from the migrations
        run: python scripts/build_schema.py --check
      - name: Fresh install, historical upgrades and behaviour checks
        run: python scripts/schema_parity.py --dsn postgresql://postgres:postgres@localhost:5432/postgres
