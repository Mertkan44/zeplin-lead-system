name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q api scripts src besiktas.py main.py
      - name: Validate lead dataset
        run: python scripts/validate_data.py
      - name: Scan working tree for secrets
        run: python scripts/security_check.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build static dashboard
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:frontend
          python src/dashboard/build.py
          git diff --exit-code -- public/app.js public/bootstrap.js public/index.html
      - name: Verify generated HTML contains no lead payload
        run: |
          if grep -q "The Market at Bosphorus" public/index.html; then
            echo "::error::Static dashboard contains embedded CRM lead data."
            exit 1
          fi
