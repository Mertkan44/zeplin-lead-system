name: Process admin search jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: zeplin-admin-search-worker
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AI_PROVIDER: deepseek
      PYTHONUNBUFFERED: "1"
      AI_LOCAL_CACHE: "0"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-pro' }}
      DEEPSEEK_FLASH_MODEL: ${{ vars.DEEPSEEK_FLASH_MODEL || 'deepseek-v4-flash' }}
      DEEPSEEK_PRO_MODEL: ${{ vars.DEEPSEEK_PRO_MODEL || 'deepseek-v4-pro' }}

    steps:
      - name: Check worker secrets
        id: preflight
        run: |
          missing=0
          for key in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY DEEPSEEK_API_KEY; do
            if [ -z "${!key}" ]; then
              echo "::warning::$key is not configured. Add it in Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "::error::Worker cannot run because required secrets are missing."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/checkout@v7

      - name: Set up Python
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        if: steps.preflight.outputs.ready == 'true'
        run: python -m pip install -r requirements.txt

      - name: Check schema before claiming any job
        if: steps.preflight.outputs.ready == 'true'
        run: |
          python - <<'PYTHON'
          from src.storage.supabase import schema_status
          status = schema_status()
          if not status["ready"]:
              raise SystemExit(f"Database schema is not ready: {status}")
          print(f"Schema {status['version']} ready")
          PYTHON

      - name: Install Chromium
        if: steps.preflight.outputs.ready == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Process queued search jobs
        if: steps.preflight.outputs.ready == 'true'
        run: python scripts/process_search_jobs.py --limit 3
