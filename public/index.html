  // ── Analytics (Raporlar) View ──────────────────────────────────────────────

  function bar(pct, color) { return { width: `${pct}%`, height: '100%', borderRadius: 99, background: color }; }

  function AnalyticsView({ leads, statuses }) {
    const [periodDays, setPeriodDays] = React.useState(30);
    const cutoff = Date.now() - periodDays * 86400000;
    const periodLeads = leads.filter(lead => {
      if (!lead.last_analyzed) return false;
      const stamp = new Date(lead.last_analyzed.replace(' ', 'T')).getTime();
      return !Number.isNaN(stamp) && stamp >= cutoff;
    });
    const actualTotal = periodLeads.length;
    const total = actualTotal || 1;

    const GRADE_COLORS = { A: '#b6f24a', B: '#ffcf4a', C: '#ff8f4a', D: '#7a7a78' };
    const gradeCounts = { A: 0, B: 0, C: 0, D: 0 };
    periodLeads.forEach(l => { const g = l.scoring?.grade; if (gradeCounts[g] !== undefined) gradeCounts[g] += 1; });
    const gradeMax = Math.max(...Object.values(gradeCounts), 1);
    const gradeBars = ['A','B','C','D'].map(g => ({ g, n: gradeCounts[g], c: GRADE_COLORS[g], pct: (gradeCounts[g]/gradeMax*100) }));

    const counts = computeTabCounts(periodLeads, statuses);
    const funnelSteps = [
      { label: 'Toplam', n: actualTotal, bg: 'var(--raised)', tx: 'var(--tx)' },
      { label: 'Yeni', n: counts.yeni, bg: 'var(--panel2)', tx: 'var(--tx)' },
      { label: 'Temasta', n: counts.contacted, bg: 'rgba(124,197,255,0.16)', tx: '#7cc5ff' },
      { label: 'Kazanıldı', n: counts.converted, bg: 'var(--accent)', tx: 'var(--accent-ink)' },
    ];

    const avgScore = Math.round(periodLeads.reduce((a, l) => a + (l.scoring?.score || 0), 0) / total);
    const gaugeCirc = 389.6;
    const gaugeOffset = gaugeCirc * (1 - Math.min(avgScore, 100) / 100);

    const now = new Date();
    const weekBuckets = new Array(8).fill(0);
    periodLeads.forEach(l => {
      if (!l.last_analyzed) return;
      const d = new Date(l.last_analyzed.replace(' ', 'T'));
      if (isNaN(d)) return;
      const diffDays = Math.floor((now - d) / 86400000);
      const weekIdx = Math.floor(diffDays / 7);
      if (weekIdx >= 0 && weekIdx < 8) weekBuckets[7 - weekIdx] += 1;
    });
    const weekMax = Math.max(...weekBuckets, 1);
    const weekly = weekBuckets.map((n, i) => ({ n, label: i === 7 ? 'Bu hafta' : `-${7-i}h`, pct: (n/weekMax*100) }));
    const weeklyTotal = weekBuckets.reduce((a, b) => a + b, 0);

    const sectorMap = {};
    periodLeads.forEach(l => {
      const s = l.category || l.sector || 'Diğer';
      sectorMap[s] = (sectorMap[s] || 0) + 1;
    });
    const sectors = Object.entries(sectorMap).sort((a, b) => b[1] - a[1]).slice(0, 5)
      .map(([s, n], i) => ({ s, pct: Math.round(n/total*100), c: ['#b6f24a','#ffcf4a','#ff8f4a','#7cc5ff','#a78bfa'][i] || 'var(--sub)' }));

    const readiness = computeReadinessBuckets(periodLeads);

    return (
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0, background: 'var(--bg)' }}>
        <div style={{ ...pv.header, display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end' }}>
          <div>
            <div style={pv.pageEyebrow}>PERFORMANS · SON {periodDays} GÜN</div>
            <h1 style={pv.pageTitle}>Raporlar</h1>
          </div>
          <div style={{ display: 'flex', gap: 4, background: 'var(--panel)', border: '1px solid var(--line)', borderRadius: 999, padding: 5 }}>
            {[7, 30, 90].map(days => (
              <button key={days} onClick={() => setPeriodDays(days)} style={{ padding: '8px 16px', borderRadius: 999, border: 'none', cursor: 'pointer', background: periodDays === days ? '#000' : 'transparent', color: periodDays === days ? 'var(--tx)' : 'var(--sub)', fontSize: 12.5, fontWeight: periodDays === days ? 600 : 500 }}>
                {days === 90 ? 'Çeyrek' : `${days}g`}
              </button>
            ))}
          </div>
        </div>

        <div className="responsive-report" style={rp.grid}>
          <div style={rp.card}>
            <div style={rp.cardTitle}>Not Dağılımı</div>
            <div style={rp.cardSub}>{actualTotal} lead sınıflandırıldı</div>
            <div style={rp.stack}>
              {gradeBars.map(g => (
                <div key={g.g}>
                  <div style={rp.rowHead}><span style={{ fontWeight: 600, color: g.c }}>Sınıf {g.g}</span><span style={rp.num}>{g.n}</span></div>
                  <div style={rp.barTrack}><div style={bar(g.pct, g.c)}/></div>
                </div>
              ))}
            </div>
          </div>

          <div style={rp.card}>
            <div style={rp.cardTitle}>Dönüşüm Hunisi</div>
            <div style={rp.cardSub}>Yeni → Müşteri · %{Math.round(counts.converted/total*100)}</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              {funnelSteps.map(s => (
                <div key={s.label} style={{ width: `${40 + (s.n/total*60)}%`, display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '12px 16px', borderRadius: 12, background: s.bg }}>
                  <span style={{ fontSize: 12.5, fontWeight: 600, color: s.tx }}>{s.label}</span>
                  <span style={{ ...rp.num, fontSize: 14, fontWeight: 700, color: s.tx }}>{s.n}</span>
                </div>
              ))}
            </div>
          </div>

          <div style={{ ...rp.card, alignItems: 'center', justifyContent: 'center', display: 'flex', flexDirection: 'column' }}>
            <div style={{ ...rp.cardTitle, alignSelf: 'flex-start' }}>Ortalama Skor</div>
            <div style={{ ...rp.cardSub, alignSelf: 'flex-start' }}>tüm aktif leadler</div>
            <div style={{ position: 'relative', width: 150, height: 150, margin: '14px 0 6px' }}>
              <svg width="150" height="150" viewBox="0 0 150 150" style={{ transform: 'rotate(-90deg)' }}>
                <circle cx="75" cy="75" r="62" fill="none" stroke="var(--line2)" strokeWidth="11"/>
                <circle cx="75" cy="75" r="62" fill="none" stroke="var(--accent)" strokeWidth="11" strokeLinecap="round" strokeDasharray={gaugeCirc} strokeDashoffset={gaugeOffset} style={{ transition: 'stroke-dashoffset .9s cubic-bezier(.22,1,.36,1)' }}/>
              </svg>
              <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
                <span style={{ fontFamily: "'Space Grotesk'", fontSize: 44, fontWeight: 700, lineHeight: 1, color: 'var(--tx)' }}>{avgScore}</span>
                <span style={{ fontSize: 11, color: 'var(--muted)' }}>/ 100</span>
              </div>
            </div>
          </div>

          <div style={{ ...rp.card, gridColumn: 'span 2' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 18 }}>
              <div>
                <div style={rp.cardTitle}>Haftalık Yeni Lead</div>
                <div style={rp.cardSub}>tarama hacmi · 8 hafta</div>
              </div>
              <div style={{ fontFamily: "'Space Grotesk'", fontSize: 26, fontWeight: 700, color: 'var(--tx)' }}>{weeklyTotal}<span style={{ fontSize: 13, color: 'var(--muted)', fontWeight: 500 }}> toplam</span></div>
            </div>
            <div style={{ display: 'flex', alignItems: 'flex-end', gap: 12, height: 150 }}>
              {weekly.map((w, i) => (
                <div key={i} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8, height: '100%', justifyContent: 'flex-end' }}>
                  <span style={{ ...rp.num, fontSize: 11, color: 'var(--sub)' }}>{w.n}</span>
                  <div style={{ width: '70%', minWidth: 14, height: `${Math.max(w.pct, 4)}%`, borderRadius: 6, background: 'linear-gradient(180deg, var(--accent), rgba(197,242,74,0.35))' }}/>
                  <span style={{ fontSize: 10.5, color: 'var(--muted)' }}>{w.label}</span>
                </div>
              ))}
            </div>
          </div>

          <div style={rp.card}>
            <div style={rp.cardTitle}>Sektör Dağılımı</div>
            <div style={rp.cardSub}>en aktif kategoriler</div>
            <div style={rp.stack}>
              {sectors.map(s => (
                <div key={s.s}>
                  <div style={rp.rowHead}><span>{s.s}</span><span style={rp.num}>{s.pct}%</span></div>
                  <div style={{ ...rp.barTrack, height: 7 }}><div style={bar(s.pct, s.c)}/></div>
                </div>
              ))}
            </div>
          </div>

          <div style={{ ...rp.card, gridColumn: 'span 3', flexDirection: 'row', gap: 14, alignItems: 'stretch' }}>
            {[
              { label: 'Hazır arama', val: readiness.readyToCall, sub: 'telefon bilgisi tamam' },
              { label: 'Veri tamamlama', val: readiness.needsData, sub: 'telefon / adres eksik' },
              { label: 'Teklif hazır', val: readiness.proposalReady, sub: 'rapor + taslak + paket hazır' },
            ].map(r => (
              <div key={r.label} style={{ flex: 1, background: 'var(--raised)', borderRadius: 14, padding: '16px 18px' }}>
                <div style={{ fontFamily: "'Space Grotesk'", fontSize: 28, fontWeight: 700, color: 'var(--tx)' }}>{r.val}</div>
                <div style={{ fontSize: 12.5, fontWeight: 600, marginTop: 4, color: 'var(--tx)' }}>{r.label}</div>
                <div style={{ fontSize: 11.5, color: 'var(--muted)', marginTop: 2 }}>{r.sub}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    );
  }

  const rp = {
    grid:     { display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 14, padding: '24px 32px 40px' },
    card:     { background: 'var(--panel)', border: '1px solid var(--line)', borderRadius: 'var(--r)', padding: 22, display: 'flex', flexDirection: 'column' },
    cardTitle:{ fontSize: 13, fontWeight: 600, marginBottom: 4, color: 'var(--tx)' },
    cardSub:  { fontSize: 11.5, color: 'var(--muted)', marginBottom: 18 },
    stack:    { display: 'flex', flexDirection: 'column', gap: 14 },
    rowHead:  { display: 'flex', justifyContent: 'space-between', fontSize: 12, marginBottom: 6 },

  // ── Profile View ──────────────────────────────────────────────────────────

  function ProfileView({ user, users, summary, assignments, onLogout }) {
    const list = React.useMemo(() => {
      const byEmail = new Map();
      (users || []).forEach(item => {
        if (item?.email) byEmail.set(item.email, item);
      });
      if (user?.email && !byEmail.has(user.email)) byEmail.set(user.email, user);
      return [...byEmail.values()].sort((a, b) => {
        const ar = a.role === 'admin' ? 0 : 1;
        const br = b.role === 'admin' ? 0 : 1;
        if (ar !== br) return ar - br;
        return String(a.name || a.email).localeCompare(String(b.name || b.email), 'tr');
      });
    }, [users, user]);

    const assignmentCounts = React.useMemo(() => {
      const counts = {};
      (assignments || []).forEach(item => {
        if (item.status !== 'active') return;
        counts[item.user_email] = (counts[item.user_email] || 0) + 1;
      });
      return counts;
    }, [assignments]);

    const currentEmail = user?.email;
    const current = list.find(item => item.email === currentEmail) || user || {};
    const currentCount = user?.role === 'admin'
      ? (summary?.assigned_count ?? Object.values(assignmentCounts).reduce((a, b) => a + b, 0))
      : (summary?.assigned_count ?? assignmentCounts[currentEmail] ?? 0);
    const activeMembers = list.filter(item => item.active !== false).length;
    const bossCount = list.filter(item => item.role === 'admin').length;
    const salesCount = list.filter(item => item.role === 'sales').length;

    return (
      <div style={pf.root}>
        <div style={{ ...pv.header, display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 18 }}>
          <div>
            <div style={pv.pageEyebrow}>PROFİL</div>
            <h1 style={pv.pageTitle}>Ekip ve hesap</h1>
            <p style={pv.pageSub}>Aktif oturum, ekip rolleri ve profil fotoğrafları.</p>
          </div>
          <button style={ld.btnGhost} onClick={onLogout}>Çıkış yap</button>
        </div>

        <div style={pf.hero}>
          <div style={pf.heroPhotoWrap}>
            {current.avatar_url ? <img src={current.avatar_url} alt={current.name || current.email || 'Profil'} style={pf.heroPhoto}/> : <div style={pf.heroInitial}>{initialsFor(current.name || current.email)}</div>}
          </div>
          <div style={{ minWidth: 0, flex: 1 }}>
            <div style={pf.heroEyebrow}>Şu an bu hesaptasın</div>
            <div style={pf.heroName}>{current.name || current.email}</div>
            <div style={pf.heroMeta}>
              <span>{current.email}</span>
              <span>·</span>
              <span>{current.title || roleLabel(current.role)}</span>
            </div>
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginTop: 16 }}>
              <ProfilePill role={current.role}/>
              <span style={pf.softPill}>{current.active === false ? 'Pasif' : 'Aktif hesap'}</span>
              <span style={pf.softPill}>{currentCount} atanmış lead</span>
            </div>
          </div>
          <div style={pf.heroStats}>
            <div style={pf.statBox}><span>{list.length}</span><small>Toplam kişi</small></div>
            <div style={pf.statBox}><span>{activeMembers}</span><small>Aktif</small></div>
            <div style={pf.statBox}><span>{bossCount}</span><small>Patron</small></div>
            <div style={pf.statBox}><span>{salesCount}</span><small>Çalışan</small></div>
          </div>
        </div>

        <div style={pf.sectionHead}>
          <div>
            <div style={ld.eyebrow}>EKİP</div>
            <div style={pf.sectionTitle}>Zeplin kullanıcıları</div>
          </div>
          <div style={pf.sectionHint}>Fotoğraflar canlı profilden geliyor.</div>
        </div>

        <div style={pf.teamGrid}>
          {list.map(member => {
            const isMe = member.email === currentEmail;
            const count = assignmentCounts[member.email] || 0;
            return (
              <div key={member.email} style={{ ...pf.memberCard, ...(isMe ? pf.memberCardActive : null) }}>
                <div style={pf.memberPhotoWrap}>
                  {member.avatar_url ? <img src={member.avatar_url} alt={member.name || member.email} style={pf.memberPhoto}/> : <div style={pf.memberInitial}>{initialsFor(member.name || member.email)}</div>}
                  {isMe && <span style={pf.meBadge}>Bu hesap</span>}
                </div>
                <div style={pf.memberBody}>
                  <div style={pf.memberName}>{member.name || member.email}</div>
                  <div style={pf.memberEmail}>{member.email}</div>
                  <div style={{ display: 'flex', gap: 7, flexWrap: 'wrap', marginTop: 12 }}>
                    <ProfilePill role={member.role}/>
                    <span style={pf.softPill}>{member.title || roleLabel(member.role)}</span>
                    <span style={member.active === false ? pf.passivePill : pf.softPill}>{member.active === false ? 'Pasif' : 'Aktif'}</span>
                  </div>
                </div>
                <div style={pf.memberFooter}>
                  <span>Atanmış lead</span>
                  <strong>{user?.role === 'admin' || isMe ? count : '—'}</strong>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  function ProfilePill({ role }) {
    const tone = roleTone(role);
    return <span style={{ ...pf.rolePill, background: tone.bg, color: tone.fg, borderColor: tone.bd }}>{roleLabel(role)}</span>;
  }

    meBadge:        { position: 'absolute', top: 12, left: 12, background: 'var(--accent)', color: 'var(--accent-ink)', borderRadius: 999, padding: '6px 10px', fontSize: 11, fontWeight: 700 },

    memberName:     { fontFamily: "'Space Grotesk'", fontSize: 18, fontWeight: 700, letterSpacing: '-0.02em', color: 'var(--tx)' },
    memberEmail:    { marginTop: 4, fontSize: 12.5, color: 'var(--muted)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' },
    memberFooter:   { marginTop: 'auto', padding: '12px 16px', borderTop: '1px solid var(--line)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', color: 'var(--sub)', fontSize: 12.5 },
    rolePill:       { border: '1px solid', borderRadius: 999, padding: '5px 9px', fontSize: 11.5, fontWeight: 700 },
    softPill:       { border: '1px solid var(--line)', background: 'var(--raised)', color: 'var(--sub)', borderRadius: 999, padding: '5px 9px', fontSize: 11.5, fontWeight: 600 },
    passivePill:    { border: '1px solid rgba(255,107,107,0.25)', background: 'rgba(255,107,107,0.1)', color: '#ff8f8f', borderRadius: 999, padding: '5px 9px', fontSize: 11.5, fontWeight: 600 },
  };

  // ── Login ──────────────────────────────────────────────────────────────────

  function LoginView({ onSubmit }) {
    const [role, setRole]         = React.useState('admin');
    const [email, setEmail]       = React.useState('');
    const [password, setPassword] = React.useState('');
    const [error, setError]       = React.useState(false);
    const [busy, setBusy]         = React.useState(false);

    const totalLeads = leads.length;
    const converted   = leads.filter(l => (getStatuses()[l.name] || 'yeni') === 'converted').length;
    const pipelineVal = leads.reduce((s, l) => s + (l.estimated_value_tl || 0), 0);

    function submit(e) {
      e.preventDefault();
      if (busy) return;
      setBusy(true);
      setError(false);
      onSubmit(email, password, role).catch(() => setError(true)).finally(() => setBusy(false));
    }

    return (
      <div style={lv.root}>
        <div style={lv.brandPane}>
          <div style={lv.glow}/>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, position: 'relative' }}>
            <div style={lv.brandLogo}><img src="/logo-mark.png" alt="Zeplin Media" style={{ width: '78%', height: '78%', objectFit: 'contain' }}/></div>
            <div style={{ lineHeight: 1.05 }}>
              <div style={{ fontWeight: 700, fontSize: 16, letterSpacing: '-0.01em' }}>Zeplin Media</div>
              <div style={{ fontSize: 11, color: '#a6a28f' }}>Lead Intelligence</div>
            </div>
          </div>
          <div style={{ position: 'relative', maxWidth: 400 }}>
            <div style={{ fontFamily: "'Space Grotesk'", fontSize: 34, fontWeight: 700, letterSpacing: '-0.02em', lineHeight: 1.1 }}>Bugün kimi arayacağını bilerek başla.</div>
            <div style={{ marginTop: 14, fontSize: 14.5, color: '#a6a28f', lineHeight: 1.5 }}>Yapay zekâ her lead için sıradaki en iyi aksiyonu, gerekçesini ve hazır mesajını hazırlar. Sen sadece ara.</div>
          </div>
          <div style={{ position: 'relative', display: 'flex', gap: 26, flexWrap: 'wrap' }}>
            <div><div style={lv.statVal}>{totalLeads}</div><div style={lv.statLbl}>Aktif lead</div></div>
            <div><div style={{ ...lv.statVal, color: '#fff' }}>{converted}</div><div style={lv.statLbl}>Kazanıldı</div></div>
            <div><div style={{ ...lv.statVal, color: '#fff' }}>~{fmt(pipelineVal)} ₺</div><div style={lv.statLbl}>Pipeline değeri</div></div>
          </div>
        </div>

        <div style={lv.formPane}>
          <form style={lv.formCard} onSubmit={submit}>
            <div style={{ fontFamily: "'Space Grotesk'", fontSize: 23, fontWeight: 700, letterSpacing: '-0.02em', color: 'var(--tx)' }}>Panele giriş</div>
            <div style={{ fontSize: 13.5, color: 'var(--sub)', marginTop: 4 }}>Rolünü seç ve devam et</div>

            <div style={lv.roleTabs}>
              <button type="button" style={role === 'admin' ? lv.roleTabActive : lv.roleTab} onClick={() => setRole('admin')}>Yönetici</button>
              <button type="button" style={role === 'sales' ? lv.roleTabActive : lv.roleTab} onClick={() => setRole('sales')}>Çalışan</button>
            </div>

            <div style={{ marginTop: 18, display: 'flex', flexDirection: 'column', gap: 12 }}>
              <label style={lv.label}>E-posta
                <input value={email} onChange={e => setEmail(e.target.value)} placeholder="ad@zeplinmedia.com" style={lv.input}/>
              </label>
              <label style={lv.label}>Şifre
                <input value={password} onChange={e => setPassword(e.target.value)} type="password" placeholder="••••••••" style={lv.input}/>
              </label>
            </div>

            {error && <div style={lv.error}>E-posta veya şifre hatalı. Tekrar dene.</div>}

            <button style={{ ...lv.submitBtn, opacity: busy ? 0.75 : 1 }} disabled={busy}>
              {busy ? <span style={lv.spinner}/> : null}
              {busy ? 'Giriş yapılıyor…' : 'Giriş yap'}
            </button>
            <div style={lv.hint}>Yönetici ve çalışan girişleri Supabase ekip hesaplarıyla yapılır.</div>
          </form>
        </div>
      </div>
    );
  }

  const lv = {
    root:         { minHeight: '100vh', display: 'flex', flexWrap: 'wrap' },
    brandPane:    { flex: '1 1 420px', minHeight: 320, background: '#0a0906', color: '#fbfaf4', padding: 48, display: 'flex', flexDirection: 'column', justifyContent: 'space-between', position: 'relative', overflow: 'hidden' },
    glow:         { position: 'absolute', top: -120, right: -80, width: 360, height: 360, borderRadius: 999, background: 'radial-gradient(circle, rgba(197,242,74,0.22), transparent 68%)' },
    brandLogo:    { width: 34, height: 34, borderRadius: 9, background: 'var(--accent)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, overflow: 'hidden' },
    statVal:      { fontFamily: "'Space Grotesk'", fontSize: 26, fontWeight: 700, color: 'var(--accent)' },
    statLbl:      { fontSize: 11.5, color: '#a6a28f' },
    formPane:     { flex: '1 1 420px', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 40, background: 'var(--bg)' },
    formCard:     { width: '100%', maxWidth: 380 },
    roleTabs:     { marginTop: 22, display: 'flex', background: 'var(--panel2)', border: '1px solid var(--line)', borderRadius: 12, padding: 4, gap: 4 },
    roleTab:      { flex: 1, height: 38, border: 'none', borderRadius: 9, cursor: 'pointer', fontFamily: "'Instrument Sans'", fontSize: 13, fontWeight: 600, background: 'transparent', color: 'var(--muted)' },
    roleTabActive:{ flex: 1, height: 38, border: 'none', borderRadius: 9, cursor: 'pointer', fontFamily: "'Instrument Sans'", fontSize: 13, fontWeight: 600, background: 'var(--panel)', color: 'var(--tx)', boxShadow: '0 1px 3px rgba(0,0,0,0.16)' },
    label:        { display: 'flex', flexDirection: 'column', gap: 6, fontSize: 12.5, fontWeight: 600, color: 'var(--sub)' },
    input:        { height: 44, padding: '0 14px', border: '1px solid var(--line)', borderRadius: 11, background: 'var(--panel)', color: 'var(--tx)', fontFamily: "'Instrument Sans'", fontSize: 14, fontWeight: 500, outline: 'none' },
    error:        { marginTop: 12, display: 'flex', alignItems: 'center', gap: 8, padding: '10px 12px', background: 'rgba(255,107,107,0.12)', color: '#ff8f8f', borderRadius: 10, fontSize: 12.5, fontWeight: 600 },
    submitBtn:    { marginTop: 18, width: '100%', height: 46, border: 'none', borderRadius: 12, background: 'var(--accent)', color: 'var(--accent-ink)', fontFamily: "'Instrument Sans'", fontSize: 14.5, fontWeight: 700, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 9 },
    spinner:      { width: 15, height: 15, border: '2px solid rgba(18,20,10,0.35)', borderTopColor: '#12140a', borderRadius: 999, display: 'inline-block', animation: 'zspin .7s linear infinite' },
    hint:         { marginTop: 14, fontSize: 11.5, color: 'var(--muted)', textAlign: 'center', lineHeight: 1.5 },
  };

  function SearchDialog({ rows, onSelect, onClose }) {
    const [query, setQuery] = React.useState('');
    const results = React.useMemo(() => searchLeads(rows, query), [rows, query]);

    React.useEffect(() => {
      function handleKey(event) {
        if (event.key === 'Escape') onClose();
      }
      window.addEventListener('keydown', handleKey);
      return () => window.removeEventListener('keydown', handleKey);
    }, [onClose]);

    return (
      <div role="presentation" style={dialog.overlay} onMouseDown={event => { if (event.target === event.currentTarget) onClose(); }}>
        <section role="dialog" aria-modal="true" aria-label="Lead ara" style={dialog.panel}>
          <div style={dialog.head}>
            <div>
              <div style={pv.pageEyebrow}>HIZLI ERİŞİM</div>
              <div style={ld.cardTitle}>Lead ara</div>
            </div>
            <button type="button" title="Kapat" style={tb.iconBtn} onClick={onClose}>×</button>
          </div>
          <input autoFocus value={query} onChange={event => setQuery(event.target.value)} placeholder="Firma, ilçe, hizmet veya telefon" style={dialog.input}/>
          <div style={dialog.results}>
            {results.map(lead => {
              const index = rows.indexOf(lead);
              return (
                <button type="button" key={lead.name} style={dialog.result} onClick={() => onSelect(index)}>
                  <span>
                    <strong style={{ color: 'var(--tx)' }}>{lead.name}</strong>
                    <span style={dialog.meta}>{lead.city || 'Bölge yok'} · {lead.category || lead.sector || 'Kategori yok'}</span>
                  </span>
                  <span style={statusChipStyle(getStatuses()[lead.name] || 'yeni')}>{statusMeta(getStatuses()[lead.name] || 'yeni').label}</span>
                </button>
              );
            })}
            {!results.length && <div style={dialog.empty}>Bu aramayla eşleşen lead bulunamadı.</div>}
          </div>
        </section>
      </div>
    );
  }

  function ConfirmDialog({ title, text, confirmLabel, onConfirm, onCancel, busy }) {
    return (
      <div role="presentation" style={dialog.overlay} onMouseDown={event => { if (event.target === event.currentTarget && !busy) onCancel(); }}>
        <section role="alertdialog" aria-modal="true" aria-label={title} style={{ ...dialog.panel, maxWidth: 420 }}>
          <div style={ld.cardTitle}>{title}</div>
          <p style={{ color: 'var(--sub)', fontSize: 13.5, lineHeight: 1.6, margin: '10px 0 20px' }}>{text}</p>
          <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 8 }}>
            <button type="button" style={ld.btnGhost} disabled={busy} onClick={onCancel}>Vazgeç</button>
            <button type="button" style={av.primaryBtn} disabled={busy} onClick={onConfirm}>{busy ? 'Çıkış yapılıyor…' : confirmLabel}</button>
          </div>
        </section>
      </div>
    );
  }

  const dialog = {
    overlay: { position: 'fixed', inset: 0, zIndex: 90, display: 'grid', placeItems: 'start center', padding: '12vh 18px 24px', background: 'rgba(0,0,0,0.56)', backdropFilter: 'blur(5px)' },
    panel: { width: '100%', maxWidth: 620, maxHeight: '72vh', overflow: 'hidden', padding: 20, borderRadius: 12, border: '1px solid var(--line)', background: 'var(--panel)', boxShadow: '0 24px 80px rgba(0,0,0,0.34)' },
    head: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 16, marginBottom: 14 },
    input: { width: '100%', height: 46, padding: '0 14px', borderRadius: 10, border: '1px solid var(--line)', background: 'var(--bg)', color: 'var(--tx)', font: '500 14px Instrument Sans', outline: 'none' },
    results: { display: 'flex', flexDirection: 'column', gap: 6, marginTop: 12, maxHeight: '48vh', overflowY: 'auto' },
    result: { width: '100%', minHeight: 58, display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 16, padding: '10px 12px', borderRadius: 9, border: '1px solid var(--line)', background: 'var(--bg)', textAlign: 'left', cursor: 'pointer' },
    meta: { display: 'block', marginTop: 3, color: 'var(--muted)', fontSize: 11.5 },
    empty: { padding: 24, color: 'var(--muted)', fontSize: 13, textAlign: 'center' },
  };

  // ── App ────────────────────────────────────────────────────────────────────

  function Dashboard({ user, theme, onToggleTheme, onLogout }) {
    const [view,        setView]        = React.useState('cockpit');
    const [selectedIdx, setSelectedIdx] = React.useState(0);
    const [leadRows,    setLeadRows]    = React.useState(() => leads.slice());
    const [statuses,    setStatuses]    = React.useState(() => getStatuses());
    const [summary,     setSummary]     = React.useState(null);
    const [assignments, setAssignments] = React.useState([]);
    const [teamUsers,   setTeamUsers]   = React.useState([]);
    const [loading,     setLoading]     = React.useState(true);
    const [dataError,   setDataError]   = React.useState('');
    const [searchOpen,  setSearchOpen]  = React.useState(false);

    const sorted = React.useMemo(
      () => [...leadRows].sort((a, b) => b.scoring.score - a.scoring.score),
      [leadRows]
    );

    function syncSharedState(next = {}) {
      setLeadRows(leads.slice());
      setStatuses({ ...getStatuses() });
      if (next.summary !== undefined) setSummary(next.summary);
      if (next.assignments !== undefined) setAssignments(next.assignments);
    }

    function hydrateWorkspace(data) {
      if (Array.isArray(data.leads)) {
        apiReady = true;
        applyRemoteLeads(data.leads);
      }
      if (Array.isArray(data.outreach)) {
        applyRemoteOutreach(data.outreach);
      }
      syncSharedState({
        summary: data.summary || null,
        assignments: Array.isArray(data.assignments) ? data.assignments : [],
      });
    }

    function refreshWorkspace() {
      return fetchJSON('/api/workspace')
        .then(data => {
          hydrateWorkspace(data);
          setDataError('');
        })
        .catch(err => {
          apiReady = false;
          setDataError(err.message);
          leads = [];
          outreachEvents = [];
          syncSharedState({ summary: null, assignments: [] });
        });
    }

    function refreshTeamUsers() {
      return fetchJSON('/api/users')
        .then(data => setTeamUsers(Array.isArray(data.users) ? data.users : []))
        .catch(err => {
          console.warn('Users API fallback:', err);
          setTeamUsers(user ? [user] : []);
        });
    }

    function handleStatusChange(name, s) {
      setStatusLS(name, s)
        .then(refreshWorkspace)
        .catch(err => setDataError(err.message || 'Durum kaydedilemedi'));
    }

    function navigate(v) { setView(v); }

    function selectLead(i) { setSelectedIdx(i); setView('detail'); }

    function openSearch() { setSearchOpen(true); }

    function openAdmin() { setView('admin'); }

    function handleAutomationClick() {
      if (user?.role === 'admin') setView('admin');
    }

    React.useEffect(() => {
      Promise.all([refreshWorkspace(), refreshTeamUsers()]).finally(() => setLoading(false));
    }, []);

    React.useEffect(() => {
      if (selectedIdx > Math.max(sorted.length - 1, 0)) {
        setSelectedIdx(0);
      }
    }, [selectedIdx, sorted.length]);

    function renderContent() {
      if (loading) {
        return <div style={{ flex: 1, display: 'grid', placeItems: 'center', color: 'var(--sub)', background: 'var(--bg)' }}>Workspace yükleniyor.</div>;
      }
      if (dataError && !sorted.length) {
        return (
          <div style={{ flex: 1, display: 'grid', placeItems: 'center', background: 'var(--bg)' }}>
            <div style={av.loginCard}>
              <div style={pv.pageEyebrow}>BAĞLANTI</div>
              <h1 style={pv.pageTitle}>Veri alınamadı</h1>
              <p style={av.text}>{dataError}</p>
              <button style={av.primaryBtn} onClick={() => { setLoading(true); refreshWorkspace().finally(() => setLoading(false)); }}>Tekrar dene</button>
            </div>
          </div>
        );
      }
      if (view === 'profile') {
        return <ProfileView user={user} users={teamUsers} summary={summary} assignments={assignments} onLogout={onLogout}/>;
      }
      if (view === 'admin') {
        return <AdminView user={user} />;
      }
      if (!sorted.length) {
        return <div style={{ flex: 1, display: 'grid', placeItems: 'center', color: 'var(--sub)', background: 'var(--bg)' }}>{user?.role === 'sales' ? 'Sana atanmış aktif lead yok.' : 'Lead verisi bulunamadı.'}</div>;
      }
      switch (view) {
        case 'detail':
          return (
            <LeadDetail
              lead={sorted[selectedIdx]}
              idx={selectedIdx}
              total={sorted.length}
              status={statuses[sorted[selectedIdx].name] || 'yeni'}
              onStatusChange={s => handleStatusChange(sorted[selectedIdx].name, s)}
              onDataChange={refreshWorkspace}
              onBack={() => setView('cockpit')}
              onPrev={() => setSelectedIdx(i => Math.max(0, i - 1))}
              onNext={() => setSelectedIdx(i => Math.min(sorted.length - 1, i + 1))}
            />
          );
        case 'pipeline':
          return <PipelineView leads={sorted} onSelect={selectLead} onDataChange={refreshWorkspace}/>;
        case 'hizmetler':
          return <HizmetlerView leads={leadRows} />;
        case 'raporlar':
          return <RaporlarView leads={sorted} statuses={statuses} onSelect={selectLead}/>;
        case 'analytics':
          return <AnalyticsView leads={sorted} statuses={statuses}/>;
        default:
          return <CockpitMain leads={sorted} statuses={statuses} onSelect={selectLead} onOpenAdmin={openAdmin} user={user} summary={summary} assignments={assignments}/>;
      }
    }

    return (
      <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100vh', width: '100%' }}>
        <Topbar view={view} onNav={navigate} leadCount={leadRows.length} onAutomationClick={handleAutomationClick} onOpenSearch={openSearch} theme={theme} onToggleTheme={onToggleTheme} user={user} onLogout={onLogout}/>
        <div style={{ display: 'flex', flex: 1, minWidth: 0 }}>
          {renderContent()}
        </div>
        {searchOpen && <SearchDialog rows={sorted} onClose={() => setSearchOpen(false)} onSelect={index => { setSearchOpen(false); selectLead(index); }}/>}
      </div>
    );
  }

  // ── Root: theme + auth gate ─────────────────────────────────────────────────

  function App() {
    const [theme, setTheme] = React.useState(() => (document.documentElement.dataset.theme === 'light' ? 'light' : 'dark'));
    const [auth, setAuth]   = React.useState({ loading: true, configured: false, authenticated: false, user: null });
    const [logoutOpen, setLogoutOpen] = React.useState(false);
    const [logoutBusy, setLogoutBusy] = React.useState(false);

    React.useEffect(() => {
      document.documentElement.dataset.theme = theme;
      try { localStorage.setItem('zeplin_theme', theme); } catch (e) {}
    }, [theme]);

    function toggleTheme() { setTheme(t => (t === 'light' ? 'dark' : 'light')); }

    React.useEffect(() => {
      fetchJSON('/api/auth').then(data => {
        setAuth({ loading: false, configured: data.configured !== false, authenticated: Boolean(data.authenticated), user: data.user || null });
      }).catch(() => {
        setAuth({ loading: false, configured: true, authenticated: false, user: null });
      });
    }, []);

    function login(email, password, role) {
      return fetchJSON('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, role }),
      }).then(data => {
        setAuth({ loading: false, configured: true, authenticated: true, user: data.user || null });
      });
    }

    function logout() {
      setLogoutBusy(true);
      fetchJSON('/api/auth', { method: 'DELETE' })
        .then(() => {
          setLogoutOpen(false);
          setAuth({ loading: false, configured: true, authenticated: false, user: null });
        })
        .finally(() => setLogoutBusy(false));
    }

    if (auth.loading) {
      return <div style={{ minHeight: '100vh', display: 'grid', placeItems: 'center', background: 'var(--bg)', color: 'var(--sub)', fontSize: 13 }}>Yükleniyor…</div>;
    }

    if (!auth.authenticated) {
      return <LoginView onSubmit={login}/>;
    }

    return (
      <React.Fragment>
        <Dashboard user={auth.user} theme={theme} onToggleTheme={toggleTheme} onLogout={() => setLogoutOpen(true)}/>
        {logoutOpen && (
          <ConfirmDialog
            title="Oturumu kapat"
            text="Bu cihazdaki Zeplin oturumun kapatılacak."
            confirmLabel="Çıkış yap"
            busy={logoutBusy}
            onCancel={() => setLogoutOpen(false)}
            onConfirm={logout}
          />
        )}
      </React.Fragment>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
