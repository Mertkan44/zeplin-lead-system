  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Zeplin Media · Lead Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root, [data-theme="dark"] {
      --accent: #c5f24a; --accent-ink: #12140a;
      --bg: #0a0a0b; --panel: #141418; --panel2: #17171c; --raised: #1c1c22;
      --line: rgba(255,255,255,0.07); --line2: rgba(255,255,255,0.12);
      --tx: #f3f3f0; --sub: #93938f; --muted: #5c5c5a;
      --selected-bg: #000000; --selected-tx: #f3f3f0;
      --warn-bg: rgba(244,197,107,0.12); --warn-tx: #f4c56b;
      --glow: radial-gradient(1200px 600px at 78% -8%, rgba(197,242,74,0.06), transparent 60%);
      --r: 26px; --rs: 18px;
    }
    [data-theme="light"] {
      --accent: #c5f24a; --accent-ink: #12140a;
      --bg: #faf9f4; --panel: #ffffff; --panel2: #f3f1e9; --raised: #efece0;
      --line: #e9e4d6; --line2: #ddd6c2;
      --tx: #0c0b08; --sub: #4a4535; --muted: #8b856f;
      --selected-bg: #0c0b08; --selected-tx: #faf9f4;
      --warn-bg: #fff4dc; --warn-tx: #855500;
      --glow: radial-gradient(1200px 600px at 78% -8%, rgba(197,242,74,0.14), transparent 60%);
    }
    html, body { min-height: 100vh; background: var(--bg); overflow-x: hidden; }
    body { font-family: 'Instrument Sans', system-ui, sans-serif; color: var(--tx); -webkit-font-smoothing: antialiased; background: var(--glow), var(--bg); transition: background-color .2s, color .2s; }
    #root { min-height: 100vh; display: flex; flex-direction: column; }
    button { font-family: inherit; }
    textarea, input, select { font-family: inherit; }
    a { text-decoration: none; color: inherit; }
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 99px; }
    ::-webkit-scrollbar-track { background: transparent; }
    .pipe-card.dragging { opacity: 0.4; }
    .pipe-col.drag-over { background: var(--raised); }
    .ll-row:hover { background: var(--raised); }
    .hide-sb { scrollbar-width: none; -ms-overflow-style: none; }
    .hide-sb::-webkit-scrollbar { display: none; }
    @keyframes zspin { to { transform: rotate(360deg); } }
    @media (max-width: 1080px) {
      .tb-search-label { display: none !important; }
      .tb-nav-item { padding: 9px 11px !important; font-size: 12px !important; }
      .contact-center-grid { grid-template-columns: 1fr !important; }
    }
    @media (max-width: 760px) {
      .responsive-kpis, .responsive-main, .responsive-detail, .responsive-admin, .responsive-report {
        grid-template-columns: 1fr !important;
      }
      .responsive-stats { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
      .responsive-opportunity-columns { grid-template-columns: 1fr !important; }
      .responsive-main, .responsive-kpis, .responsive-detail, .responsive-admin, .responsive-report {
        padding-left: 14px !important;
        padding-right: 14px !important;
      }
      .responsive-table { overflow-x: auto !important; padding-left: 14px !important; padding-right: 14px !important; }
      .responsive-table-head, .responsive-table-row { min-width: 760px; }
      .responsive-pipeline { overflow-x: auto !important; padding-left: 14px !important; padding-right: 14px !important; }
      .responsive-pipeline > * { min-width: 270px; }
      .responsive-report > [style*="grid-column"] { grid-column: auto !important; }
      .tb-brand-text, .tb-search-mobile, .tb-automation-mobile { display: none !important; }
      .tb-nav { flex: 1 1 auto !important; min-width: 0 !important; }
      .today-main { padding: 24px 16px 48px !important; }
      .today-hero { display: block !important; }
      .today-title { font-size: 40px !important; }
      .today-hero-stats { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; margin-top: 20px !important; }
      .today-hero-stat { min-width: 0 !important; padding: 12px 10px !important; }
      .today-section-head { align-items: flex-start !important; }
      .today-task-card { grid-template-columns: 36px minmax(0, 1fr) !important; }
      .today-task-body { padding: 16px 14px !important; }
      .today-task-top { display: block !important; }
      .today-task-actions { display: grid !important; grid-template-columns: repeat(3, minmax(0, 1fr)) !important; margin-top: 14px !important; }
      .today-task-actions > * { min-width: 0 !important; padding-left: 7px !important; padding-right: 7px !important; }
      .lead-detail-root { padding: 18px 16px 42px !important; }
      .lead-detail-top { align-items: flex-start !important; gap: 12px !important; }
      .lead-detail-top > div:last-child { display: none !important; }
      .lead-detail-hero { display: block !important; }
      .lead-detail-hero > div:last-child { margin-top: 20px !important; justify-content: flex-start !important; }
      .responsive-detail > * { min-width: 0 !important; }
      .lead-sales-evidence { grid-template-columns: 1fr !important; }
      .lead-comms-head, .lead-draft-footer { align-items: flex-start !important; flex-direction: column !important; }
      .lead-draft-footer > div { width: 100% !important; }
      .lead-draft-footer button { flex: 1 !important; }
      .lead-research-stats { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
      .lead-research-columns, .lead-script-grid { padding-left: 16px !important; padding-right: 16px !important; }
      .lead-comms { padding-left: 16px !important; padding-right: 16px !important; }
      .lead-channel-tabs { flex-wrap: wrap !important; overflow-x: visible !important; }
      .manual-verification-grid { grid-template-columns: 1fr !important; }
      .manual-field-grid { grid-template-columns: 1fr !important; }
      .manual-verification-grid + div { align-items: stretch !important; flex-direction: column !important; }
    }
  </style>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('zeplin_theme');
        document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>

  // ── Helpers ────────────────────────────────────────────────────────────────

  function fmt(n) {
    if (n === null || n === undefined || n === '') return '—';

    if (!Number.isFinite(value)) return '—';
    if (value === 0) return '0';
    if (value >= 1000000) return (value / 1000000).toFixed(1) + 'M';
    if (value >= 1000) return Math.round(value / 1000) + 'K';
    return String(value);
  }

  function fmtDate(str) {
    if (!str) return '';
    try {
      const d = new Date(str.replace(' ', 'T'));

      return d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', year: 'numeric' });

      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, status: s }),
    }).then(res => {
      notifyIfSessionExpired(res);
      if (!res.ok) throw new Error('status_save_failed');
      return res.json();
    });
  }
  function setStatusLS(name, s) {
    const previous = remoteStatuses[name];
    remoteStatuses[name] = s;
    return persistStatus(name, s).catch(err => {
      if (previous === undefined) delete remoteStatuses[name];
      else remoteStatuses[name] = previous;
      throw err;
    });
  }

  function normalizeOutreachEvent(item) {
    if (!item) return null;
    return {
      lead: item.lead || item.lead_name || '',
      action: item.action || 'note_added',
      date: item.date || item.happened_at || item.created_at || new Date().toISOString(),
      note: item.note || '',
      channel: item.channel || null,
      channelLabel: item.channel_label || null,
      outcome: item.outcome || null,
      outcomeLabel: item.outcome_label || null,
      followUpAt: item.follow_up_at || null,
      serviceSlugs: item.service_slugs || [],
      contactName: item.contact_name || null,
      draftStatus: item.draft_status || null,
      draftSubject: item.draft_subject || null,
      draftBody: item.draft_body || null,
      manualVerification: item.manual_verification || item.manualVerification || null,
      ts: item.ts || item.id || Date.now(),
    };
  }
  function getOutreach() {
    return outreachEvents;
  }
  function saveOutreach(arr) {
    outreachEvents = (arr || []).map(normalizeOutreachEvent).filter(Boolean);
  }
  function getLeadEvents(name) {
    return getOutreach().filter(e => e.lead === name).sort((a, b) => b.date.localeCompare(a.date));
  }
  // One id per logical submission; a retry of the same submission reuses it.
  function newRequestId() {
    if (window.crypto?.randomUUID) return window.crypto.randomUUID();
    const bytes = window.crypto.getRandomValues(new Uint8Array(16));
    bytes[6] = (bytes[6] & 0x0f) | 0x40;
    bytes[8] = (bytes[8] & 0x3f) | 0x80;
    const hex = [...bytes].map(b => b.toString(16).padStart(2, '0')).join('');
    return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`;
  }

  const OUTREACH_ERRORS = {
    LEAD_VERSION_CONFLICT: 'Bu lead sen formu doldururken başka bir işlemle güncellendi. Güncel veriyi alıp tekrar kaydet.',
    LEAD_NOT_ASSIGNED: 'Bu lead artık sana atanmış değil; sonuç kaydedilmedi.',
    LEAD_NOT_FOUND: 'Lead bulunamadı; silinmiş veya birleştirilmiş olabilir.',
    IDEMPOTENCY_KEY_REUSED: 'Form değişti; tekrar kaydet.',
  };

  function outreachError(code) {
    const err = new Error(OUTREACH_ERRORS[code] || 'Sonuç kaydedilemedi. Bağlantını kontrol edip tekrar dene.');
    err.code = code || 'outreach_save_failed';
    return err;
  }

  function persistOutreachEvent(evt) {
    if (!apiReady) return Promise.reject(new Error('api_not_ready'));
    return fetch('/api/outreach', {
      method: 'POST',
      keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        lead_name: evt.lead,
        action: evt.action,
        happened_at: evt.date,
        note: evt.note,
        channel: evt.channel,
        outcome: evt.outcome,
        follow_up_at: evt.followUpAt,
        service_slugs: evt.serviceSlugs,
        contact_name: evt.contactName,
        draft_status: evt.draftStatus,
        subject: evt.draftSubject,
        body: evt.draftBody,
        manual_verification: evt.manualVerification,
        expected_revision: evt.expectedRevision ?? null,
        source: 'dashboard',
        idempotency_key: evt.requestId || newRequestId(),
      }),
    }).then(async res => {
      notifyIfSessionExpired(res);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw outreachError(data.code);
      return data;
    });
  }
  function addOutreach(name, action, date, note, requestId) {
    const evt = { lead: name, action, date, note, requestId, ts: Date.now() };
    return persistOutreachEvent(evt).then(() => {
      const arr = getOutreach();
      arr.push(evt);
      saveOutreach(arr);
      const act = ACTIONS[action];
      if (act && act.status) return setStatusLS(name, act.status);
    });
  }

  // values.followUpAt is sent only when the user picked a date; otherwise the
  // server applies the default rule. requestId stays the same across retries.
  function saveContactResult(lead, values, requestId) {
    const evt = {
      lead: lead.name,
      action: 'contact_result_recorded',
      note: values.note || '',
      channel: values.channel,
      outcome: values.outcome,
      followUpAt: values.followUpAt || null,
      serviceSlugs: values.serviceSlugs || [],
      contactName: values.contactName || null,
      expectedRevision: Number.isInteger(lead.revision) ? lead.revision : null,
      requestId,
      ts: Date.now(),
    };
    return persistOutreachEvent(evt).then(data => {
      const saved = normalizeOutreachEvent(data.event || evt);
      const arr = getOutreach().filter(item => item.ts !== saved.ts);
      arr.push(saved);
      saveOutreach(arr);
      if (data.status) remoteStatuses[lead.name] = data.status;
      return data;
    });
  }

  function saveLeadAssignment(leadName, userEmail, dueAt) {
    return fetch('/api/assignments', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        lead_name: leadName,
        user_email: userEmail,
        due_at: dueAt ? new Date(dueAt).toISOString() : null,
        status: 'active',
      }),
    }).then(async response => {
      notifyIfSessionExpired(response);
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || 'Atama kaydedilemedi.');
      return data;
    });
  }

  function saveDraftReview(lead, draft) {
    const evt = {
      lead: lead.name,
      action: 'draft_reviewed',
      date: new Date().toISOString(),
      note: '',
      channel: draft.channel,
      draftStatus: 'approved',
      draftSubject: draft.subject || '',
      draftBody: draft.body || '',
      ts: Date.now(),
    };
    return persistOutreachEvent(evt).then(data => {
      const saved = normalizeOutreachEvent((data && data.event) || evt);
      const arr = getOutreach();
      arr.push(saved);
      saveOutreach(arr);
      return data;
    });
  }

  function saveManualVerification(lead, values) {
    const evt = {
      lead: lead.name,
      action: 'manual_verification_saved',
      date: new Date().toISOString(),
      note: '',
      manualVerification: values,
      ts: Date.now(),
    };
    return persistOutreachEvent(evt).then(data => {
      const saved = normalizeOutreachEvent((data && data.event) || evt);
      const arr = getOutreach();
      arr.push(saved);
      saveOutreach(arr);
      return data;
    });
  }

  function applyRemoteLeads(rows) {
    if (!Array.isArray(rows)) return;
    leads = rows.slice();
    remoteStatuses = {};
    leads.forEach(l => { remoteStatuses[l.name] = l.status || 'yeni'; });
  }

  function applyRemoteOutreach(rows) {
    if (!Array.isArray(rows)) return;
    outreachEvents = rows.map(normalizeOutreachEvent).filter(Boolean);
  }

  // A 401 from any CRM endpoint means the session is gone: App clears the CRM
  // state and returns to login. 403 only means "not allowed" and keeps the session.
  function notifyIfSessionExpired(res) {
    if (res.status === 401 && !String(res.url || '').includes('/api/auth')) {
      window.dispatchEvent(new Event('zeplin:session-expired'));
    }
  }

  function fetchJSON(url, options) {
    const opts = { credentials: 'same-origin', ...(options || {}) };
    return fetch(url, opts).then(res => {
      notifyIfSessionExpired(res);
      if (!res.ok) {
        return res.json().catch(() => ({})).then(data => {
          throw new Error(data.error || `request_failed_${res.status}`);
        });
      }
      return res.json();
    });
  }

  function fetchAdminJSON(url, options) {
    const opts = { credentials: 'same-origin', ...(options || {}) };
    opts.headers = { 'Content-Type': 'application/json', ...((options || {}).headers || {}) };
    return fetch(url, opts).then(res => {
      notifyIfSessionExpired(res);
      if (!res.ok) {
        return res.json().catch(() => ({})).then(data => {
          throw new Error(data.error || `request_failed_${res.status}`);
        });
      }
      return res.json();
    });
  }

  function openExternal(url) {
    if (!url) return;
    window.open(url, '_blank', 'noopener,noreferrer');
  }

  function startLeadAction(lead) {
    const nextAction = lead.next_action || 'Sonraki aksiyon başlatıldı';
    const meta = getPrimaryActionMeta(lead);

    if (meta.intent === 'enrich' || meta.intent === 'verify') {
      openExternal(lead.maps_url || lead.website?.website_url || lead.social?.instagram_url);
      return addOutreach(
        lead.name,
        'data_enrichment_started',
        new Date().toISOString(),
        nextAction
      ).then(() => ({
        feedback: meta.intent === 'verify'
          ? 'Doğrulama kaynağı açıldı; uygun hizmeti görüşmede netleştir.'
          : 'Veri tamamlama aksiyonu kaydedildi.',
      }));
    }

    if (meta.intent === 'generate_ai') {
      return fetchJSON('/api/lead_ai', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: lead.name }),
      }).then(data => ({
        feedback: data.lead?.ai_email
          ? 'İhtiyaç raporu ve incelenebilir e-posta taslağı hazırlandı.'
          : 'İhtiyaç raporu hazırlandı. E-posta için yeterli doğrulanmış kanıt bulunmadı.',
      }));
    }

    if (meta.intent === 'draft' && lead.ai_email) {
      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(lead.ai_email).catch(() => {});
      }
      return addOutreach(
        lead.name,
        'email_drafted',
        new Date().toISOString(),
        'Hazır taslak panoya kopyalandı'
      ).then(() => ({ feedback: 'Mail taslağı panoya kopyalandı.' }));
    }

    if (meta.intent === 'call' && lead.phone) {
      window.location.href = `tel:${lead.phone.replace(/\s+/g, '')}`;
      return addOutreach(
        lead.name,
        'call_started',
        new Date().toISOString(),
        nextAction
      ).then(() => ({ feedback: 'Arama ekranı açıldı. Görüşme bitince sonucu ayrıca kaydet.' }));
    }

    return addOutreach(
      lead.name,
      'email_drafted',
      new Date().toISOString(),
      nextAction
    ).then(() => ({ feedback: 'Aksiyon kaydedildi.' }));
  }

  function openFixContext(lead, issue) {
    const target = issue?.source_url || lead.website?.website_url || lead.maps_url || lead.social?.instagram_url;
    const issueText = typeof issue === 'string'
      ? issue
      : [issue?.title, issue?.evidence, issue?.verification].filter(Boolean).join(' — ');
    if (issue && navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(`${lead.name}: ${issueText}`).catch(() => {});
    }
    if (target) {
      openExternal(target);
      return 'Doğrulama kaynağı yeni sekmede açıldı.';
    }
    return `${lead.name} için açılabilecek doğrulama kaynağı bulunamadı.`;
  }

  function createProposal(lead) {
    const recommendation = lead.recommended_package || {};
    const primary = (lead.matched_services || [])[0] || {};
    const evidence = (primary.evidence || recommendation.evidence || []).map(item => `- ${item}`).join('\n');
    const deliverables = (primary.deliverables || recommendation.deliverables || []).slice(0, 3).map(item => `- ${item}`).join('\n');
    const questions = (primary.discovery_questions || recommendation.discovery_questions || []).slice(0, 3).map(item => `- ${item}`).join('\n');
    const text = [
      `ZEPLIN MEDIA GÖRÜŞME HAZIRLIK NOTU`,
      `İşletme: ${lead.name}`,
      `Önerilen hizmet: ${recommendation.primary_service || recommendation.name || 'Görüşmede netleştirilecek'}`,
      `Durum: ${recommendation.stage || 'Keşif'}`,
      ``,
      `DOĞRULANAN AÇIKLAR`,
      evidence || `- Yeterli kanıt yok; önce veri doğrulanmalı.`,
      ``,
      `SUNABİLECEĞİMİZ İŞLER`,
      deliverables || `- İhtiyaç görüşmesinde netleştirilecek.`,
      ``,
      `GÖRÜŞMEDE SOR`,
      questions || `- İşletmenin öncelikli hedefi ve mevcut süreci nedir?`,
      ``,
      `Bu belge iç hazırlık notudur; müşteriye teklif olarak gönderilmez.`,
    ].join('\n');
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `${lead.name.replace(/[^\wçğıöşüÇĞİÖŞÜ-]+/g, '-')}-gorusme-notu.txt`;
    link.click();
    URL.revokeObjectURL(link.href);
    return addOutreach(lead.name, 'proposal_created', new Date().toISOString(), recommendation.name || 'Görüşme notu');
  }

  function initialsFor(value) {
    const parts = String(value || '').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return 'ZM';
    return parts.slice(0, 2).map(part => part.charAt(0).toUpperCase()).join('');
  }

  function roleLabel(role) {
    return role === 'admin' ? 'Patron' : 'Çalışan';
  }

  function roleTone(role) {
    return role === 'admin'
      ? { bg: 'var(--accent)', fg: 'var(--accent-ink)', bd: 'transparent' }
      : { bg: 'var(--raised)', fg: 'var(--sub)', bd: 'var(--line)' };
  }

  function searchLeads(rows, query) {
    const term = String(query || '').trim().toLocaleLowerCase('tr-TR');
    if (!term) return rows.slice(0, 8);
    return rows.filter(lead => {
      const haystack = [
        lead.name,
        lead.city,
        lead.category,
        lead.sector,
        lead.next_action,
        lead.phone,
        lead.address,
        ...(lead.audit_findings || []).map(item => `${item.title || ''} ${item.evidence || ''}`),
        ...(lead.matched_services || []).map(item => item.name),
      ].filter(Boolean).join(' ').toLocaleLowerCase('tr-TR');
      return haystack.includes(term);
    }).slice(0, 12);
  }

  const ACTIONS = {
    data_enrichment_started: { label: 'Veri Tamamlama Başladı', icon: '🧭', status: null },
    email_drafted:      { label: 'Mail Taslağı Hazır', icon: '📝', status: null },
    outreach_review_started: { label: 'Aksiyon İnceleniyor', icon: '🗂️', status: null },
    draft_reviewed:          { label: 'Taslak Onaylandı',     icon: '✓',  status: null },
    manual_verification_saved:{ label: 'Manuel Kontrol Tamamlandı', icon: '✓', status: null },
    email_sent:        { label: 'Mail Gönderildi',   icon: '✉️', status: 'contacted' },
    reply_received:    { label: 'Cevap Alındı',       icon: '💬', status: 'contacted' },
    call_started:      { label: 'Arama Başlatıldı',   icon: '📞', status: null },
    call_completed:    { label: 'Arama Tamamlandı',   icon: '📞', status: 'contacted' },
    contact_result_recorded: { label: 'Temas Sonucu Kaydedildi', icon: '✓', status: null },
    follow_up_scheduled:{ label: 'Takip Planlandı',    icon: '📅', status: 'follow_up' },
    note_added:        { label: 'Not Eklendi',         icon: '📝', status: null },

    deal_won:          { label: 'Anlaşma Yapıldı 🎉', icon: '🎉', status: 'converted' },
    deal_lost:         { label: 'Anlaşma Düştü',      icon: '❌', status: 'lost' },
  };

  const PIPE_STAGES = [
    { key: 'new',      label: 'Yeni',              color: '#93938f', actions: [] },
    { key: 'enrich',   label: 'Veri Tamamlama',    color: '#ffb36b', actions: ['data_enrichment_started'] },
    { key: 'draft',    label: 'Taslak Hazır',      color: '#76a6ff', actions: ['email_drafted'] },
    { key: 'contacted',label: 'Temasta',           color: '#b9a8ff', actions: [] },
    { key: 'meeting',  label: 'Takip',             color: '#ff9f43', actions: ['follow_up_scheduled'] },
    { key: 'won',      label: 'Kazanıldı',         color: '#7ce2b5', actions: ['deal_won'] },

  ];

  function getPipelineStage(lead) {
    const st = getStatuses()[lead.name] || 'yeni';
    if (st === 'converted') return 'won';
    if (st === 'lost') return 'lost';
    if (st === 'follow_up') return 'meeting';
    if (st === 'missing_info') return 'enrich';
    if (st === 'ready') return 'draft';
    const evs = getLeadEvents(lead.name);
    const last = evs.find(e => !['note', 'note_added'].includes(e.action));
    if (!last) return st === 'contacted' ? 'contacted' : 'new';
    const map = { data_enrichment_started: 'enrich', email_drafted: 'draft', draft_prepared: 'draft', outreach_review_started: 'draft', email_sent: 'contacted', reply_received: 'contacted', call_completed: 'contacted', call_made: 'contacted',
                  follow_up_scheduled: 'meeting', meeting_scheduled: 'meeting', deal_won: 'won', deal_lost: 'lost' };
    return map[last.action] || (st === 'contacted' ? 'contacted' : 'new');
  }

  function hasContactInfo(lead) {
    const researchEmails = lead.research?.website?.emails || [];
    const verifiedInstagram = lead.social?.has_instagram === true
      && Number(lead.social?.identity_confidence || 0) >= 70;
    return Boolean(lead.phone || researchEmails.length || verifiedInstagram);
  }

  function needsContactCompletion(lead) {
    const nextAction = lead.next_action || '';
    return /telefon|adres/i.test(nextAction) || !hasContactInfo(lead);
  }

  function getPrimaryActionMeta(lead) {
    if (needsContactCompletion(lead)) {
      return {
        label: 'Veriyi tamamla',
        helper: 'Maps ya da siteyi açar; pipeline durumu değişmez.',
        intent: 'enrich',
      };
    }
    if (!lead.matched_services || !lead.matched_services.length) {
      return {
        label: 'İhtiyacı doğrula',
        helper: 'Kaynağı açar; kanıt olmadan hizmet veya AI taslağı üretmez.',
        intent: 'verify',
      };
    }
    if (!lead.ai_report) {
      return {
        label: 'İhtiyaç raporu üret',
        helper: 'Kanıtlanan açık ve eşleşen hizmetten araştırma raporu; kanıt yeterliyse e-posta taslağı oluşturur.',
        intent: 'generate_ai',
      };
    }
    if (lead.ai_email) {
      return {
        label: 'Taslağı kopyala',
        helper: 'Hazır e-postayı panoya kopyalar; otomatik göndermez.',
        intent: 'draft',
      };
    }
    if (lead.phone) {
      return {
        label: 'Telefonu aç',
        helper: 'Mail için güçlü kanıt yok; raporu kullanarak telefon görüşmesi yap.',
        intent: 'call',
      };
    }
    return {
      label: 'Aksiyonu kaydet',
      helper: 'Sadece takip icin aktivite olusturur.',
      intent: 'review',
    };
  }

  function getLeadReadiness(lead) {
    if (lead.workflow?.checks) {
      return [
        ...lead.workflow.checks.map(item => ({ label: item.label, ready: item.complete })),
        { label: 'İletişim kanalı', ready: lead.workflow.contact_available },
      ];
    }
    const scoreStatus = lead.scoring?.score_status || 'insufficient';
    return [
      { label: 'İletişim kanalı', ready: hasContactInfo(lead) },
      { label: 'Denetim kanıtı', ready: scoreStatus !== 'insufficient' && Boolean(lead.audit_findings?.length) },
      { label: 'AI raporu', ready: Boolean(lead.ai_report) },
      { label: 'Kanıtlı hizmet', ready: Boolean(lead.matched_services?.length) },
    ];
  }

  function triggerQuickLeadAction(lead) {
    const meta = getPrimaryActionMeta(lead);
    if (meta.intent === 'call' && lead.phone) {
      openExternal(`tel:${lead.phone.replace(/\s+/g, '')}`);
      return;
    }
    if (meta.intent === 'draft' && lead.ai_email && navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(lead.ai_email).catch(() => {});
      return;
    }
    if (meta.intent === 'enrich') {
      openExternal(lead.maps_url || lead.website?.website_url || lead.social?.instagram_url);
      return;
    }
    openExternal(lead.website?.website_url || lead.maps_url || lead.social?.instagram_url);
  }

  function getDailyTasks(arr, statuses) {
    return arr
      .filter(lead => (statuses[lead.name] || 'yeni') !== 'converted')
      .slice()
      .sort((a, b) => {
        const delta = (b.sales_priority_score || 0) - (a.sales_priority_score || 0);
        if (delta !== 0) return delta;
        return (b.estimated_value_tl || 0) - (a.estimated_value_tl || 0);
      })
      .slice(0, 5)
      .map(lead => {
        const meta = getPrimaryActionMeta(lead);
        let reason = 'Sonraki adim belirginlestirilmeli.';
        if (needsContactCompletion(lead)) {
          reason = 'Temas öncesi telefon veya adres eksigi kapatilmali.';
        } else if (lead.phone) {
          reason = 'Telefon bilgisi hazir; bugun sicak temas kurulabilir.';
        } else if (lead.ai_email) {
          reason = 'Taslak hazir; gonderim oncesi son kontrol yeterli.';
        }
        return { lead, meta, reason };
      });
  }

  function issueToSeverity(text) {
    if (!text) return 'Bilgi';
    const t = text.toLowerCase();
    if (t.includes('ssl') || t.includes('https')) return 'Kritik';
    if (t.includes('web sitesi yok') || t.includes('website yok') || t.includes('site yok')) return 'Yüksek';
    if (t.includes('schema') || t.includes('og') || t.includes('open graph')) return 'Orta';
    if (t.includes('telefon') || t.includes('adres') || t.includes('tamamla') || t.includes('instagram yok')) return 'Düşük';
    return 'Bilgi';
  }

  function findingSeverity(finding) {
    const severity = finding?.severity;
    return ({ critical: 'Kritik', high: 'Yüksek', medium: 'Orta', low: 'Düşük' })[severity]
      || issueToSeverity(finding?.title || String(finding || ''));
  }

  function scoreIsAvailable(lead) {
    return (lead?.scoring?.score_status || 'insufficient') !== 'insufficient';
  }

  function verifiedInstagram(lead) {
    return lead?.social?.has_instagram === true
      && Number(lead?.social?.identity_confidence || 0) >= 70;
  }

  function scoreDash(score) { return 326.7 * (1 - score / 100); }

  function computeKPIs(arr) {
    const total = arr.length || 1;
    return {
      packagedCount: arr.filter(l => l.matched_services && l.matched_services.length > 0).length,
      packagedPct:   Math.round(arr.filter(l => l.matched_services && l.matched_services.length > 0).length / total * 100),
      phoneCount:    arr.filter(l => l.phone).length,
      phonePct:      Math.round(arr.filter(l => l.phone).length / total * 100),
      aiCount:       arr.filter(l => l.ai_report).length,
      aiPct:         Math.round(arr.filter(l => l.ai_report).length / total * 100),
      auditCount:    arr.filter(l => (l.audit_findings || []).length > 0).length,
      auditPct:      Math.round(arr.filter(l => (l.audit_findings || []).length > 0).length / total * 100),
    };
  }

  function computeTabCounts(arr, statuses) {
    return {
      total:     arr.length,
      yeni:      arr.filter(l => (statuses[l.name] || 'yeni') === 'yeni').length,
      contacted: arr.filter(l => statuses[l.name] === 'contacted').length,
      converted: arr.filter(l => statuses[l.name] === 'converted').length,
      low:       arr.filter(l => scoreIsAvailable(l) && l.scoring.score < 50).length,
    };
  }

  function computeReadinessBuckets(arr) {
    return {
      readyToCall: arr.filter(lead => Boolean(lead.phone)).length,
      needsData: arr.filter(lead => needsContactCompletion(lead)).length,
      proposalReady: arr.filter(lead => Boolean(lead.ai_report) && Boolean(lead.ai_email) && Boolean(lead.matched_services?.length)).length,
    };

  function ScoreRing({ score, grade, scoreStatus = 'reliable', size = 56, stroke = 4 }) {
    const available = scoreStatus !== 'insufficient';
    const r = (size - stroke) / 2;
    const c = 2 * Math.PI * r;
    const off = available ? c * (1 - Math.min(Math.max(score || 0, 0), 100) / 100) : c;
    return (
      <div style={{ position: 'relative', width: size, height: size, flexShrink: 0 }}>
        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ transform: 'rotate(-90deg)' }}>
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--line2)" strokeWidth={stroke}/>
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={available ? gradeColor(grade) : 'var(--muted)'} strokeWidth={stroke} strokeLinecap="round" strokeDasharray={c} strokeDashoffset={off} style={{ transition: 'stroke-dashoffset .9s cubic-bezier(.22,1,.36,1)' }}/>
        </svg>
        <div style={{ position: 'absolute', inset: 0, display: 'grid', placeItems: 'center' }}>
          <span style={{ fontFamily: "'Space Grotesk'", fontSize: size >= 70 ? 22 : (size >= 50 ? 15 : 13), fontWeight: 700, color: 'var(--tx)' }}>{available ? score : '—'}</span>
        </div>
      </div>
    );
  }

  function auditFor(l) {
    const yes = { bg: 'rgba(182,242,74,0.16)', fg: '#b6f24a', mark: '✓' };
    const no  = { bg: 'rgba(255,107,107,0.14)', fg: '#ff8f8f', mark: '✕' };
    const unknown = { bg: 'var(--raised)', fg: 'var(--muted)', mark: '?' };
    const preferred = [
      'website.presence',
      'identity.website_name',
      'website.https',
      'website.viewport',
      'seo.indexable',
      'seo.schema',
      'social.instagram_presence',
      'maps.reputation',
    ];
    const checks = l.audit_checks || [];
    return preferred
      .map(code => checks.find(check => check.code === code))
      .filter(Boolean)
      .slice(0, 6)
      .map(check => ({
        label: check.label,
        note: check.note,
        ...(check.status === 'pass' ? yes : check.status === 'fail' ? no : unknown),
      }));
  }

  function chipsFor(l) {
    const base = { display: 'inline-flex', alignItems: 'center', gap: 5, fontSize: 11.5, fontWeight: 500, padding: '5px 11px', borderRadius: 999, whiteSpace: 'nowrap' };
    const on  = { ...base, background: 'var(--panel2)', border: '1px solid var(--line)', color: 'var(--sub)' };
    const off = { ...base, background: 'transparent', border: '1px dashed var(--line2)', color: 'var(--muted)' };
    const w = l.website || {}, s = l.social || {};
    const chips = [];
    const webAbsent = (l.audit_findings || []).some(f => ['website.absent','website.invalid_candidate'].includes(f.code));
    chips.push(w.has_website
      ? { label: (w.website_url||'').replace(/^https?:\/\//,'').replace(/\/$/,''), dot: true, style: on }
      : { label: webAbsent ? 'Web yok' : 'Web doğrulanmadı', dot: false, style: off });
    chips.push(verifiedInstagram(l) ? { label: '@'+(s.instagram_username||'instagram'), dot: true, style: on } : { label: 'Instagram doğrulanmadı', dot: false, style: off });
    if (l.maps_url) chips.push({ label: 'Google Maps', dot: true, style: on });
    return chips;
  }

  function computeWeekBuckets(leads) {
    const now = new Date();
    const buckets = new Array(8).fill(0);
    leads.forEach(l => {
      if (!l.last_analyzed) return;
      const d = new Date(l.last_analyzed.replace(' ', 'T'));
      if (isNaN(d)) return;
      const diffDays = Math.floor((now - d) / 86400000);
      const weekIdx = Math.floor(diffDays / 7);
      if (weekIdx >= 0 && weekIdx < 8) buckets[7 - weekIdx] += 1;
    });
    return buckets;
  }

  function mostCommonCity(leads) {
    const counts = {};
    leads.forEach(l => { if (l.city) counts[l.city] = (counts[l.city]||0) + 1; });
    const entries = Object.entries(counts).sort((a,b) => b[1]-a[1]);
    return entries.length ? entries[0][0] : '';
  }

  function exportLeadsCSV(leads) {
    const cols = ['name','city','category','scoring.score','scoring.grade','estimated_value_tl','sales_priority_score','phone'];
    const get = (obj, path) => path.split('.').reduce((o,k) => (o||{})[k], obj);
    const header = ['İşletme','Şehir','Kategori','Skor','Sınıf','Tahmini Değer','Öncelik','Telefon'];
    const rows = leads.map(l => cols.map(c => { const v = get(l, c); return v === undefined || v === null ? '' : String(v).replace(/"/g,'""'); }));
    const csv = [header, ...rows].map(r => r.map(v => `"${v}"`).join(',')).join('\n');
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'zeplin-leadler.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

                <div style={wp.pkgPrice}>{pkg.stage || 'Keşif'}{pkg.confidence ? ` · %${pkg.confidence} güven` : ''}</div>
              </div>
              <button style={wp.pkgBtn} onClick={() => createProposal(lead)}>Görüşme Notu</button>
            </div>
          </div>
        ) : (
          <div style={{ ...wp.pkgBox, background: 'var(--panel2)' }}>
            <span style={wp.pkgEyebrow}>Önerilen Hizmet</span>
            <div style={{ fontSize: 13, color: 'var(--sub)', marginTop: 8 }}>
              Satış iddiası oluşturacak kanıt yok. Aşağıdaki keşif başlıklarını görüşmede doğrula.
            </div>
          </div>
        )}

        {lead.ai_report && (
          <div>
            <button style={wp.toggleBtn} onClick={() => setReportOpen(o => !o)}>
              <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}><IconStar/> AI Raporu</span>
              <span style={{ fontSize: 18, color: 'var(--sub)' }}>{reportOpen ? '−' : '+'}</span>
            </button>
            {reportOpen && <div style={wp.togglePanel}>{lead.ai_report}</div>}
          </div>
        )}

        {lead.ai_email && (
          <div>
            <button style={wp.toggleBtn} onClick={() => setEmailOpen(o => !o)}>
              <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}><IconMail/> Satış Maili</span>
              <span style={{ fontSize: 18, color: 'var(--sub)' }}>{emailOpen ? '−' : '+'}</span>
            </button>
            {emailOpen && <div style={wp.togglePanel}>{lead.ai_email}</div>}
          </div>
        )}

        <div style={{ display: 'flex', gap: 9 }}>
          {lead.phone
            ? <a href={`tel:${lead.phone.replace(/\s+/g,'')}`} onClick={() => addOutreach(lead.name, 'call_started', new Date().toISOString(), 'Telefon bağlantısı açıldı').catch(() => {})} style={wp.callBtn}><IconCall/> Ara</a>
            : <span style={{ ...wp.callBtn, opacity: 0.4, pointerEvents: 'none' }}><IconCall/> Ara</span>}
          {lead.ai_email
            ? <button style={wp.mailBtn} onClick={copyEmail}><IconMail color="currentColor"/> {copied ? 'Kopyalandı' : 'Taslağı Kopyala'}</button>
            : <span style={{ ...wp.mailBtn, opacity: 0.4, pointerEvents: 'none' }}><IconMail color="currentColor"/> Taslak Yok</span>}
          <button style={wp.moreBtn} onClick={onOpenDetail} title="Detaylı görünüm">
            <IconDots/>
          </button>
        </div>
      </div>
    );
  }

  const CONTACT_CHANNEL_OPTIONS = [
    ['phone', 'Telefon'],
    ['whatsapp', 'WhatsApp'],
    ['instagram', 'Instagram'],
    ['email', 'E-posta'],
    ['other', 'Diğer'],
  ];

  const CONTACT_OUTCOME_OPTIONS = [
    ['reached_interested', 'İlgilendi'],
    ['proposal_requested', 'Teklif istedi'],
    ['reached_later', 'Sonra görüşelim'],
    ['no_answer', 'Ulaşılamadı'],
    ['wrong_number', 'Numara yanlış'],
    ['not_interested', 'İlgilenmedi'],
    ['won', 'Anlaşma yapıldı'],
    ['lost', 'Kaybedildi'],
  ];

  function tomorrowAtTen() {
    const date = new Date();
    date.setDate(date.getDate() + 1);
    date.setHours(10, 0, 0, 0);
    const pad = value => String(value).padStart(2, '0');
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
  }

  function followUpForOutcome(outcome) {
    const days = FOLLOW_UP_DELAYS[outcome];
    if (!days) return '';
    const date = new Date();
    date.setDate(date.getDate() + days);
    date.setHours(10, 0, 0, 0);
    const pad = value => String(value).padStart(2, '0');
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
  }

  function ContactResultDialog({ lead, onClose, onSaved, onOpenLead, onRefreshLead }) {
    const [channel, setChannel] = React.useState(lead?.phone ? 'phone' : lead?.social?.instagram_url ? 'instagram' : 'other');
    // No preselected outcome: an accidental submit must not record interest.
    const [outcome, setOutcome] = React.useState('');
    const [followUpAt, setFollowUpAt] = React.useState('');
    const [followUpTouched, setFollowUpTouched] = React.useState(false);
    const [errorCode, setErrorCode] = React.useState('');
    const requestIdRef = React.useRef(null);
    const [contactName, setContactName] = React.useState('');
    const [note, setNote] = React.useState('');
    const [serviceSlugs, setServiceSlugs] = React.useState([]);
    const [checkedQuestions, setCheckedQuestions] = React.useState([]);
    const [copied, setCopied] = React.useState(false);
    const [busy, setBusy] = React.useState(false);
    const [error, setError] = React.useState('');
    const needsFollowUp = Object.prototype.hasOwnProperty.call(FOLLOW_UP_DELAYS, outcome);
    const workflow = lead?.workflow || {};
    const ready = Boolean(workflow.ready_to_contact || workflow.latest_contact_at);
    const playbook = lead?.sales_playbook || {};
    const brief = playbook.call_brief || {};
    const evidence = (playbook.evidence_points || []).slice(0, 3);
    const services = (playbook.services || lead?.matched_services || lead?.discovery_services || []).slice(0, 5);
    const questions = (playbook.discovery_questions || []).slice(0, 5);
    const objections = (playbook.objection_responses || []).slice(0, 4);
    const activeDraft = (playbook.channel_drafts || []).find(item => item.channel === channel);

    React.useEffect(() => {
      setFollowUpAt(followUpForOutcome(outcome));
      setFollowUpTouched(false);
    }, [outcome]);

    // A changed form is a new submission; an unchanged retry keeps its id.
    React.useEffect(() => {
      requestIdRef.current = null;
    }, [channel, outcome, followUpAt, contactName, note, serviceSlugs, checkedQuestions, lead?.revision]);

    function openChannel() {
      if (!ready) return;
      const phone = String(lead?.phone || '').replace(/\D/g, '');
      const instagram = lead?.manual_verification?.instagram?.url || lead?.social?.instagram_url;
      const email = lead?.email || (((lead?.research || {}).website || {}).emails || [])[0];
      if (channel === 'phone' && phone) window.location.href = `tel:${phone}`;
      else if (channel === 'whatsapp' && phone) openExternal(`https://wa.me/${phone}`);
      else if (channel === 'instagram' && instagram) openExternal(instagram);
      else if (channel === 'email' && email) window.location.href = `mailto:${email}`;
    }

    function toggleService(slug) {
      setServiceSlugs(current => current.includes(slug)
        ? current.filter(item => item !== slug)
        : [...current, slug]);
    }

    function toggleQuestion(index) {
      setCheckedQuestions(current => current.includes(index)
        ? current.filter(item => item !== index)
        : [...current, index]);
    }

    function copyOpener() {
      if (!playbook.call_opener || !navigator.clipboard?.writeText) return;
      navigator.clipboard.writeText(playbook.call_opener).then(() => {
        setCopied(true);
        setTimeout(() => setCopied(false), 1600);
      }).catch(() => {});
    }

    function submit(event) {
      event.preventDefault();
      if (!outcome) {
        setError('Görüşmenin sonucunu seç.');
        return;
      }
      if (needsFollowUp && !followUpAt) {
        setError('Takip tarihi seçmelisin.');
        return;
      }
      if (!requestIdRef.current) requestIdRef.current = newRequestId();
      setBusy(true);
      setError('');
      setErrorCode('');
      const discoveryNote = checkedQuestions.length
        ? `Sorulan keşif başlıkları: ${checkedQuestions.map(index => questions[index]).filter(Boolean).join(' | ')}`
        : '';
      saveContactResult(lead, {
        channel,
        outcome,
        followUpAt: needsFollowUp && followUpTouched ? new Date(followUpAt).toISOString() : null,
        contactName,
        note: [note, discoveryNote].filter(Boolean).join('\n'),
        serviceSlugs,
      }, requestIdRef.current).then(() => {
        onSaved();
      }).catch(err => {
        setError(err.message || 'Sonuç kaydedilemedi.');
        setErrorCode(err.code || '');
      }).finally(() => setBusy(false));
    }

    return (
      <div role="presentation" style={dialog.overlay} onMouseDown={event => { if (event.target === event.currentTarget && !busy) onClose(); }}>
        <form onSubmit={submit} style={{ ...dialog.panel, maxWidth: 1240, maxHeight: '92vh', overflowY: 'auto' }}>
          <div style={dialog.head}>
            <div>
              <div style={ld.eyebrow}>TEMAS MERKEZİ</div>
              <div style={ld.cardTitle}>{lead.name}</div>
              <div style={tw.contactSubtitle}>{playbook.context || lead.category || lead.sector || 'İşletme'} · {brief.duration_label || 'Görüşmeye hazırlan'}</div>
            </div>
            <button type="button" onClick={onClose} disabled={busy} style={ld.btnGhost} aria-label="Kapat">Kapat</button>
          </div>

          {!ready && (
            <div style={tw.flowGate}>
              <div><strong>Bu lead henüz temasa hazır değil.</strong><span>{(workflow.missing || []).join(', ') || 'Kaynak kontrolleri'} tamamlanmalı.</span></div>
              <button type="button" style={av.primaryBtn} onClick={() => { onClose(); onOpenLead(); }}>Kontrol ekranına git</button>
            </div>
          )}

          <div className="contact-center-grid" style={tw.contactGrid}>
            <section style={tw.prepColumn}>
              <div style={tw.briefBand}>
                <div style={tw.briefHead}><span>30 SANİYELİK HAZIRLIK</span><strong>{brief.evidence_count || evidence.length} kanıt · {brief.service_count || services.length} hizmet</strong></div>
                <p style={tw.briefText}>{brief.business_summary || playbook.summary || 'İşletmenin hedefini öğren; doğrulanmayan bir açığı kesin bilgi gibi sunma.'}</p>
                <div style={tw.briefGoal}><span>Bu görüşmenin hedefi</span><strong>{brief.conversation_goal || 'İhtiyacı doğrula ve sonraki adımı netleştir.'}</strong></div>
              </div>

              <div style={tw.prepSection}>
                <div style={tw.prepHead}><div><span style={ld.eyebrow}>KANITLI AÇIKLAR</span><h3 style={tw.prepTitle}>Neyi konuşacağız?</h3></div><div style={tw.segmentRow}>{lead.maps_url && <button type="button" style={tw.miniSource} onClick={() => openExternal(lead.maps_url)}>Maps ↗</button>}{(lead.manual_verification?.instagram?.url || lead.social?.instagram_url) && <button type="button" style={tw.miniSource} onClick={() => openExternal(lead.manual_verification?.instagram?.url || lead.social?.instagram_url)}>Instagram ↗</button>}{lead.website?.website_url && <button type="button" style={tw.miniSource} onClick={() => openExternal(lead.website.website_url)}>Website ↗</button>}</div></div>
                <div style={tw.evidenceList}>
                  {evidence.map((item, index) => (
                    <div key={`${item.title}-${index}`} style={tw.evidenceRow}>
                      <span style={tw.evidenceIndex}>{index + 1}</span>
                      <div><strong>{item.title}</strong><p>{item.evidence}</p><small>{item.impact || 'Görüşmede işletmeye etkisini doğrula.'}</small></div>
                      {item.source_url && <button type="button" style={tw.miniSource} onClick={() => openExternal(item.source_url)}>{item.source_label || 'Kaynak'} ↗</button>}
                    </div>
                  ))}
                  {!evidence.length && <div style={tw.emptyPrep}>Kesinleşmiş açık yok. Aşağıdaki keşif sorularıyla ihtiyacı öğren.</div>}
                </div>
              </div>

              <div style={tw.prepSection}>
                <div style={tw.prepHead}><div><span style={ld.eyebrow}>ÖNERİLEBİLECEK HİZMETLER</span><h3 style={tw.prepTitle}>Biz ne sunabiliriz?</h3></div></div>
                <div style={tw.servicePrepList}>{services.map(service => <div key={service.slug} style={tw.servicePrep}><strong>{service.name}</strong><span>{service.why || 'İhtiyaç görüşmede doğrulanmalı.'}</span><small>{(service.deliverables || []).join(' · ')}</small></div>)}</div>
              </div>

              <div style={tw.prepSection}>
                <div style={tw.prepHead}><div><span style={ld.eyebrow}>ARAMA AKIŞI</span><h3 style={tw.prepTitle}>Açılış ve keşif</h3></div><button type="button" style={tw.miniSource} onClick={copyOpener}>{copied ? 'Kopyalandı' : 'Metni kopyala'}</button></div>
                <div style={tw.flowScript}>{playbook.call_opener || 'Önce işletmenin hedefini sor; doğrulanmayan bir açığı kesinmiş gibi söyleme.'}</div>
                <div style={tw.callStepList}>{(playbook.call_steps || []).map((step, index) => <div key={step.key || index} style={tw.callStep}><span>{index + 1}</span><div><strong>{step.label}</strong><small>{step.instruction}</small></div></div>)}</div>
                <label style={tw.fieldLabel}>Görüşmede sor</label>
                <div style={tw.questionList}>{questions.map((question, index) => <label key={question} style={checkedQuestions.includes(index) ? tw.questionChecked : tw.question}><input type="checkbox" checked={checkedQuestions.includes(index)} onChange={() => toggleQuestion(index)}/><span>{question}</span></label>)}</div>
                {!!objections.length && <div style={tw.objectionList}>{objections.map(item => <details key={item.objection} style={tw.objection}><summary>{item.objection}</summary><p>{item.response}</p></details>)}</div>}
              </div>
            </section>

            <aside style={tw.resultColumn}>
              <div style={tw.resultSticky}>
                <div style={tw.resultHead}><span style={ld.eyebrow}>GÖRÜŞME SONUCU</span><strong>Tek seferde kaydet</strong></div>
                <div style={tw.flowSteps}>{(workflow.checks || []).map(item => <div key={item.key} style={item.complete ? tw.flowStepDone : tw.flowStepPending}><strong>{item.complete ? '✓' : '○'} {item.label}</strong></div>)}</div>

          <fieldset disabled={!ready || busy} style={{ border: 0, padding: 0, margin: 0, minWidth: 0, opacity: ready ? 1 : 0.48 }}>
            <label style={tw.fieldLabel}>Kanal</label>
            <div>
              <div style={tw.outcomeGrid}>
                {CONTACT_CHANNEL_OPTIONS.map(([key, label]) => (
                  <button type="button" key={key} style={channel === key ? tw.segmentActive : tw.segment} onClick={() => setChannel(key)}>{label}</button>
                ))}
              </div>
              <button type="button" style={{ ...tw.callAction, width: '100%', marginTop: 8 }} onClick={openChannel}>Kanalı aç ↗</button>
            </div>
            {activeDraft?.body && <div style={tw.flowDraft}><strong>{activeDraft.label} metni</strong><span>{activeDraft.body}</span></div>}

            <label style={tw.fieldLabel}>Görüşmenin sonucu</label>
              <div style={tw.outcomeGrid}>
              {CONTACT_OUTCOME_OPTIONS.map(([key, label]) => (
                <button type="button" key={key} style={outcome === key ? tw.outcomeActive : tw.outcome} onClick={() => setOutcome(key)}>{label}</button>
              ))}
            </div>

          {needsFollowUp && (
            <div>
              <label htmlFor="follow-up-at" style={tw.fieldLabel}>Otomatik takip görevi</label>
              <input id="follow-up-at" type="datetime-local" value={followUpAt} onChange={event => { setFollowUpAt(event.target.value); setFollowUpTouched(true); }} style={dialog.input} required/>
              <div style={tw.autoHint}>{followUpTouched ? 'Seçtiğin tarih' : `Varsayılan: ${FOLLOW_UP_DELAYS[outcome]} gün sonra 10:00 (İstanbul)`} · kaydedince Bugünkü İşler listesine eklenir.</div>
            </div>
          )}

          {services.length > 0 && (
            <div>
              <label style={tw.fieldLabel}>Konuşulan / ilgi duyulan hizmetler</label>
              <div style={tw.serviceGrid}>
                {services.map(service => {
                  const selected = serviceSlugs.includes(service.slug);
                  return (
                    <label key={service.slug} style={selected ? tw.serviceSelected : tw.serviceOption}>
                      <input type="checkbox" checked={selected} onChange={() => toggleService(service.slug)}/>
                      <span>{service.name}</span>
                    </label>
                  );
                })}
              </div>
            </div>
          )}

          <div>
            <div>
              <label htmlFor="contact-name" style={tw.fieldLabel}>Görüşülen kişi</label>
              <input id="contact-name" value={contactName} onChange={event => setContactName(event.target.value)} placeholder="Örn. Ayşe Hanım" style={dialog.input}/>
            </div>
            <div>
              <label htmlFor="contact-note" style={tw.fieldLabel}>Görüşme notu</label>
              <textarea id="contact-note" value={note} onChange={event => setNote(event.target.value)} placeholder="Ne konuşuldu, ne istendi, karar verici kim?" style={{ ...dialog.input, minHeight: 92, resize: 'vertical' }}/>
            </div>
          </div>

          </fieldset>
          {error && (
            <div role="alert" style={tw.error}>
              {error}
              {errorCode === 'LEAD_VERSION_CONFLICT' && onRefreshLead && (
                <button type="button" style={{ ...ld.btnGhost, marginLeft: 10 }} disabled={busy} onClick={() => { setBusy(true); onRefreshLead().finally(() => setBusy(false)); }}>Güncel veriyi al</button>
              )}
            </div>
          )}
          <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 8, marginTop: 16 }}>
            <button type="button" style={ld.btnGhost} onClick={onClose} disabled={busy}>Vazgeç</button>
            <button type="submit" style={av.primaryBtn} disabled={busy || !ready}>{busy ? 'Kaydediliyor…' : 'Sonucu ve görevi kaydet'}</button>
          </div>
              </div>
            </aside>
          </div>
        </form>
      </div>
    );
  }

  function isToday(value) {
    if (!value) return false;
    const date = new Date(value);
    const now = new Date();
    return date.getFullYear() === now.getFullYear()
      && date.getMonth() === now.getMonth()
      && date.getDate() === now.getDate();
  }

  function latestContactResult(leadName) {
    return getLeadEvents(leadName).find(event => event.action === 'contact_result_recorded') || null;
  }

  function taskMetaForLead(lead) {
    const workflow = lead.workflow || {};
    const last = latestContactResult(lead.name);
    const followUp = last?.followUpAt ? new Date(last.followUpAt) : null;
    const now = new Date();
    const due = followUp && followUp <= now;
    const dueToday = followUp && isToday(followUp);
    const assignmentDue = lead.assignment_due_at ? new Date(lead.assignment_due_at) : null;
    let rank = 40;
    let label = workflow.stage_label || 'İlk temas bekliyor';
    let detail = lead.priority_reason || 'Lead’i incele ve ilk teması gerçekleştir.';
    if (due) {
      rank = 100;
      label = dueToday ? 'Bugün takip' : 'Takip gecikti';
      detail = `${last.outcomeLabel || 'Önceki temas'} sonrası yeniden iletişime geç.`;
    } else if (workflow.stage === 'verification_required') {
      rank = 90;
      label = 'Kontrol bekliyor';
      detail = `${workflow.completed_count || 0}/${workflow.required_count || 0} kaynak tamamlandı. Eksik: ${(workflow.missing || []).join(', ') || 'doğrulama'}.`;
    } else if (workflow.stage === 'ready_to_contact') {
      rank = 85;
      label = 'Aramaya hazır';
      detail = 'Zorunlu kaynak kontrolleri tamamlandı; konuşma rehberiyle temasa geç.';
    } else if (assignmentDue && assignmentDue <= now) {
      rank = 80;
      label = 'Atama tarihi geldi';
      detail = lead.priority_reason || 'Atanan lead için aksiyon bekleniyor.';
    } else if (last) {
      rank = 25;
      label = last.outcomeLabel || 'Sonuç kaydedildi';
      detail = followUp
        ? `Takip: ${followUp.toLocaleString('tr-TR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}`
        : 'Yeni aksiyon için lead detayını kontrol et.';
    }
    return {
      rank: rank + Number(lead.sales_priority_score || 0) / 100,
      label,
      detail,
      followUp,
      stage: workflow.stage || (last ? 'contacted' : 'verification_required'),
      ready: Boolean(workflow.ready_to_contact || last),
      completedToday: Boolean(last && isToday(last.happened_at || last.created_at || last.date)),
    };
  }

  function TodayView({ leads, onSelect, onOpenResult, user, summary }) {
    const [taskFilter, setTaskFilter] = React.useState('open');
    const tasks = React.useMemo(
      () => leads
        .filter(lead => !['converted', 'lost'].includes(getStatuses()[lead.name] || lead.status))
        .map(lead => ({ lead, meta: taskMetaForLead(lead) }))
        .sort((a, b) => b.meta.rank - a.meta.rank),
      [leads, summary]
    );
    const completed = leads.filter(lead => taskMetaForLead(lead).completedToday).length;
    const due = tasks.filter(item => item.meta.followUp && item.meta.followUp <= new Date()).length;
    const filteredTasks = tasks.filter(({ meta }) => {
      if (taskFilter === 'verification') return meta.stage === 'verification_required';
      if (taskFilter === 'ready') return meta.stage === 'ready_to_contact';
      if (taskFilter === 'followup') return meta.stage === 'follow_up_due';
      if (taskFilter === 'completed') return meta.completedToday || ['contacted', 'closed'].includes(meta.stage);
      return !meta.completedToday && meta.stage !== 'closed';
    });
    const senderName = (user?.name || '').split(' ')[0] || 'ekip';

    function startCall(lead) {
      if (!lead.phone) return;
      addOutreach(lead.name, 'call_started', new Date().toISOString(), 'Telefon bağlantısı açıldı').catch(() => {});
      window.location.href = `tel:${lead.phone.replace(/\s+/g, '')}`;
    }

    return (
      <main className="today-main" style={tw.main}>
        <div className="today-hero" style={tw.hero}>
          <div>
            <div style={wp.eyebrow}>SATIŞ MASASI · {new Date().toLocaleDateString('tr-TR', { day: '2-digit', month: 'long' })}</div>
            <h1 className="today-title" style={tw.h1}>Bugünkü İşlerim</h1>
            <p style={tw.subtitle}>Merhaba {senderName}. Önce takipleri kapat, sonra en yüksek öncelikli yeni lead’lere geç.</p>
          </div>
          <div className="today-hero-stats" style={tw.heroStats}>
            <div className="today-hero-stat" style={tw.heroStat}><strong>{tasks.length}</strong><span>Açık iş</span></div>
            <div className="today-hero-stat" style={tw.heroStat}><strong>{due}</strong><span>Takip zamanı geldi</span></div>
            <div className="today-hero-stat" style={tw.heroStat}><strong>{completed}</strong><span>Bugün tamamlandı</span></div>
          </div>
        </div>

        <section style={tw.queueSection}>
          <div className="today-section-head" style={tw.sectionHead}>
            <div>
              <div style={ld.eyebrow}>ÖNCELİK SIRASI</div>
              <h2 style={tw.h2}>Sıradaki temaslar</h2>
            </div>
            <span style={tw.quiet}>{summary?.today_result_count || completed} sonuç bugün kaydedildi</span>
          </div>

          <div style={tw.filterTabs}>
            {[
              ['open', 'Açık işler', tasks.filter(item => !item.meta.completedToday && item.meta.stage !== 'closed').length],
              ['verification', 'Kontrol', tasks.filter(item => item.meta.stage === 'verification_required').length],
              ['ready', 'Aramaya hazır', tasks.filter(item => item.meta.stage === 'ready_to_contact').length],
              ['followup', 'Takip', tasks.filter(item => item.meta.stage === 'follow_up_due').length],
              ['completed', 'Tamamlanan', tasks.filter(item => item.meta.completedToday || ['contacted', 'closed'].includes(item.meta.stage)).length],
            ].map(([key, label, count]) => (
              <button type="button" key={key} onClick={() => setTaskFilter(key)} style={taskFilter === key ? tw.filterTabActive : tw.filterTab}>{label} <span>{count}</span></button>
            ))}
          </div>

          <div style={tw.queue}>
            {filteredTasks.map(({ lead, meta }, index) => {
              const playbook = lead.sales_playbook || {};

                        <button type="button" style={tw.detailAction} onClick={() => onSelect(leads.indexOf(lead))}>Detay</button>

                    </div>
                    <div className="responsive-opportunity-columns" style={tw.taskContext}>

                      </div>
                    </div>
                  </div>
                </article>
              );
            })}
            {!filteredTasks.length && <div style={tw.emptyQueue}>Bu bölümde bekleyen iş yok.</div>}

        </section>
      </main>

  function CockpitMain({ leads, statuses, onSelect, onOpenAdmin, user, summary, teamUsers, teamPerformance, onDataChange }) {
    const [filter, setFilter] = React.useState('hepsi');
    const [selectedName, setSelectedName] = React.useState(leads[0]?.name);

    React.useEffect(() => {
      if (!leads.some(l => l.name === selectedName)) setSelectedName(leads[0]?.name);
    }, [leads]);

    const filtered = React.useMemo(() => filterLeads(leads, filter), [leads, filter]);
    const selected = leads.find(l => l.name === selectedName) || leads[0];
    const selIdx   = leads.indexOf(selected);

    const totalVal  = leads.reduce((s, l) => s + (l.estimated_value_tl || 0), 0);
    const avgScore  = Math.round(leads.reduce((s, l) => s + (l.scoring?.score || 0), 0) / (leads.length || 1));
    const gradeA    = leads.filter(l => l.scoring.grade === 'A').length;
    const assignedCount = summary?.assigned_count ?? leads.filter(l => l.assigned_to || l.assigned_user_id).length;
    const todayCalls = summary?.today_call_count ?? 0;
    const converted = summary?.won_count ?? leads.filter(l => statuses[l.name] === 'converted').length;
    const followUps = summary?.follow_up_count ?? 0;
    const weekBuckets = React.useMemo(() => computeWeekBuckets(leads), [leads]);
    const weekMax = Math.max(...weekBuckets, 1);
    const topCity = React.useMemo(() => mostCommonCity(leads), [leads]);
    const dateStr = React.useMemo(() => new Date().toLocaleDateString('tr-TR', { day: '2-digit', month: 'long', year: 'numeric' }), []);

    const kpis = [
      { label: user?.role === 'admin' ? 'Atanan Lead' : 'Bana Atanan', value: String(assignedCount), delta: `${leads.length} görünür kayıt`, dot: 'var(--accent)' },

      { label: 'Takip Bekleyen',value: String(followUps),     delta: 'yeniden temas',    dot: '#7cc5ff' },
      { label: 'Kazanılan',     value: String(converted),     delta: 'müşteri oldu',     dot: '#b6f24a' },
    ];

  function sevStyle(s) {

  function manualVerificationDefaults(lead) {
    const current = lead.manual_verification || {};
    return {
      google: {
        checked: !!current.google?.checked,
        status: current.google?.status || (lead.maps_url ? 'found' : 'unknown'),
        rating: current.google?.rating ?? '',
        review_count: current.google?.review_count ?? '',
      },
      instagram: {
        checked: !!current.instagram?.checked,
        status: current.instagram?.status || 'unknown',
        followers: current.instagram?.followers ?? '',
        post_count: current.instagram?.post_count ?? '',
        url: current.instagram?.url || lead.social?.instagram_url || '',
      },
      menu: {
        checked: !!current.menu?.checked,
        status: current.menu?.status || 'unknown',
        url: current.menu?.url || '',
      },
      website: {
        checked: !!current.website?.checked,
        status: current.website?.status || 'unknown',
        url: current.website?.url || lead.website?.website_url || '',
      },
      notes: current.notes || '',
    };
  }

  function ManualVerificationCard({ lead, onDataChange, onFeedback, placesEnabled }) {
    const [values, setValues] = React.useState(() => manualVerificationDefaults(lead));
    const [busy, setBusy] = React.useState(false);
    const [placesBusy, setPlacesBusy] = React.useState(false);
    const current = lead.manual_verification || null;

    React.useEffect(() => setValues(manualVerificationDefaults(lead)), [lead.name, current?.checked_at]);

    function update(group, field, value) {
      setValues(previous => ({
        ...previous,
        [group]: { ...previous[group], [field]: value },
      }));
    }

    function submit(event) {
      event.preventDefault();
      if (!['google', 'instagram', 'menu', 'website'].some(group => values[group].checked)) {
        onFeedback('Kaydetmek için en az bir alanı kontrol edildi olarak işaretle.');
        return;
      }
      setBusy(true);
      saveManualVerification(lead, values).then(() => {
        onFeedback('Manuel kontrol kaydedildi; öneriler güncellendi.');
        if (onDataChange) return onDataChange();
      }).catch(() => onFeedback('Manuel kontrol kaydedilemedi.')).finally(() => setBusy(false));
    }

    function refreshGooglePlace() {
      setPlacesBusy(true);
      fetch('/api/place_refresh', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ lead_name: lead.name }),
      }).then(async response => {
        notifyIfSessionExpired(response);
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || 'Google verisi yenilenemedi.');
        if (data.place?.status !== 'verified') throw new Error('Google’da güvenilir işletme eşleşmesi bulunamadı; manuel kontrol et.');
        onFeedback(`Google verisi yenilendi · %${data.place.match_confidence || 0} eşleşme güveni.`);
        if (onDataChange) return onDataChange();
      }).catch(error => onFeedback(error.message || 'Google verisi yenilenemedi.')).finally(() => setPlacesBusy(false));
    }

    const sourceButton = (url, label) => url ? (
      <button type="button" style={ld.manualSource} onClick={() => openExternal(url)}>{label} ↗</button>
    ) : null;
    const sectionStyle = checked => ({ ...ld.manualSection, opacity: checked ? 1 : 0.72 });

    return (
      <form style={ld.manualCard} onSubmit={submit}>
        <div style={ld.findHeader}>
          <div>
            <div style={ld.eyebrow}>EKİP DOĞRULAMASI</div>
            <div style={ld.cardTitle}>Kaynakları aç, gördüğünü kaydet</div>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 7 }}>
            {placesEnabled && <button type="button" disabled={placesBusy} style={ld.btnGhost} onClick={refreshGooglePlace}>{placesBusy ? 'Google yenileniyor…' : 'Google verisini yenile'}</button>}
            {current?.checked_at ? (
              <span style={ld.verifiedBadge}>{fmtDate(current.checked_at)} · {current.checked_by || 'Ekip'}</span>
            ) : <span style={ld.countBadge}>Henüz yapılmadı</span>}
          </div>
        </div>
        <div className="manual-verification-grid" style={ld.manualGrid}>
          <section style={sectionStyle(values.google.checked)}>
            <div style={ld.manualSectionHead}>
              <label style={ld.manualCheck}><input type="checkbox" checked={values.google.checked} onChange={event => update('google', 'checked', event.target.checked)}/><strong>Google Maps</strong></label>
              {sourceButton(lead.maps_url, 'Maps aç')}
            </div>
            <select aria-label="Google profil durumu" disabled={!values.google.checked} value={values.google.status} onChange={event => update('google', 'status', event.target.value)} style={ld.manualInput}>
              <option value="found">Profil bulundu</option><option value="not_found">Profil bulunamadı</option><option value="unknown">Sonuç belirsiz</option>
            </select>
            <div className="manual-field-grid" style={ld.manualFields}>
              <input aria-label="Google puanı" disabled={!values.google.checked} type="number" min="0" max="5" step="0.1" placeholder="Puan (4.3)" value={values.google.rating} onChange={event => update('google', 'rating', event.target.value)} style={ld.manualInput}/>
              <input aria-label="Google yorum sayısı" disabled={!values.google.checked} type="number" min="0" placeholder="Yorum sayısı" value={values.google.review_count} onChange={event => update('google', 'review_count', event.target.value)} style={ld.manualInput}/>
            </div>
          </section>

          <section style={sectionStyle(values.instagram.checked)}>
            <div style={ld.manualSectionHead}>
              <label style={ld.manualCheck}><input type="checkbox" checked={values.instagram.checked} onChange={event => update('instagram', 'checked', event.target.checked)}/><strong>Instagram</strong></label>
              {sourceButton(values.instagram.url || lead.social?.instagram_url, 'Instagram aç')}
            </div>
            <select aria-label="Instagram durumu" disabled={!values.instagram.checked} value={values.instagram.status} onChange={event => update('instagram', 'status', event.target.value)} style={ld.manualInput}>
              <option value="active">Aktif kullanılıyor</option><option value="inactive">Uzun süredir pasif</option><option value="not_found">Hesap bulunamadı</option><option value="unknown">Sonuç belirsiz</option>
            </select>
            <div className="manual-field-grid" style={ld.manualFields}>
              <input aria-label="Instagram takipçi sayısı" disabled={!values.instagram.checked} type="number" min="0" placeholder="Takipçi" value={values.instagram.followers} onChange={event => update('instagram', 'followers', event.target.value)} style={ld.manualInput}/>
              <input aria-label="Instagram gönderi sayısı" disabled={!values.instagram.checked} type="number" min="0" placeholder="Gönderi" value={values.instagram.post_count} onChange={event => update('instagram', 'post_count', event.target.value)} style={ld.manualInput}/>
            </div>
            <input aria-label="Instagram URL" disabled={!values.instagram.checked} placeholder="Instagram profil URL" value={values.instagram.url} onChange={event => update('instagram', 'url', event.target.value)} style={ld.manualInput}/>
          </section>

          <section style={sectionStyle(values.menu.checked)}>
            <div style={ld.manualSectionHead}>
              <label style={ld.manualCheck}><input type="checkbox" checked={values.menu.checked} onChange={event => update('menu', 'checked', event.target.checked)}/><strong>Menü</strong></label>
              {sourceButton(values.menu.url, 'Menüyü aç')}
            </div>
            <select aria-label="Menü durumu" disabled={!values.menu.checked} value={values.menu.status} onChange={event => update('menu', 'status', event.target.value)} style={ld.manualInput}>
              <option value="current">Güncel ve yeterli</option><option value="outdated">Eski / görseller yetersiz</option><option value="not_found">Dijital menü yok</option><option value="unknown">Sonuç belirsiz</option>
            </select>
            <input aria-label="Menü URL" disabled={!values.menu.checked} placeholder="Menü URL (varsa)" value={values.menu.url} onChange={event => update('menu', 'url', event.target.value)} style={ld.manualInput}/>
          </section>

          <section style={sectionStyle(values.website.checked)}>
            <div style={ld.manualSectionHead}>
              <label style={ld.manualCheck}><input type="checkbox" checked={values.website.checked} onChange={event => update('website', 'checked', event.target.checked)}/><strong>Website</strong></label>
              {sourceButton(values.website.url || lead.website?.website_url, 'Siteyi aç')}
            </div>
            <select aria-label="Website durumu" disabled={!values.website.checked} value={values.website.status} onChange={event => update('website', 'status', event.target.value)} style={ld.manualInput}>
              <option value="working">Çalışıyor ve güncel</option><option value="outdated">Eski / yetersiz</option><option value="not_found">Website yok</option><option value="unknown">Sonuç belirsiz</option>
            </select>
            <input aria-label="Website URL" disabled={!values.website.checked} placeholder="Website URL (varsa)" value={values.website.url} onChange={event => update('website', 'url', event.target.value)} style={ld.manualInput}/>
          </section>
        </div>
        <div style={ld.manualFooter}>
          <textarea aria-label="Manuel kontrol notu" placeholder="Kısa ekip notu (isteğe bağlı)" value={values.notes} onChange={event => setValues(previous => ({ ...previous, notes: event.target.value }))} style={ld.manualNote}/>
          <button type="submit" disabled={busy} style={{ ...ld.btnDark, opacity: busy ? .6 : 1 }}>{busy ? 'Kaydediliyor…' : 'Doğrulamayı kaydet'}</button>
        </div>
      </form>
    );
  }

  function ResearchBriefCard({ brief }) {
    if (!brief) return null;
    const gaps = [...(brief.confirmed_gaps || []), ...(brief.likely_gaps || [])];
    const manualFacts = brief.manual_facts || [];
    const unknowns = brief.manual_checks || brief.unknowns || [];
    const tone = brief.status === 'ready' ? ld.verifiedBadge : brief.status === 'partial' ? ld.discoveryBadge : ld.countBadge;
    return (
      <section style={ld.researchCard}>
        <div style={ld.findHeader}>
          <div>
            <div style={ld.eyebrow}>ARAŞTIRMA DOSYASI</div>
            <div style={ld.cardTitle}>Ne biliyoruz, neyi hâlâ sormalıyız?</div>
          </div>
          <span style={tone}>{brief.status_label}</span>

        </div>

  }

  function CommunicationCenter({ lead, playbook, onFeedback, onDataChange }) {
    const sourceDrafts = playbook.channel_drafts || [];
    const firstChannel = sourceDrafts.find(item => item.recipient_available)?.channel || sourceDrafts[0]?.channel || 'phone';
    const [activeChannel, setActiveChannel] = React.useState(firstChannel);
    const [drafts, setDrafts] = React.useState(() => Object.fromEntries(sourceDrafts.map(item => [item.channel, { ...item }])));
    const [busy, setBusy] = React.useState(false);
    const [approved, setApproved] = React.useState({});

    React.useEffect(() => {
      const rows = playbook.channel_drafts || [];
      const next = Object.fromEntries(rows.map(item => [item.channel, { ...item }]));
      setDrafts(next);
      setActiveChannel(rows.find(item => item.recipient_available)?.channel || rows[0]?.channel || 'phone');
      setApproved({});
    }, [lead.name, playbook.version]);

    const draft = drafts[activeChannel];
    if (!draft) return null;

    function updateDraft(field, value) {
      setDrafts(current => ({ ...current, [activeChannel]: { ...current[activeChannel], [field]: value } }));
      setApproved(current => ({ ...current, [activeChannel]: false }));
    }

    function copyDraft() {
      const text = draft.subject ? `Konu: ${draft.subject}\n\n${draft.body}` : draft.body;
      if (!navigator.clipboard?.writeText) return;
      navigator.clipboard.writeText(text).then(() => onFeedback(`${draft.label} taslağı kopyalandı.`));
    }

    function approveDraft() {
      if (!draft.body?.trim()) return;
      setBusy(true);
      saveDraftReview(lead, draft).then(() => {
        setApproved(current => ({ ...current, [activeChannel]: true }));
        onFeedback(`${draft.label} taslağı onaylandı; henüz gönderilmedi.`);
        if (onDataChange) onDataChange();
      }).catch(() => onFeedback('Taslak onayı kaydedilemedi.')).finally(() => setBusy(false));
    }

    return (
      <div className="lead-comms" style={ld.comms}>
        <div className="lead-comms-head" style={ld.commsHead}>
          <div>
            <div style={ld.miniLabel}>İLETİŞİM MERKEZİ</div>
            <strong>Metni kontrol et, düzenle ve onayla</strong>
          </div>
          <span style={ld.notSentBadge}>Otomatik gönderilmez</span>
        </div>
        <div className="hide-sb lead-channel-tabs" style={ld.channelTabs}>
          {sourceDrafts.map(item => (
            <button type="button" key={item.channel} style={activeChannel === item.channel ? ld.channelTabActive : ld.channelTab} onClick={() => setActiveChannel(item.channel)}>
              <span style={{ ...ld.channelDot, background: item.recipient_available ? 'var(--accent)' : 'var(--muted)' }}/>
              {item.label}
            </button>
          ))}
        </div>
        <div style={ld.draftMeta}>
          <span>{draft.recipient_available ? (draft.recipient || 'İletişim kanalı hazır') : 'Alıcı/kanal bilgisi eksik'}</span>
          <span>{playbook.discovery_only ? 'Keşif dili' : 'Kanıta dayalı dil'}</span>
        </div>
        {draft.subject !== undefined && (
          <input aria-label="E-posta konusu" value={draft.subject || ''} onChange={event => updateDraft('subject', event.target.value)} style={ld.draftSubject}/>
        )}
        <textarea aria-label={`${draft.label} taslağı`} value={draft.body || ''} onChange={event => updateDraft('body', event.target.value)} style={ld.draftEditor}/>
        <div style={ld.draftReview}><strong>Göndermeden önce:</strong> {draft.review_note}</div>
        <div className="lead-draft-footer" style={ld.draftFooter}>
          <span>{(draft.body || '').length} karakter</span>
          <div style={{ display: 'flex', gap: 8 }}>
            <button type="button" style={ld.btnGhost} onClick={copyDraft}>Kopyala</button>
            <button type="button" style={{ ...ld.btnDark, opacity: busy || !draft.body?.trim() ? 0.55 : 1 }} onClick={approveDraft} disabled={busy || !draft.body?.trim()}>
              {approved[activeChannel] ? 'Onaylandı' : busy ? 'Kaydediliyor…' : 'Taslağı onayla'}
            </button>
          </div>
        </div>
      </div>
    );
  }

    const [note,       setNote]       = React.useState('');
    const noteRequestRef = React.useRef(null);
    const [feedback,   setFeedback]   = React.useState('');
    const [busy,       setBusy]       = React.useState(false);
    const findings   = lead.audit_findings || [];

    const gapFindings = findings.filter(finding => finding.finding_type !== 'opportunity');

    const serviceMatches = lead.matched_services || [];
    const discoveryMatches = lead.discovery_services || [];

    const actionMeta = getPrimaryActionMeta(lead);
    const readiness  = getLeadReadiness(lead);

    const manualInstagram = lead.manual_verification?.instagram?.checked
      ? lead.manual_verification.instagram
      : null;

      && lead.social?.stats?.lookup_status === 'found';

    function copyEmail() {
      navigator.clipboard.writeText(lead.ai_email || '').then(() => {
        return addOutreach(lead.name, 'email_drafted', new Date().toISOString(), 'Taslak panoya kopyalandı');
      }).then(() => { setCopied(true); setTimeout(() => setCopied(false), 2000); });

    function copySalesText(text, label) {
      if (!text || !navigator.clipboard?.writeText) return;

    function saveNote() {
      const value = note.trim();
      if (!value) return;
      setBusy(true);
      // Retrying the same unsaved text reuses its id, so a save that did reach
      // the server is not stored twice.
      if (!noteRequestRef.current || noteRequestRef.current.text !== value) {
        noteRequestRef.current = { text: value, id: newRequestId() };
      }
      addOutreach(lead.name, 'note_added', new Date().toISOString(), value, noteRequestRef.current.id).then(() => {
        noteRequestRef.current = null;
        setNote('');
        setFeedback('Not kaydedildi.');
        if (onDataChange) onDataChange();
      }).catch(() => {
        setFeedback('Not kaydedilemedi; metnin duruyor. Bağlantıyı kontrol edip tekrar kaydet.');
      }).finally(() => {
        setBusy(false);
      });
    }

    function skipLead() {
      onNext();

                      <div key={finding.code || i} style={{ ...ld.findRow, alignItems: 'flex-start' }}>
                        <div style={{ ...ld.sevPill, ...sevStyle(sev) }}>{finding.finding_type === 'opportunity' ? 'Fırsat' : sev}</div>
