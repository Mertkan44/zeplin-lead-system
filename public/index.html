  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root, [data-theme="dark"] {
      --accent: #c5f24a; --accent-ink: #12140a;
      --bg: #0a0a0b; --panel: #141418; --panel2: #17171c; --raised: #1c1c22;
      --line: rgba(255,255,255,0.07); --line2: rgba(255,255,255,0.12);
      --tx: #f3f3f0; --sub: #93938f; --muted: #5c5c5a;
      --glow: radial-gradient(1200px 600px at 78% -8%, rgba(197,242,74,0.06), transparent 60%);
      --r: 26px; --rs: 18px;
    }
    [data-theme="light"] {
      --accent: #c5f24a; --accent-ink: #12140a;
      --bg: #faf9f4; --panel: #ffffff; --panel2: #f3f1e9; --raised: #efece0;
      --line: #e9e4d6; --line2: #ddd6c2;
      --tx: #0c0b08; --sub: #4a4535; --muted: #8b856f;
      --glow: radial-gradient(1200px 600px at 78% -8%, rgba(197,242,74,0.14), transparent 60%);
    }
    html, body { min-height: 100vh; background: var(--bg); }
    body { font-family: 'Instrument Sans', system-ui, sans-serif; color: var(--tx); -webkit-font-smoothing: antialiased; background: var(--glow), var(--bg); transition: background-color .2s, color .2s; }
    #root { min-height: 100vh; display: flex; flex-direction: column; }
    button { font-family: inherit; }
    textarea, input, select { font-family: inherit; }
    a { text-decoration: none; color: inherit; }
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 99px; }
    ::-webkit-scrollbar-track { background: transparent; }
    .pipe-card.dragging { opacity: 0.4; }
    .pipe-col.drag-over { background: var(--raised); }
    .ll-row:hover { background: var(--raised); }
    .hide-sb { scrollbar-width: none; -ms-overflow-style: none; }
    .hide-sb::-webkit-scrollbar { display: none; }
    @keyframes zspin { to { transform: rotate(360deg); } }
    @media (max-width: 1080px) {
      .tb-search-label { display: none !important; }
      .tb-nav-item { padding: 9px 11px !important; font-size: 12px !important; }
    }
  </style>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('zeplin_theme');
        document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>

  <script type="text/babel">
  // ── Helpers ────────────────────────────────────────────────────────────────

  function fmt(n) {
    if (!n) return '0';
    if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
    if (n >= 1000) return Math.round(n / 1000) + 'K';
    return String(n);
  }

  function fmtDate(str) {
    if (!str) return '';
    try {
      const d = new Date(str.replace(' ', 'T'));
      if (isNaN(d)) return str;
      return d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', year: 'numeric' });
    } catch(e) { return str; }
  }

  function readLocalStatuses() {
    try { return JSON.parse(localStorage.getItem(STATUS_KEY) || '{}'); } catch(e) { return {}; }
  }
  function writeLocalStatuses(obj) {
    localStorage.setItem(STATUS_KEY, JSON.stringify(obj || {}));
  }
  function getStatuses() {
    return Object.assign({}, readLocalStatuses(), remoteStatuses);
  }
  function persistStatus(name, s) {
    if (!apiReady) return Promise.resolve();
    return fetch('/api/status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, status: s }),
    }).then(res => {
      if (!res.ok) throw new Error('status_save_failed');
      return res.json();
    }).catch(err => {
      apiReady = false;
      console.warn('Status save fallback:', err);
    });
  }
  function setStatusLS(name, s) {
    const next = getStatuses();
    next[name] = s;
    remoteStatuses[name] = s;
    writeLocalStatuses(next);
    return persistStatus(name, s);
  }

  function readLocalOutreach() {
    try { return JSON.parse(localStorage.getItem(OUTREACH_KEY) || '[]'); } catch(e) { return []; }
  }
  function normalizeOutreachEvent(item) {
    if (!item) return null;
    return {
      lead: item.lead || item.lead_name || '',
      action: item.action || 'note',
      date: item.date || item.happened_at || item.created_at || new Date().toISOString(),
      note: item.note || '',
      ts: item.ts || item.id || Date.now(),
    };
  }
  function getOutreach() {
    return outreachEvents.length ? outreachEvents : readLocalOutreach().map(normalizeOutreachEvent).filter(Boolean);
  }
  function saveOutreach(arr) {
    outreachEvents = (arr || []).map(normalizeOutreachEvent).filter(Boolean);
    localStorage.setItem(OUTREACH_KEY, JSON.stringify(outreachEvents));
  }
  function getLeadEvents(name) {
    return getOutreach().filter(e => e.lead === name).sort((a, b) => b.date.localeCompare(a.date));
  }
  function persistOutreachEvent(evt) {
    if (!apiReady) return Promise.resolve();
    return fetch('/api/outreach', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        lead_name: evt.lead,
        action: evt.action,
        happened_at: evt.date,
        note: evt.note,
      }),
    }).then(res => {
      if (!res.ok) throw new Error('outreach_save_failed');
      return res.json();
    }).catch(err => {
      apiReady = false;
      console.warn('Outreach save fallback:', err);
    });
  }
  function addOutreach(name, action, date, note) {
    const arr = getOutreach();
    const evt = { lead: name, action, date, note, ts: Date.now() };
    arr.push(evt);
    saveOutreach(arr);
    const act = ACTIONS[action];
    if (act && act.status) setStatusLS(name, act.status);
    return persistOutreachEvent(evt);
  }

  function applyRemoteLeads(rows) {
    if (!Array.isArray(rows) || rows.length === 0) return;
    leads = rows.slice();
    remoteStatuses = {};
    leads.forEach(l => { remoteStatuses[l.name] = l.status || 'yeni'; });
    writeLocalStatuses(getStatuses());
  }

  function applyRemoteOutreach(rows) {
    if (!Array.isArray(rows)) return;
    outreachEvents = rows.map(normalizeOutreachEvent).filter(Boolean);
    localStorage.setItem(OUTREACH_KEY, JSON.stringify(outreachEvents));
  }

  function fetchJSON(url, options) {
    return fetch(url, options || {}).then(res => {
      if (!res.ok) throw new Error(`request_failed_${res.status}`);
      return res.json();
    });
  }

  function fetchAdminJSON(url, options) {
    const opts = { credentials: 'same-origin', ...(options || {}) };
    opts.headers = { 'Content-Type': 'application/json', ...((options || {}).headers || {}) };
    return fetch(url, opts).then(res => {
      if (!res.ok) {
        return res.json().catch(() => ({})).then(data => {
          throw new Error(data.error || `request_failed_${res.status}`);
        });
      }
      return res.json();
    });
  }

    const nextAction = lead.next_action || 'Sonraki aksiyon başlatıldı';
    const needsContactCompletion = /telefon|adres/i.test(nextAction) || (!lead.phone && !lead.address);

    if (needsContactCompletion) {
      openExternal(lead.maps_url || lead.website?.website_url || lead.social?.instagram_url);
      return addOutreach(
        lead.name,
        'data_enrichment_started',
        new Date().toISOString(),
        nextAction

      return addOutreach(
        lead.name,
        'call_made',
        new Date().toISOString(),
        nextAction
      ).then(() => ({ feedback: 'Arama aksiyonu kaydedildi.' }));
    }

    if (lead.ai_email) {
      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(lead.ai_email).catch(() => {});
      }
      return addOutreach(
        lead.name,
        'draft_prepared',
        new Date().toISOString(),
        'Hazır taslak panoya kopyalandı'
      ).then(() => ({ feedback: 'Mail taslağı panoya kopyalandı.' }));

    const term = q.trim().toLowerCase();
    const idx = rows.findIndex(lead => {
      const hay = [
        lead.name,
        lead.city,
        lead.category,
        lead.sector,
        lead.next_action,
        ...(lead.scoring?.issues || []),
      ].join(' ').toLowerCase();

  function getPipelineStage(lead) {
    const st = getStatuses()[lead.name] || 'yeni';
    if (st === 'converted') return 'won';
    const evs = getLeadEvents(lead.name);
    const last = evs.find(e => e.action !== 'note');
    if (!last) return st === 'contacted' ? 'contacted' : 'new';
    const map = { data_enrichment_started: 'enrich', draft_prepared: 'draft', outreach_review_started: 'draft', email_sent: 'contacted', reply_received: 'contacted', call_made: 'contacted',
                  meeting_scheduled: 'meeting', deal_won: 'won', deal_lost: 'lost' };
    return map[last.action] || (st === 'contacted' ? 'contacted' : 'new');
  }

    return Boolean(lead.phone || lead.address);

    const nextAction = lead.next_action || '';
    return /telefon|adres/i.test(nextAction) || !hasContactInfo(lead);

      .sort((a, b) => {

        if (delta !== 0) return delta;
        return (b.estimated_value_tl || 0) - (a.estimated_value_tl || 0);

  function issueToSeverity(text) {

    if (t.includes('web sitesi yok') || t.includes('website yok') || t.includes('site yok')) return 'Yüksek';
    if (t.includes('schema') || t.includes('og') || t.includes('open graph')) return 'Orta';
    if (t.includes('telefon') || t.includes('adres') || t.includes('tamamla') || t.includes('instagram yok')) return 'Düşük';
    return 'Bilgi';
  }

  function ScoreRing({ score, grade, size = 56, stroke = 4 }) {
    const r = (size - stroke) / 2;

      <div style={{ position: 'relative', width: size, height: size, flexShrink: 0 }}>

          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={gradeColor(grade)} strokeWidth={stroke} strokeLinecap="round" strokeDasharray={c} strokeDashoffset={off} style={{ transition: 'stroke-dashoffset .9s cubic-bezier(.22,1,.36,1)' }}/>

  function computeWeekBuckets(leads) {
    const now = new Date();
    const buckets = new Array(8).fill(0);
    leads.forEach(l => {
      if (!l.last_analyzed) return;
      const d = new Date(l.last_analyzed.replace(' ', 'T'));
      if (isNaN(d)) return;
      const diffDays = Math.floor((now - d) / 86400000);
      const weekIdx = Math.floor(diffDays / 7);
      if (weekIdx >= 0 && weekIdx < 8) buckets[7 - weekIdx] += 1;
    });
    return buckets;
  }

  function mostCommonCity(leads) {
    const counts = {};
    leads.forEach(l => { if (l.city) counts[l.city] = (counts[l.city]||0) + 1; });
    const entries = Object.entries(counts).sort((a,b) => b[1]-a[1]);
    return entries.length ? entries[0][0] : '';
  }

  function exportLeadsCSV(leads) {
    const cols = ['name','city','category','scoring.score','scoring.grade','estimated_value_tl','sales_priority_score','phone'];
    const get = (obj, path) => path.split('.').reduce((o,k) => (o||{})[k], obj);
    const header = ['İşletme','Şehir','Kategori','Skor','Sınıf','Tahmini Değer','Öncelik','Telefon'];
    const rows = leads.map(l => cols.map(c => { const v = get(l, c); return v === undefined || v === null ? '' : String(v).replace(/"/g,'""'); }));
    const csv = [header, ...rows].map(r => r.map(v => `"${v}"`).join(',')).join('\n');
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'zeplin-leadler.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ── Workspace view (matches Lead Workspace design 1:1) ─────────────────────

  function IconCal() {

  }
  function IconPlus({ color = '#12140a' }) {
    return <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke={color} strokeWidth="2.4" strokeLinecap="round"/></svg>;
  }
  function IconTrend() {
    return <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 18L10 12l4 4 6-8" stroke="#12140a" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
  }
  function IconStar() {
    return <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 3l1.9 4.9L19 9.8l-4.1 3.1L16 18l-4-2.7L8 18l1.1-5.1L5 9.8l5.1-1.9L12 3z" fill="var(--accent)"/></svg>;
  }
  function IconMail({ color = 'var(--accent)' }) {
    return <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="3" stroke={color} strokeWidth="2"/><path d="M4 7l8 6 8-6" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
  }
  function IconCall() {
    return <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 5c0 9 6 15 15 15l-1-4-4-1-2 2c-2-1-4-3-5-5l2-2-1-4-4-1z" fill="#12140a"/></svg>;

  function IconDots() {
    return <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg>;
  }

  function SelectedPanel({ lead, onOpenDetail }) {
    const [reportOpen, setReportOpen] = React.useState(true);
    const [emailOpen, setEmailOpen]   = React.useState(false);
    const [copied, setCopied]         = React.useState(false);

    React.useEffect(() => { setReportOpen(true); setEmailOpen(false); }, [lead.name]);

    const audit = auditFor(lead);
    const ms  = (lead.matched_services || [])[0] || {};
    const pkg = lead.recommended_package;
    const hasPackage = Boolean(pkg) && (lead.matched_services || []).length > 0;

    function copyEmail() {
      if (!lead.ai_email) return;
      if (navigator.clipboard?.writeText) navigator.clipboard.writeText(lead.ai_email).catch(() => {});
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    }

    return (
      <div style={wp.panelInner}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 14 }}>
          <div style={{ minWidth: 0, cursor: 'pointer' }} onClick={onOpenDetail}>
            <div style={wp.panelEyebrow}>Seçili Lead</div>
            <div style={wp.panelName}>{lead.name}</div>
            <div style={wp.panelSub}>{lead.category || lead.sector || 'İşletme'} · {lead.city}</div>
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 7, flexShrink: 0 }}>
            <ScoreRing score={lead.scoring.score} grade={lead.scoring.grade} size={78} stroke={5}/>
            <span style={gradeChipStyle(lead.scoring.grade)}>Sınıf {lead.scoring.grade}</span>
          </div>
        </div>

        <div style={wp.metricsGrid}>
          <div style={wp.metricBox}>
            <div style={wp.metricLabel}>Tahmini Değer</div>
            <div style={wp.metricValue}>{lead.estimated_value_tl > 0 ? `~${fmt(lead.estimated_value_tl)} ₺` : '—'}</div>
          </div>
          <div style={wp.metricBox}>
            <div style={wp.metricLabel}>Satış Önceliği</div>
            <div style={{ ...wp.metricValue, color: 'var(--accent)' }}>{lead.sales_priority_score || 0}<span style={{ fontSize: 12, color: 'var(--muted)' }}>/100</span></div>
          </div>
        </div>

        <div>
          <div style={wp.sectionLabel}>Dijital Denetim</div>
          <div style={wp.auditGrid}>
            {audit.map(a => (
              <div key={a.label} style={wp.auditRow}>
                <span style={{ ...wp.auditMark, background: a.bg, color: a.fg }}>{a.mark}</span>
                <div style={{ minWidth: 0 }}>
                  <div style={wp.auditLabel}>{a.label}</div>
                  <div style={wp.auditNote}>{a.note}</div>
                </div>
              </div>
            ))}
          </div>
        </div>

        {(lead.matched_services || []).length > 0 && (
          <div>
            <div style={wp.sectionLabel}>Eşleşen Hizmetler</div>
            <div style={{ display: 'flex', gap: 7, flexWrap: 'wrap' }}>
              {lead.matched_services.map(s => <span key={s.slug} style={wp.svcChip}>{s.name}</span>)}
            </div>
          </div>
        )}

        {hasPackage ? (
          <div style={wp.pkgBox}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
              <span style={wp.pkgEyebrow}>Önerilen Paket</span>
              {pkg.stage && <span style={wp.pkgStage}>{pkg.stage}</span>}
            </div>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', gap: 12 }}>
              <div style={{ minWidth: 0 }}>
                <div style={wp.pkgName}>{pkg.name}</div>
                <div style={wp.pkgPrice}>
                  {ms.monthly ? `${fmt(ms.price_min)} ₺/ay` : `${(ms.price_min||0).toLocaleString('tr-TR')}–${(ms.price_max||0).toLocaleString('tr-TR')} ₺`}
                  {pkg.confidence ? ` · %${pkg.confidence} güven` : ''}
                </div>
              </div>
              <button style={wp.pkgBtn} onClick={onOpenDetail}>Teklif Oluştur</button>
            </div>
          </div>
        ) : (
          <div style={{ ...wp.pkgBox, background: 'var(--panel2)' }}>
            <span style={wp.pkgEyebrow}>Önerilen Paket</span>
            <div style={{ fontSize: 13, color: 'var(--sub)', marginTop: 8 }}>Paket önerisi için lead verisi tamamlanmalı.</div>
          </div>
        )}

        {lead.ai_report && (
          <div>
            <button style={wp.toggleBtn} onClick={() => setReportOpen(o => !o)}>
              <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}><IconStar/> AI Raporu</span>
              <span style={{ fontSize: 18, color: 'var(--sub)' }}>{reportOpen ? '−' : '+'}</span>
            </button>
            {reportOpen && <div style={wp.togglePanel}>{lead.ai_report}</div>}
          </div>
        )}

        {lead.ai_email && (
          <div>
            <button style={wp.toggleBtn} onClick={() => setEmailOpen(o => !o)}>
              <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}><IconMail/> Satış Maili</span>
              <span style={{ fontSize: 18, color: 'var(--sub)' }}>{emailOpen ? '−' : '+'}</span>
            </button>
            {emailOpen && <div style={wp.togglePanel}>{lead.ai_email}</div>}
          </div>
        )}

        <div style={{ display: 'flex', gap: 9 }}>
          {lead.phone
            ? <a href={`tel:${lead.phone.replace(/\s+/g,'')}`} style={wp.callBtn}><IconCall/> Ara</a>
            : <span style={{ ...wp.callBtn, opacity: 0.4, pointerEvents: 'none' }}><IconCall/> Ara</span>}
          {lead.ai_email
            ? <button style={wp.mailBtn} onClick={copyEmail}><IconMail color="currentColor"/> {copied ? 'Kopyalandı' : 'Mail Gönder'}</button>
            : <span style={{ ...wp.mailBtn, opacity: 0.4, pointerEvents: 'none' }}><IconMail color="currentColor"/> Mail Gönder</span>}
          <button style={wp.moreBtn} onClick={onOpenDetail} title="Detaylı görünüm">
            <IconDots/>
          </button>
        </div>
      </div>
    );
  }

  function CockpitMain({ leads, statuses, onSelect, onOpenAdmin }) {
    const [filter, setFilter] = React.useState('hepsi');
    const [selectedName, setSelectedName] = React.useState(leads[0]?.name);

    React.useEffect(() => {
      if (!leads.some(l => l.name === selectedName)) setSelectedName(leads[0]?.name);
    }, [leads]);

    const filtered = React.useMemo(() => filterLeads(leads, filter), [leads, filter]);
    const selected = leads.find(l => l.name === selectedName) || leads[0];
    const selIdx   = leads.indexOf(selected);

    const totalVal  = leads.reduce((s, l) => s + (l.estimated_value_tl || 0), 0);
    const avgScore  = Math.round(leads.reduce((s, l) => s + (l.scoring?.score || 0), 0) / (leads.length || 1));
    const gradeA    = leads.filter(l => l.scoring.grade === 'A').length;
    const converted = leads.filter(l => statuses[l.name] === 'converted').length;
    const weekBuckets = React.useMemo(() => computeWeekBuckets(leads), [leads]);
    const weekMax = Math.max(...weekBuckets, 1);
    const topCity = React.useMemo(() => mostCommonCity(leads), [leads]);
    const dateStr = React.useMemo(() => new Date().toLocaleDateString('tr-TR', { day: '2-digit', month: 'long', year: 'numeric' }), []);

    const kpis = [
      { label: 'Toplam Lead',   value: String(leads.length), delta: `+${weekBuckets[7]} bu hafta`, dot: 'var(--accent)' },
      { label: 'Ort. Skor',     value: String(avgScore),     delta: '/ 100 puan',       dot: '#ffcf4a' },
      { label: 'A Sınıfı Lead', value: String(gradeA),        delta: 'yüksek öncelik',   dot: '#b6f24a' },
      { label: 'Dönüşen',       value: String(converted),     delta: 'müşteri oldu',     dot: '#7cc5ff' },
    ];

    return (
      <main style={wp.main}>
        <div style={wp.headRow}>
          <div>
            <div style={wp.eyebrow}>{topCity || 'Genel'} · lead sahası</div>
            <h1 style={wp.h1}>Lead Workspace</h1>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            <div style={wp.dateChip}><IconCal/><span>{dateStr}</span></div>
            <button style={wp.ctaBtn} onClick={onOpenAdmin}><IconPlus/> Yeni Tarama</button>
          </div>
        </div>

        <div style={wp.kpiRow}>
          <div style={wp.accentCard}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
              <div>
                <div style={wp.accentLabel}>Tahmini Pipeline</div>
                <div style={wp.accentValue}>~{fmt(totalVal)} ₺</div>
                <div style={wp.accentSub}>{leads.length} aktif lead · {gradeA} A sınıfı</div>
              </div>
              <div style={wp.accentIcon}><IconTrend/></div>
            </div>
            <div style={wp.accentBars}>
              {weekBuckets.map((n, i) => (
                <div key={i} style={{ flex: 1, height: `${Math.max((n / weekMax) * 100, 8)}%`, background: i === 7 ? '#12140a' : 'rgba(18,20,10,0.22)', borderRadius: 5 }}/>
              ))}
            </div>
          </div>
          {kpis.map(k => (
            <div key={k.label} style={wp.kpiCard}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                <span style={wp.kpiLabel}>{k.label}</span>
                <span style={{ width: 8, height: 8, borderRadius: 999, background: k.dot }}/>
              </div>
              <div>
                <div style={wp.kpiValue}>{k.value}</div>
                <div style={wp.kpiDelta}>{k.delta}</div>
              </div>
            </div>
          ))}
        </div>

        <div style={wp.body}>
          <div style={{ minWidth: 0 }}>
            <FilterPills active={filter} onChange={setFilter} count={filtered.length}/>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
              {filtered.length === 0 && <div style={{ padding: 24, background: 'var(--panel)', border: '1px solid var(--line)', borderRadius: 'var(--r)', color: 'var(--sub)', fontSize: 13, textAlign: 'center' }}>Bu filtrede lead yok.</div>}
              {filtered.map(l => {
                const gIdx = leads.indexOf(l);
                const st = statuses[l.name] || 'yeni';
                const isSelected = selected && selected.name === l.name;
                const chips = chipsFor(l);
                const issues = (l.scoring.issues || []).slice(0, 2);
                const opps   = (l.scoring.opportunities || []).slice(0, 2);
                return (
                  <div key={l.name} onClick={() => setSelectedName(l.name)} style={{ ...wp.card, ...(isSelected ? wp.cardSelected : null) }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', gap: 16 }}>
                      <div style={{ minWidth: 0, flex: 1 }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 9, marginBottom: 9 }}>
                          <span style={statusChipStyle(st)}>{statusMeta(st).label}</span>
                          <span style={{ fontSize: 11.5, color: 'var(--muted)' }}>{fmtDate(l.last_analyzed)}</span>
                        </div>
                        <div style={wp.cardName}>{l.name}</div>
                        <div style={wp.cardSub}>{l.category || l.sector || 'İşletme'} · {l.city} · <span style={{ color: 'var(--tx)', fontWeight: 600 }}>{l.estimated_value_tl > 0 ? `~${fmt(l.estimated_value_tl)} ₺` : '—'}</span></div>
                      </div>
                      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6, flexShrink: 0 }}>
                        <ScoreRing score={l.scoring.score} grade={l.scoring.grade} size={56} stroke={4}/>
                        <span style={gradeChipStyle(l.scoring.grade)}>{l.scoring.grade}</span>
                      </div>
                    </div>
                    <div style={{ display: 'flex', gap: 7, flexWrap: 'wrap', marginTop: 14 }}>
                      {chips.map((c, i) => (
                        <span key={i} style={c.style}>{c.dot && <span style={{ width: 5, height: 5, borderRadius: 999, background: 'var(--accent)', display: 'inline-block', marginRight: 5 }}/>}{c.label}</span>
                      ))}
                    </div>
                    {(issues.length > 0 || opps.length > 0) && (
                      <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginTop: 10 }}>
                        {issues.map((t, i) => <span key={'i'+i} style={wp.tagIssue}>{t}</span>)}
                        {opps.map((t, i) => <span key={'o'+i} style={wp.tagOpp}>{t}</span>)}
                      </div>
                    )}
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: 16, paddingTop: 14, borderTop: '1px solid var(--line)' }}>
                      <span style={{ fontSize: 12, color: 'var(--sub)' }}>Son analiz · {fmtDate(l.last_analyzed) || '—'}</span>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                        <span style={{ fontSize: 11.5, color: 'var(--muted)' }}>Öncelik</span>
                        <span style={{ fontFamily: "'Space Grotesk'", fontSize: 13, fontWeight: 700, color: 'var(--accent)' }}>{l.sales_priority_score || 0}</span>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          <aside style={wp.panel}>
            {selected && <SelectedPanel lead={selected} onOpenDetail={() => onSelect(selIdx)}/>}
          </aside>
        </div>
      </main>
    );
  }

    cardName:      { fontFamily: "'Space Grotesk'", fontSize: 20, fontWeight: 600, letterSpacing: '-0.01em', lineHeight: 1.15, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', color: 'var(--tx)' },
    cardSub:       { fontSize: 12.5, color: 'var(--sub)', marginTop: 4 },
    tagIssue:      { fontSize: 11, fontWeight: 500, padding: '3px 9px', borderRadius: 7, background: 'rgba(255,107,107,0.09)', border: '1px solid rgba(255,107,107,0.2)', color: '#ff8f8f' },
    tagOpp:        { fontSize: 11, fontWeight: 500, padding: '3px 9px', borderRadius: 7, background: 'rgba(197,242,74,0.1)', border: '1px solid rgba(197,242,74,0.22)', color: '#d3f56e' },
    panel:         { position: 'sticky', top: 90, background: 'var(--panel)', border: '1px solid var(--line)', borderRadius: 28, padding: 24, display: 'flex', flexDirection: 'column', gap: 18 },
    panelInner:    { display: 'flex', flexDirection: 'column', gap: 18 },
    panelEyebrow:  { fontSize: 11, color: 'var(--muted)', letterSpacing: '0.09em', textTransform: 'uppercase', marginBottom: 8 },
    panelName:     { fontFamily: "'Space Grotesk'", fontSize: 26, fontWeight: 600, letterSpacing: '-0.02em', lineHeight: 1.12, color: 'var(--tx)' },
    panelSub:      { fontSize: 13, color: 'var(--sub)', marginTop: 5 },
    metricsGrid:   { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 },
    metricBox:     { background: 'var(--raised)', borderRadius: 16, padding: '14px 16px' },
    metricLabel:   { fontSize: 11, color: 'var(--sub)', marginBottom: 4 },
    metricValue:   { fontFamily: "'Space Grotesk'", fontSize: 20, fontWeight: 700, color: 'var(--tx)' },
    sectionLabel:  { fontSize: 11, color: 'var(--muted)', letterSpacing: '0.09em', textTransform: 'uppercase', marginBottom: 10 },
    auditGrid:     { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 },
    auditRow:      { display: 'flex', alignItems: 'center', gap: 9, background: 'var(--raised)', borderRadius: 12, padding: '9px 12px' },
    auditMark:     { width: 19, height: 19, borderRadius: 999, flexShrink: 0, display: 'grid', placeItems: 'center', fontSize: 11, fontWeight: 700 },
    auditLabel:    { fontSize: 11.5, color: 'var(--tx)', fontWeight: 500, lineHeight: 1.1 },
    auditNote:     { fontSize: 10.5, color: 'var(--muted)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' },
    svcChip:       { fontSize: 12, fontWeight: 500, padding: '6px 13px', borderRadius: 999, background: 'var(--raised)', border: '1px solid var(--line)', color: 'var(--tx)' },
    pkgBox:        { background: 'var(--accent)', borderRadius: 20, padding: '18px 20px', color: 'var(--accent-ink)' },
    pkgEyebrow:    { fontSize: 11, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.06em', opacity: 0.7 },
    pkgStage:      { fontSize: 11, fontWeight: 600, background: 'rgba(18,20,10,0.16)', padding: '3px 10px', borderRadius: 999 },
    pkgName:       { fontFamily: "'Space Grotesk'", fontSize: 22, fontWeight: 700, letterSpacing: '-0.01em', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' },
    pkgPrice:      { fontSize: 12.5, fontWeight: 600, opacity: 0.75, marginTop: 2 },
    pkgBtn:        { background: '#12140a', color: 'var(--accent)', border: 'none', borderRadius: 999, padding: '9px 16px', fontFamily: "'Instrument Sans'", fontSize: 12.5, fontWeight: 600, cursor: 'pointer', flexShrink: 0 },
    toggleBtn:     { width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'space-between', background: 'var(--raised)', border: '1px solid var(--line)', borderRadius: 14, padding: '12px 15px', color: 'var(--tx)', fontFamily: "'Instrument Sans'", fontSize: 13, fontWeight: 600, cursor: 'pointer' },
    togglePanel:   { marginTop: 8, background: 'var(--panel2)', border: '1px solid var(--line)', borderRadius: 14, padding: '15px 16px', fontSize: 12.5, lineHeight: 1.65, color: 'var(--sub)', whiteSpace: 'pre-wrap' },
    callBtn:       { flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, background: 'var(--accent)', color: 'var(--accent-ink)', border: 'none', borderRadius: 14, padding: 13, fontFamily: "'Instrument Sans'", fontSize: 13, fontWeight: 600, cursor: 'pointer' },
    mailBtn:       { flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, background: 'var(--raised)', color: 'var(--tx)', border: '1px solid var(--line)', borderRadius: 14, padding: 13, fontFamily: "'Instrument Sans'", fontSize: 13, fontWeight: 600, cursor: 'pointer' },
    moreBtn:       { width: 48, display: 'grid', placeItems: 'center', background: 'var(--raised)', color: 'var(--sub)', border: '1px solid var(--line)', borderRadius: 14, cursor: 'pointer' },
  };

  // ── Lead Detail ────────────────────────────────────────────────────────────

  function sevStyle(s) {
    return ({ Kritik: { background: 'rgba(255,107,107,0.14)', color: '#ff8f8f' }, Yüksek: { background: 'rgba(255,159,67,0.14)', color: '#ffb36b' }, Orta: { background: 'rgba(255,207,74,0.14)', color: '#ffcf4a' }, Düşük: { background: 'rgba(124,197,255,0.14)', color: '#7cc5ff' }, Bilgi: { background: 'var(--raised)', color: 'var(--sub)' } })[s] || { background: 'var(--raised)', color: 'var(--sub)' };
  }

  function LeadDetail({ lead, idx, total, status, onStatusChange, onBack, onPrev, onNext, onDataChange }) {
    const [showReport, setShowReport] = React.useState(false);
    const [showEmail,  setShowEmail]  = React.useState(false);
    const [copied,     setCopied]     = React.useState(false);
    const [note,       setNote]       = React.useState('');
    const [feedback,   setFeedback]   = React.useState('');
    const [busy,       setBusy]       = React.useState(false);
    const issues     = lead.scoring.issues || [];
    const hasPackage = lead.matched_services?.length > 0 && lead.recommended_package?.name !== 'Veri tamamlama';
    const svc = lead.recommended_package || {};
    const ms  = (lead.matched_services || [])[0] || {};
    const events     = getLeadEvents(lead.name);
    const actionMeta = getPrimaryActionMeta(lead);
    const readiness  = getLeadReadiness(lead);
    const lastEvent  = events[0] || null;

    React.useEffect(() => {
      if (!feedback) return;
      const timer = setTimeout(() => setFeedback(''), 2400);
      return () => clearTimeout(timer);
    }, [feedback]);

    function copyEmail() {
      navigator.clipboard.writeText(lead.ai_email || '').then(() => { setCopied(true); setTimeout(() => setCopied(false), 2000); });
    }

    function saveNote() {
      const value = note.trim();
      if (!value) return;
      setBusy(true);
      addOutreach(lead.name, 'note', new Date().toISOString(), value).then(() => {
        setFeedback('Not kaydedildi.');
      }).catch(() => {
        setFeedback('Not yerelde kaydedildi.');
      }).finally(() => {
        setBusy(false);
        setNote('');
        if (onDataChange) onDataChange();
      });
    }

    function skipLead() {
      onNext();
    }

    function handlePrimaryAction() {
      setBusy(true);
      startLeadAction(lead).then(result => {
        setFeedback((result && result.feedback) || 'Aksiyon kaydedildi.');
      }).catch(() => {
        setFeedback('Aksiyon yerelde işlendi.');
      }).finally(() => {
        setBusy(false);
        if (onDataChange) onDataChange();
      });
    }

    return (
      <div style={ld.root}>
        <header style={ld.top}>
          <div style={ld.crumbs}>
            <span style={{ ...ld.crumb, cursor: 'pointer', color: 'var(--sub)' }} onClick={onBack}>Workspace</span>
            <span style={ld.crumbSep}>/</span><span style={ld.crumb}>Leadler</span>
            <span style={ld.crumbSep}>/</span>
            <span style={{ ...ld.crumb, color: 'var(--tx)', fontWeight: 600 }}>{lead.name}</span>
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            <button style={{ ...ld.btnGhost, opacity: idx === 0 ? 0.4 : 1 }} onClick={onPrev} disabled={idx === 0}>← Önceki</button>
            <button style={{ ...ld.btnGhost, opacity: idx === total-1 ? 0.4 : 1 }} onClick={onNext} disabled={idx === total-1}>Sonraki →</button>
            <button style={ld.btnDark} onClick={onBack}>← Workspace</button>
          </div>
        </header>

        <section style={ld.hero}>
          <div style={ld.heroLeft}>
            <div style={ld.statusRow}>
              <span style={ld.statusBadge}>● {(status || 'yeni').toUpperCase()}</span>
              {(lead.category || lead.sector) && <span style={ld.metaTag}>{lead.category || lead.sector}</span>}
              {lead.city && <span style={ld.metaTag}>{lead.city}</span>}
              {lead.last_analyzed && <span style={ld.metaText}>Son analiz · {fmtDate(lead.last_analyzed)}</span>}
            </div>
            <h1 style={ld.h1}>{lead.name}</h1>
            <div style={ld.urls}>
              {lead.website?.website_url && <a href={lead.website.website_url} target="_blank" rel="noopener noreferrer" style={ld.urlChip}>{lead.website.website_url.replace(/^https?:\/\//, '').replace(/\/$/, '')} ↗</a>}
              {lead.social?.instagram_url && <a href={lead.social.instagram_url} target="_blank" rel="noopener noreferrer" style={ld.urlChip}>@{lead.social.instagram_username || 'instagram'} ↗</a>}
              {lead.maps_url && <a href={lead.maps_url} target="_blank" rel="noopener noreferrer" style={ld.urlChip}>Google Maps ↗</a>}
              {lead.phone && <span style={ld.urlChip}>{lead.phone}</span>}
            </div>
            <div style={ld.quickActions}>
              {lead.phone && <a href={`tel:${lead.phone.replace(/\s+/g, '')}`} style={ld.quickBtn}>Telefonu aç</a>}
              {lead.website?.website_url && <button style={ld.quickBtn} onClick={() => openExternal(lead.website.website_url)}>Siteyi aç</button>}
              {lead.social?.instagram_url && <button style={ld.quickBtn} onClick={() => openExternal(lead.social.instagram_url)}>Instagram aç</button>}
              {lead.maps_url && <button style={ld.quickBtn} onClick={() => openExternal(lead.maps_url)}>Maps aç</button>}
              {lead.ai_email && <button style={ld.quickBtn} onClick={copyEmail}>{copied ? 'Taslak kopyalandi' : 'Taslagi kopyala'}</button>}
            </div>
          </div>
          <div style={ld.heroRight}>
            <div>
              <svg width="120" height="120" viewBox="0 0 120 120">
                <circle cx="60" cy="60" r="52" fill="none" stroke="var(--line2)" strokeWidth="6"/>
                <circle cx="60" cy="60" r="52" fill="none" stroke="var(--accent)" strokeWidth="6" strokeDasharray="326.7" strokeDashoffset={scoreDash(lead.scoring.score)} transform="rotate(-90 60 60)" strokeLinecap="round"/>
                <text x="60" y="60" textAnchor="middle" fontSize="32" fontWeight="600" fill="var(--tx)" fontFamily="Space Grotesk">{lead.scoring.score}</text>
                <text x="60" y="80" textAnchor="middle" fontSize="11" fill="var(--muted)" fontFamily="Space Grotesk">/100</text>
              </svg>
            </div>
            <div style={ld.gradePill}>{lead.scoring.grade}</div>
          </div>
        </section>

        {lead.next_action && (
          <div style={ld.nextAction}>
            <div>
              <div style={ld.naEyebrow}>SONRAKİ EN İYİ AKSİYON · ÖNCELİK {lead.sales_priority_score || '—'}</div>
              <div style={ld.naTitle}>{lead.next_action}</div>
              {lead.priority_reason && <div style={ld.naDesc}>{lead.priority_reason}</div>}
              <div style={ld.naHelper}>{actionMeta.helper}</div>
              {feedback && <div style={ld.inlineFeedback}>{feedback}</div>}
            </div>
            <div style={{ display: 'flex', gap: 8 }}>
              <button style={{ ...ld.btnGhost, opacity: busy ? 0.7 : 1 }} onClick={skipLead} disabled={busy}>Atla</button>
              <button style={{ ...ld.btnDark, opacity: busy ? 0.7 : 1 }} onClick={handlePrimaryAction} disabled={busy}>{busy ? 'Kaydediliyor…' : `${actionMeta.label} →`}</button>
            </div>
          </div>
        )}

        <section style={ld.cols}>
          <div>
            <div style={ld.statsCard}>
              <div style={ld.statsHeader}><div style={ld.eyebrow}>SOSYAL SİNYALLER</div><div style={ld.cardTitle}>Etkileşim ve büyüme</div></div>
              <div style={ld.statsGrid}>
                {[
                  ['Instagram', lead.social?.has_instagram ? '✓' : '✗'],
                  ['Takipçi',   lead.social?.stats?.followers  ? String(lead.social.stats.followers)  : '—'],
                  ['Gönderi',   lead.social?.stats?.post_count  ? String(lead.social.stats.post_count)  : '—'],
                  ['Ort. beğeni',lead.social?.stats?.avg_likes   ? String(lead.social.stats.avg_likes)   : '—'],
                  ['Etkileşim', lead.social?.stats?.engagement_rate ? `%${lead.social.stats.engagement_rate}` : '—'],
                ].map(([l, v], i) => (
                  <div key={i} style={{ ...ld.stat, ...(i === 4 ? { borderRight: 'none' } : {}) }}>
                    <div style={ld.statLabel}>{l}</div>
                    <div style={ld.statVal}>{v}</div>
                  </div>
                ))}
              </div>
            </div>

            {hasPackage ? (
              <div style={ld.packCard}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 16 }}>
                  <div style={{ flex: 1 }}>
                    <div style={ld.eyebrow}>ÖNERİLEN PAKET · {(svc.category || 'DİJİTAL').toUpperCase()}</div>
                    <h3 style={ld.packTitle}>{svc.name}</h3>
                    <div style={ld.packDesc}>{svc.summary || svc.description || 'Dijital varlığınızı güçlendirir.'}</div>
                  </div>
                  {(ms.price_min || ms.price_max) ? (
                    <div style={ld.packRight}>
                      <div style={ld.packPrice}>~{fmt(ms.price_min)} ₺ <span style={{ fontSize: 11, color: 'var(--muted)' }}>/ay</span></div>
                      <div style={ld.packRange}>{(ms.price_min||0).toLocaleString('tr-TR')} – {(ms.price_max||0).toLocaleString('tr-TR')} ₺ <span style={{ color: 'var(--muted)' }}>tek seferlik</span></div>
                    </div>
                  ) : null}
                </div>
                <div style={ld.packTags}>
                  {[svc.category, svc.name].filter(Boolean).map((t, i) => <span key={i} style={i === 0 ? ld.tagPrimary : ld.tag}>{t}</span>)}
                </div>
              </div>
            ) : (
              <div style={{ ...ld.packCard, background: 'var(--panel2)' }}>
                <div style={ld.eyebrow}>ÖNERİLEN PAKET</div>
                <div style={{ fontSize: 14, color: 'var(--sub)', marginTop: 8 }}>Paket önerisi için lead verisi tamamlanmalı.</div>
              </div>
            )}

            <div style={ld.findCard}>
              <div style={ld.findHeader}><div style={ld.eyebrow}>TARAMA BULGULARI</div><div style={ld.cardTitle}>{issues.length > 0 ? `${issues.length} sinyal` : 'Temiz'}</div></div>
              {issues.length === 0
                ? <div style={{ padding: '16px 24px', color: 'var(--sub)', fontSize: 13 }}>Sorun tespit edilmedi.</div>
                : issues.map((issue, i) => {
                    const sev = issueToSeverity(issue);
                    return (
                      <div key={i} style={ld.findRow}>
                        <div style={{ ...ld.sevPill, ...sevStyle(sev) }}>{sev}</div>
                        <div style={{ flex: 1 }}><div style={ld.findTitle}>{issue}</div></div>
                        <button style={ld.findBtn} onClick={() => openFixContext(lead, issue)}>Düzelt →</button>
                      </div>
                    );
                  })
              }
            </div>

            {lead.ai_report && (
              <div style={{ ...ld.findCard, marginTop: 16 }}>
                <div style={{ ...ld.findHeader, cursor: 'pointer', userSelect: 'none' }} onClick={() => setShowReport(r => !r)}>
                  <div><div style={ld.eyebrow}>AI RAPORU</div><div style={ld.cardTitle}>Zeplin AI Analizi {showReport ? '▲' : '▼'}</div></div>
                </div>
                {showReport && <div style={{ padding: '16px 24px', fontSize: 13.5, color: 'var(--sub)', lineHeight: 1.7, whiteSpace: 'pre-wrap' }}>{lead.ai_report}</div>}
              </div>
            )}

            {lead.ai_email && (
              <div style={{ ...ld.findCard, marginTop: 16 }}>
                <div style={{ ...ld.findHeader, cursor: 'pointer', userSelect: 'none' }} onClick={() => setShowEmail(e => !e)}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', width: '100%' }}>
                    <div><div style={ld.eyebrow}>SATIŞ E-POSTASI</div><div style={ld.cardTitle}>Hazır taslak {showEmail ? '▲' : '▼'}</div></div>
                    {showEmail && <button style={ld.findBtn} onClick={e => { e.stopPropagation(); copyEmail(); }}>{copied ? '✓ Kopyalandı' : 'Kopyala'}</button>}
                  </div>
                </div>
                {showEmail && <div style={{ padding: '16px 24px', fontSize: 13, color: 'var(--sub)', lineHeight: 1.7, whiteSpace: 'pre-wrap', fontFamily: "'Space Grotesk'", background: 'var(--panel2)' }}>{lead.ai_email}</div>}
              </div>
            )}
          </div>

          <aside style={ld.side}>
            <div style={ld.sideCard}>
              <div style={ld.eyebrow}>HAZIRLIK</div>
              <div style={{ ...ld.cardTitle, marginBottom: 14 }}>Temas checklist</div>
              <div style={ld.readinessGrid}>
                {readiness.map(item => (
                  <div key={item.label} style={item.ready ? ld.readyItemOk : ld.readyItemWarn}>
                    <span>{item.ready ? 'Hazır' : 'Eksik'}</span>
                    <strong>{item.label}</strong>
                  </div>
                ))}
              </div>
            </div>

            <div style={ld.sideCard}>
              <div style={ld.eyebrow}>DURUM</div>
              <div style={{ ...ld.cardTitle, marginBottom: 14 }}>Pipeline konumu</div>
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                {[{ key: 'yeni', label: 'Yeni' }, { key: 'contacted', label: 'Temasta' }, { key: 'converted', label: 'Kazanıldı' }].map(s => (
                  <button key={s.key} style={{ ...ld.findBtn, background: status === s.key ? 'var(--accent)' : 'var(--panel2)', color: status === s.key ? 'var(--accent-ink)' : 'var(--tx)', fontWeight: status === s.key ? 600 : 400, border: status === s.key ? 'none' : '1px solid var(--line)' }} onClick={() => onStatusChange(s.key)}>{s.label}</button>
                ))}
              </div>
            </div>

            <div style={ld.sideCard}>
              <div style={ld.eyebrow}>AKTİVİTE</div>
              <div style={{ ...ld.cardTitle, marginBottom: 14 }}>Zaman çizelgesi</div>
              {lastEvent && (
                <div style={ld.lastEventBanner}>
                  <div style={ld.lastEventLabel}>Son hareket</div>
                  <div style={ld.lastEventText}>{(ACTIONS[lastEvent.action] || ACTIONS.note).label}</div>
                </div>
              )}
              {events.map((event, eventIdx) => {
                const meta = ACTIONS[event.action] || ACTIONS.note;
                return (
                  <div key={`${event.ts}-${eventIdx}`} style={ld.actRow}>
                    <div style={ld.actDot}/>
                    <div style={{ flex: 1 }}>
                      <div style={ld.actKind}>{meta.label}</div>
                      <div style={ld.actMeta}>
                        {fmtDate(event.date)}
                        {event.note ? ` · ${event.note}` : ''}
                      </div>
                    </div>
                  </div>
                );
              })}
              {lead.last_analyzed && (
                <div style={ld.actRow}><div style={ld.actDot}/><div style={{ flex: 1 }}><div style={ld.actKind}>Tarama tamamlandı</div><div style={ld.actMeta}>{fmtDate(lead.last_analyzed)} · Skor {lead.scoring.score}</div></div></div>
              )}
              <div style={ld.actRow}><div style={ld.actDot}/><div style={{ flex: 1 }}><div style={ld.actKind}>Lead listesine eklendi</div><div style={ld.actMeta}>{lead.city || '—'}</div></div></div>
            </div>

            <div style={ld.sideCard}>
              <div style={ld.eyebrow}>NOT</div>
              <div style={{ ...ld.cardTitle, marginBottom: 12 }}>Hızlı not</div>
              <textarea style={ld.textarea} value={note} onChange={e => setNote(e.target.value)} placeholder="Lead hakkında not ekle..."/>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 12, marginTop: 10 }}>
                <div style={ld.noteHint}>{feedback || 'Kısa notu zaman çizelgesine ekler.'}</div>
                <button style={{ ...ld.btnDarkSm, opacity: busy || !note.trim() ? 0.7 : 1 }} onClick={saveNote} disabled={busy || !note.trim()}>{busy ? 'Kaydediliyor…' : 'Kaydet'}</button>
              </div>
            </div>
          </aside>
        </section>
      </div>
    );
  }

  const ld = {
    root:        { padding: '24px 48px 48px', flex: 1, fontFamily: "'Instrument Sans', system-ui, sans-serif", color: 'var(--tx)', background: 'var(--bg)', minWidth: 0 },
    top:         { display: 'flex', justifyContent: 'space-between', alignItems: 'center', paddingBottom: 18, borderBottom: '1px solid var(--line)', marginBottom: 32 },
    crumbs:      { display: 'flex', gap: 10, fontSize: 13, color: 'var(--muted)', alignItems: 'center', flexWrap: 'wrap' },
    crumb:       { fontFamily: "'Space Grotesk'" },
    crumbSep:    { color: 'var(--muted)' },
    btnGhost:    { padding: '8px 14px', background: 'var(--panel)', border: '1px solid var(--line)', borderRadius: 8, fontSize: 12.5, color: 'var(--sub)', cursor: 'pointer' },
    btnDark:     { padding: '8px 14px', background: 'var(--accent)', color: 'var(--accent-ink)', border: 'none', borderRadius: 8, fontSize: 12.5, fontWeight: 600, cursor: 'pointer' },
    btnDarkSm:   { padding: '6px 12px', background: 'var(--accent)', color: 'var(--accent-ink)', border: 'none', borderRadius: 7, fontSize: 11.5, fontWeight: 600, cursor: 'pointer' },
    hero:        { display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 32, marginBottom: 24 },
    heroLeft:    { flex: 1 },
    statusRow:   { display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' },
    statusBadge: { fontSize: 11, fontFamily: "'Space Grotesk'", background: 'rgba(255,107,107,0.14)', color: '#ff8f8f', padding: '4px 10px', borderRadius: 99, fontWeight: 600, letterSpacing: 0.5 },
    metaTag:     { fontSize: 11.5, fontFamily: "'Space Grotesk'", background: 'var(--panel)', border: '1px solid var(--line)', padding: '4px 10px', borderRadius: 99, color: 'var(--sub)' },
    metaText:    { fontSize: 11.5, color: 'var(--muted)', fontFamily: "'Space Grotesk'", marginLeft: 6 },
    h1:          { fontFamily: "'Space Grotesk'", fontSize: 46, fontWeight: 600, letterSpacing: -1.6, lineHeight: 1.05, margin: '20px 0 0', color: 'var(--tx)' },
    urls:        { display: 'flex', gap: 8, marginTop: 18, flexWrap: 'wrap' },
    quickActions:{ display: 'flex', gap: 8, marginTop: 16, flexWrap: 'wrap' },
    quickBtn:    { padding: '8px 14px', background: 'var(--panel)', border: '1px solid var(--line)', borderRadius: 10, fontSize: 12, color: 'var(--tx)', cursor: 'pointer', fontWeight: 500 },
    urlChip:     { padding: '8px 14px', background: 'var(--panel)', border: '1px solid var(--line)', borderRadius: 99, fontSize: 12.5, color: 'var(--sub)', cursor: 'pointer', fontFamily: "'Space Grotesk'" },

  // ── Pipeline View ──────────────────────────────────────────────────────────

  function PipelineView({ leads, onSelect, onDataChange }) {
    const [tick, setTick] = React.useState(0);
    const [busyLead, setBusyLead] = React.useState('');
    const dragRef = React.useRef('');

    function refresh() { setTick(t => t + 1); }

    const byStage = {};
    PIPE_STAGES.forEach(s => { byStage[s.key] = []; });
    leads.forEach(l => { const stage = getPipelineStage(l); (byStage[stage] = byStage[stage] || []).push(l); });

    const won = byStage['won'].length;
    const active = ['draft','contacted','meeting'].reduce((a, k) => a + (byStage[k]||[]).length, 0);

    function runCardAction(lead, event) {
      event.stopPropagation();
      setBusyLead(lead.name);
      startLeadAction(lead)
        .finally(() => {
          setBusyLead('');
          if (onDataChange) onDataChange();
          refresh();
        });
    }

    function handleDrop(e, stageKey) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');
      const name = dragRef.current;
      if (!name) return;
      const stageObj = PIPE_STAGES.find(s => s.key === stageKey);
      if (!stageObj) return;
      if (stageObj.actions.length) {
        addOutreach(name, stageObj.actions[0], new Date().toISOString().slice(0,16), '');
      } else if (stageKey === 'new') {
        setStatusLS(name, 'yeni');
      } else if (stageKey === 'won') {
        addOutreach(name, 'deal_won', new Date().toISOString().slice(0,16), '');
      } else if (stageKey === 'lost') {
        addOutreach(name, 'deal_lost', new Date().toISOString().slice(0,16), '');
      }
      dragRef.current = '';
      if (onDataChange) onDataChange();
      refresh();
    }

    return (
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0, background: 'var(--bg)' }}>
        <div style={pv.header}>
          <div>
            <div style={pv.pageEyebrow}>PIPELINE</div>
            <h1 style={pv.pageTitle}>Satış kanalı</h1>
            <p style={pv.pageSub}>{leads.length} lead · {won} kazanıldı · {active} aktif temasta</p>
          </div>
        </div>
        <div style={pv.board}>
          {PIPE_STAGES.map(stage => {
            const cards = byStage[stage.key] || [];
            return (
              <div
                key={stage.key}
                style={pv.col}
                className="pipe-col"
                onDragOver={e => { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }}
                onDragLeave={e => e.currentTarget.classList.remove('drag-over')}
                onDrop={e => handleDrop(e, stage.key)}
              >
                <div style={pv.colHead}>
                  <span style={{ ...pv.colDot, background: stage.color }}/>
                  <span style={pv.colTitle}>{stage.label}</span>
                  <span style={pv.colCnt}>{cards.length}</span>
                </div>
                <div style={pv.cards}>
                  {cards.map(l => {
                    const globalIdx = leads.indexOf(l);
                    const val = l.estimated_value_tl || 0;
                    return (
                      <div
                        key={l.name}
                        style={pv.card}
                        className="pipe-card"
                        draggable
                        onDragStart={e => { dragRef.current = l.name; e.currentTarget.classList.add('dragging'); }}
                        onDragEnd={e => e.currentTarget.classList.remove('dragging')}
                        onClick={() => onSelect(globalIdx)}
                      >
                        <div style={pv.cardName}>{l.name}</div>
                        <div style={pv.cardActionLabel}>{getPrimaryActionMeta(l).label}</div>
                        <div style={pv.cardMeta}>
                          <span style={{ ...pv.cardScore, background: stage.color + '22', color: stage.color }}>{l.scoring.grade} {l.scoring.score}</span>
                          {val > 0 && <span style={pv.cardVal}>~{fmt(val)} ₺</span>}
                        </div>
                        <div style={pv.cardActions}>
                          <button
                            style={{ ...pv.cardBtn, ...(busyLead === l.name ? pv.cardBtnMuted : null) }}
                            onClick={e => runCardAction(l, e)}
                            disabled={busyLead === l.name}
                          >
                            {busyLead === l.name ? 'Kaydediliyor…' : getPrimaryActionMeta(l).label}
                          </button>
                          <button style={pv.cardBtnGhost} onClick={e => { e.stopPropagation(); triggerQuickLeadAction(l); }}>
                            Hızlı aç
                          </button>
                        </div>
                      </div>
                    );
                  })}
                  {cards.length === 0 && <div style={pv.empty}>Buraya sürükle</div>}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  function HizmetlerView({ leads }) {
    const svcMap = {};

        const mid = ((svc.price_min || 0) + (svc.price_max || 0)) / 2;
        svcMap[svc.slug].totalVal += svc.monthly ? mid : mid / 12;
      });
    });

    const entries = services.map(svc => {

      return { svc, leads: active.leads, totalVal: active.totalVal };

      fetchAdminJSON('/api/auth')
        .then(data => {
          setAuth({ loading: false, authenticated: Boolean(data.authenticated), configured: data.configured !== false });
          if (data.authenticated) refreshAdmin();
        })
        .catch(() => setAuth({ loading: false, authenticated: false, configured: true }));
    }, []);

    function login(e) {
      e.preventDefault();
      setBusy(true);
      setFeedback('');
      fetchAdminJSON('/api/auth', {
        method: 'POST',
        body: JSON.stringify({ password }),
      })
        .then(() => {
          setPassword('');
          setAuth({ loading: false, authenticated: true, configured: true });
          return refreshAdmin();
        })
        .catch(err => setFeedback(err.message))
        .finally(() => setBusy(false));
    }

    function logout() {
      fetchAdminJSON('/api/auth', { method: 'DELETE' }).finally(() => {
        setAuth({ loading: false, authenticated: false, configured: true });
        setJobs([]);
        setTokens(null);
      });
    }

    function createJob(e) {
      e.preventDefault();
      setBusy(true);
      setFeedback('');
      fetchAdminJSON('/api/admin_search', {
        method: 'POST',
        body: JSON.stringify({
          query,
          city,
          max_results: Number(maxResults),
          deep_research: deepResearch,
          ai_mode: aiMode,
        }),
      })
        .then(data => {
          setFeedback(`Search job #${data.job.id} kuyruğa alındı. Tahmini ${data.estimate.estimated_tokens.toLocaleString('tr-TR')} token.`);
          return refreshAdmin();
        })
        .catch(err => setFeedback(err.message))
        .finally(() => setBusy(false));
    }

    if (auth.loading) {
      return <div style={av.root}><div style={av.empty}>Admin oturumu kontrol ediliyor.</div></div>;
    }

    if (!auth.configured) {
      return (
        <div style={av.root}>
          <div style={av.panel}>
            <div style={pv.pageEyebrow}>ADMIN SETUP</div>
            <h1 style={pv.pageTitle}>Giriş ayarı eksik</h1>
            <p style={av.text}>Vercel Environment Variables içine ADMIN_PASSWORD ve SESSION_SECRET eklenmeli.</p>
          </div>
        </div>
      );
    }

    if (!auth.authenticated) {
      return (
        <div style={av.root}>
          <form style={av.loginCard} onSubmit={login}>
            <div style={pv.pageEyebrow}>ADMIN LOGIN</div>
            <h1 style={pv.pageTitle}>Zeplin Admin</h1>
            <p style={av.text}>Yeni search, token bütçesi ve pipeline işleri için giriş yap.</p>
            <input
              type="password"
              value={password}
              onChange={e => setPassword(e.target.value)}
              placeholder="Admin şifresi"
              style={av.input}
            />
            {feedback && <div style={av.feedback}>{feedback}</div>}
            <button style={av.primaryBtn} disabled={busy || !password.trim()}>{busy ? 'Giriş yapılıyor…' : 'Giriş yap'}</button>
          </form>
        </div>
      );
    }

    return (
      <div style={av.root}>
        <div style={{ ...pv.header, display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
          <div>
            <div style={pv.pageEyebrow}>ADMIN</div>
            <h1 style={pv.pageTitle}>Search operasyonu</h1>
            <p style={pv.pageSub}>Yeni lead taraması, DeepSeek bütçesi ve Supabase job kuyruğu.</p>
          </div>
          <button style={ld.btnGhost} onClick={logout}>Çıkış</button>
        </div>

        <div style={av.grid}>
          <form style={av.panel} onSubmit={createJob}>
            <div style={ld.eyebrow}>YENİ SEARCH</div>
            <div style={ld.cardTitle}>Admin tarama başlat</div>
            <label style={av.label}>Arama tipi</label>
            <input value={query} onChange={e => setQuery(e.target.value)} style={av.input} placeholder="restoran, mağaza, kuaför" />
            <label style={av.label}>Bölge</label>
            <input value={city} onChange={e => setCity(e.target.value)} style={av.input} placeholder="Istanbul Kadıköy" />
            <div style={av.row}>
              <div style={{ flex: 1 }}>
                <label style={av.label}>Sonuç</label>
                <input type="number" min="1" max="30" value={maxResults} onChange={e => setMaxResults(e.target.value)} style={av.input} />
              </div>
              <div style={{ flex: 1 }}>
                <label style={av.label}>AI modu</label>
                <select value={aiMode} onChange={e => setAiMode(e.target.value)} style={av.input}>
                  <option value="smart">Smart</option>
                  <option value="flash">Flash</option>
                  <option value="pro">Pro</option>
                </select>
              </div>
            </div>
            <label style={av.checkRow}>
              <input type="checkbox" checked={deepResearch} onChange={e => setDeepResearch(e.target.checked)} />
              <span>Deep research açık</span>
            </label>
            <div style={av.estimate}>
              <div><strong>{estimatedTokens.toLocaleString('tr-TR')}</strong><span> tahmini token</span></div>
              <div><strong>${estimatedCost}</strong><span> tahmini maliyet</span></div>
            </div>
            {feedback && <div style={av.feedback}>{feedback}</div>}
            <button style={av.primaryBtn} disabled={busy || !query.trim() || !city.trim()}>{busy ? 'Kuyruğa alınıyor…' : 'Search job oluştur'}</button>
          </form>

          <div style={av.sideStack}>
            <div style={av.panel}>
              <div style={ld.eyebrow}>TOKEN</div>
              <div style={ld.cardTitle}>DeepSeek kullanımı</div>
              <div style={av.metricRow}><span>Reserve</span><strong>{(tokens?.estimated_tokens || 0).toLocaleString('tr-TR')}</strong></div>
              <div style={av.metricRow}><span>Gerçek</span><strong>{(tokens?.actual_tokens || 0).toLocaleString('tr-TR')}</strong></div>
              <div style={av.metricRow}><span>Tahmini maliyet</span><strong>${Number(tokens?.estimated_cost_usd || 0).toFixed(4)}</strong></div>
            </div>

            <div style={av.panel}>
              <div style={ld.eyebrow}>SON İŞLER</div>
              <div style={ld.cardTitle}>Search kuyruğu</div>
              <div style={av.jobs}>
                {jobs.length === 0 && <div style={av.muted}>Henüz job yok.</div>}
                {jobs.map(job => (
                  <div key={job.id} style={av.jobRow}>
                    <div>
                      <div style={av.jobTitle}>#{job.id} {job.query} · {job.city}</div>
                      <div style={av.muted}>{job.max_results} lead · {job.ai_mode} · {Number(job.estimated_tokens || 0).toLocaleString('tr-TR')} token</div>
                    </div>
                    <span style={av.jobStatus}>{job.status}</span>
                  </div>
                ))}
              </div>
              <button style={ld.btnGhost} onClick={refreshAdmin}>Yenile</button>
            </div>
          </div>
        </div>
      </div>
    );
  }

  const av = {
    root:      { flex: 1, minWidth: 0, background: 'var(--bg)', fontFamily: "'Instrument Sans', system-ui, sans-serif", color: 'var(--tx)' },
