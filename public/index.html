<style>
  :root{

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:

  .hero-row{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.hero-title{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:0;max-width:680px;color:var(--text)}

  .m-head{display:flex;align-items:center;justify-content:space-between}.m-icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;box-shadow:0 8px 18px -8px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.1) inset}.m-icon.lila{background:linear-gradient(135deg,#a896ff,#7e66ff);color:#fff}.m-icon.pink{background:linear-gradient(135deg,#ff6aa3,#ff2d78);color:#fff}.m-icon.mint{background:linear-gradient(135deg,#7ce2b5,#4cc591);color:#0d2a1f}.m-icon svg{width:18px;height:18px}.m-label{font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--text-3);text-transform:uppercase}

  .chart{margin-top:18px;display:grid;grid-template-columns:repeat(7,1fr);align-items:end;height:170px;gap:12px;padding:0 4px}.col-day{display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;position:relative}.bar-stack{width:100%;max-width:42px;display:flex;flex-direction:column-reverse;gap:3px;align-items:center}.bar{width:18px;border-radius:6px}.bar.lila{background:linear-gradient(180deg,#a896ff 0%,#7e66ff 100%)}.bar.pink{background:linear-gradient(180deg,#ff6aa3 0%,#ff2d78 100%)}.bar.ghosted{background:transparent;border:1.5px dashed rgba(255,255,255,.12);border-radius:6px}.day{font-size:10.5px;color:var(--text-3);font-weight:500;letter-spacing:.04em}.bar-tip{position:absolute;top:-26px;left:50%;transform:translateX(-50%);background:#fff;color:#1c1828;font-size:10.5px;font-weight:600;padding:3px 7px;border-radius:6px;white-space:nowrap;box-shadow:0 6px 14px -6px rgba(0,0,0,.5)}.bar-tip.pink{background:#ff2d78;color:#fff}.bar-tip.lila{background:#9580ff;color:#fff}

var activeFilter = 'all';
var activeLeadName = leads[0] ? leads[0].name : '';
var SK = 'zeplin_statuses_v1';
var STATUS_LABEL = {yeni:'Yeni', contacted:'Contacted', converted:'Converted'};
var STATUS_CLASS = {yeni:'s-yeni', contacted:'s-contacted', converted:'s-converted'};

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function initial(name){var parts=String(name||'').trim().split(/\s+/);return ((parts[0]||'Z')[0]+(parts[1]||'')[0]).toUpperCase();}
function getStatuses(){try{return JSON.parse(localStorage.getItem(SK)||'{}');}catch(e){return {};}}
function getStatus(name){return getStatuses()[name]||'yeni';}
function setStatus(name,s){var a=getStatuses();a[name]=s;localStorage.setItem(SK,JSON.stringify(a));}
function cycleStatus(name){var cur=getStatus(name);var next=cur==='yeni'?'contacted':cur==='contacted'?'converted':'yeni';setStatus(name,next);return next;}
function gradeTone(g){return g==='A'?'g':g==='B'?'y':g==='C'?'y':'r';}
function gradeColor(g){return g==='A'?'#7ce2b5':g==='B'?'#a896ff':g==='C'?'#f7c560':'#ff6770';}
function gradeIcon(g){return g==='A'?'mint':g==='B'?'lila':g==='C'?'amber':'red';}
function teaser(text,len){var t=String(text||'Henüz oluşturulmadı.').replace(/[\r\n]+/g,' ').trim();return t.length>len?t.slice(0,len)+'...':t;}
function parseMail(text){if(!text)return{subject:'',body:''};var lines=String(text).split('\n');var subjectLine=lines.find(function(l){return /^Konu:/i.test(l);})||'';var subject=subjectLine.replace(/^Konu:\s*/i,'').trim();var blank=lines.findIndex(function(l){return l.trim()==='';});return{subject:subject,body:(blank>=0?lines.slice(blank+1).join('\n'):text).trim()};}
function money(n){return Number(n||0).toLocaleString('tr-TR');}
function scoreOf(l){return (l.scoring&&l.scoring.score)||0;}
function gradeOf(l){return (l.scoring&&l.scoring.grade)||'D';}
function issuesOf(l){return (l.scoring&&l.scoring.issues)||[];}
function oppsOf(l){return (l.scoring&&l.scoring.opportunities)||[];}
function filteredLeads(){return leads.filter(function(l){var st=getStatus(l.name);if(activeFilter==='yeni')return st==='yeni';if(activeFilter==='contacted')return st==='contacted';if(activeFilter==='converted')return st==='converted';if(activeFilter==='dusuk')return scoreOf(l)<40;return true;});}
function countFor(f){if(f==='all')return leads.length;if(f==='dusuk')return leads.filter(function(l){return scoreOf(l)<40;}).length;return leads.filter(function(l){return getStatus(l.name)===f;}).length;}

function toast(msg){
  var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);
  setTimeout(function(){t.classList.add('show');},10);
  setTimeout(function(){t.classList.remove('show');setTimeout(function(){t.remove();},220);},2200);
}

function renderTabs(){
  var defs=[['all','Tümü'],['yeni','Yeni'],['contacted','Contacted'],['converted','Converted'],['dusuk','Düşük skor']];
  document.getElementById('tabs').innerHTML=defs.map(function(d){
    return '<button class="tab '+(activeFilter===d[0]?'active':'')+'" onclick="setFilter(\''+d[0]+'\')">'+d[1]+' <span class="cnt">'+countFor(d[0])+'</span></button>';
  }).join('')+'<button class="tab" onclick="toast(\'Arşiv görünümü V1+ tasarımında pasif.\')">Arşiv</button>';
}

function setFilter(f){
  activeFilter=f;renderTabs();renderRail();
  var fl=filteredLeads();
  if(fl.length && !fl.find(function(l){return l.name===activeLeadName;})){selectLead(fl[0].name);}
}

function renderStats(){
  var total=leads.length;
  var avg=total?Math.round(leads.reduce(function(a,l){return a+scoreOf(l);},0)/total):0;
  var critical=leads.filter(function(l){return scoreOf(l)<40;}).length;
  var ready=leads.filter(function(l){return l.ai_report&&l.ai_email;}).length;
  var value=leads.reduce(function(a,l){return a+(l.estimated_value_tl||0);},0);
  document.getElementById('hero-sub').textContent=total+' işletme tarandı, '+critical+' kritik açık var. Bugün için '+ready+' denetim raporu hazır.';
  document.getElementById('rail-sub').textContent=(SERVICE_CATALOG.length||0)+' hizmet katalogda, '+leads.filter(function(l){return (l.matched_services||[]).length>0;}).length+' lead hizmete bağlandı.';
  document.getElementById('metrics').innerHTML=
    '<div class="metric"><div class="m-head"><div class="m-icon lila"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg></div><span class="m-label">Toplam Lead</span></div><div class="m-num"><span class="v">'+total+'</span><span class="u">/ 50 limit</span></div><div class="m-foot"><span class="m-trend">▲ +'+Math.min(3,total)+' bu hafta</span><div class="spark"><span style="height:30%"></span><span style="height:50%"></span><span style="height:42%"></span><span style="height:70%"></span><span style="height:60%" class="hi"></span><span style="height:90%" class="hi"></span><span style="height:80%"></span></div></div></div>'+
    '<div class="metric"><div class="m-head"><div class="m-icon pink"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 12A10 10 0 1 1 12 2"/><path d="M22 2 12 12"/><path d="M22 7V2h-5"/></svg></div><span class="m-label">Ort. Skor</span></div><div class="m-num"><span class="v">'+avg+'</span><span class="u">/100 puan</span></div><div class="m-foot"><span class="m-trend '+(avg<50?'down':'')+'">'+(avg<50?'▼':'▲')+' canlı veri</span><div class="spark"><span style="height:60%"></span><span style="height:70%"></span><span style="height:55%" class="pk"></span><span style="height:48%" class="pk"></span><span style="height:52%"></span><span style="height:42%"></span><span style="height:38%"></span></div></div></div>'+
    '<div class="metric cta"><span class="cta-tag">✦ AI Insights</span><div class="cta-title">'+critical+' işletmede <b>kazanılmış fırsat</b> sinyali - bugün ulaş.</div><button class="cta-btn" onclick="scrollToDetail()">Detayları gör <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 5l7 7-7 7"/></svg></button></div>';
}

function renderChart(){
  var days=['PZT','SAL','ÇAR','PER','CUM','CMT','PAZ'];
  var vals=leads.slice(0,5).map(scoreOf);
  var html='';
  for(var i=0;i<7;i++){
    var v=vals[i]||0;
    html+='<div class="col-day">'+(i===3?'<div class="bar-tip pink">'+criticalCount()+'</div>':i===4?'<div class="bar-tip lila">'+(vals[0]||0)+'</div>':'')+'<div class="bar-stack">';
    if(v){html+='<div class="bar lila" style="height:'+(34+v)+'px"></div><div class="bar pink" style="height:'+(12+issuesOf(leads[i]||{}).length*12)+'px"></div>';}else{html+='<div class="bar ghosted" style="height:80px"></div>';}
    html+='</div><span class="day">'+days[i]+'</span></div>';
  }
  document.getElementById('chart').innerHTML=html;
}
function criticalCount(){return leads.filter(function(l){return scoreOf(l)<40;}).length;}

function renderRail(){
  var fl=filteredLeads();
  document.getElementById('rail-list').innerHTML=fl.length?fl.map(function(l){
    var g=gradeOf(l), st=getStatus(l.name), score=scoreOf(l);
    return '<button class="lead-row '+(l.name===activeLeadName?'active':'')+'" onclick="selectLead(\''+esc(l.name).replace(/'/g,"\\'")+'\')"><span class="lead-ic '+gradeIcon(g)+'">'+esc(initial(l.name))+'</span><span class="lead-info"><span class="lead-name">'+esc(l.name)+'</span><span class="lead-sub"><span class="miniring" style="--c:'+gradeColor(g)+';--p:'+score+'"></span>Skor '+score+' · '+g+' · '+STATUS_LABEL[st].toUpperCase()+'</span></span><svg class="lead-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg></button>';
  }).join(''):'<div class="empty"><b>Lead yok</b>Bu filtrede kayıt bulunamadı.</div>';
}

function selectLead(name){activeLeadName=name;renderRail();renderDetail(name);}
function scrollToDetail(){document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'start'});}

function renderDetail(name){
  var L=leads.find(function(l){return l.name===name;})||leads[0];if(!L){document.getElementById('detail').innerHTML='<div class="empty"><b>Henüz lead yok</b>İlk tarama sonrası panel dolacak.</div>';return;}
  var s=L.scoring||{}, g=s.grade||'D', score=s.score||0, st=getStatus(L.name), mail=parseMail(L.ai_email);
  var links='';
  if(L.website&&L.website.has_website&&L.website.website_url){links+='<a class="chip" href="'+esc(L.website.website_url)+'" target="_blank"><span class="fav" style="--fav:#76a6ff"></span>'+esc(L.website.website_url.replace(/^https?:\/\//,'').replace(/\/$/,''))+'<span class="ext">↗</span></a>';}else{links+='<span class="chip empty"><span class="fav"></span>Web sitesi yok</span>';}
  if(L.social&&L.social.has_instagram&&L.social.instagram_url){links+='<a class="chip" href="'+esc(L.social.instagram_url)+'" target="_blank"><span class="fav" style="--fav:#ff6aa3"></span>@'+esc(L.social.instagram_username||'instagram')+'<span class="ext">↗</span></a>';}else{links+='<span class="chip empty"><span class="fav"></span>Instagram yok</span>';}
  if(L.maps_url){links+='<a class="chip" href="'+esc(L.maps_url)+'" target="_blank"><span class="fav" style="--fav:#7ce2b5"></span>Google Maps<span class="ext">↗</span></a>';}
  if(L.phone){links+='<a class="chip" href="tel:'+esc(String(L.phone).replace(/\s/g,''))+'"><span class="fav" style="--fav:#f7c560"></span>'+esc(L.phone)+'</a>';}
  var problems=issuesOf(L).map(function(p){return '<span class="tpill bad">'+esc(p)+'</span>';}).join('')||'<span class="tpill bad">Sorun bulunamadı</span>';
  var opps=oppsOf(L).map(function(p){return '<span class="tpill good">'+esc(p)+'</span>';}).join('')||'<span class="tpill good">Fırsat bekliyor</span>';
  var report=L.ai_report?'<div class="report">'+esc(L.ai_report)+'</div>':'<div class="empty"><b>Rapor henüz oluşturulmadı.</b>AI raporu üretildiğinde burada görünecek.</div>';
  var mailBlock=L.ai_email?'<div class="mail"><span class="from"><b>Konu:</b> '+esc(mail.subject)+'</span><button class="copy-btn" onclick="copyMail()">Kopyala</button>'+esc(mail.body)+'</div>':'<div class="empty"><b>Mail taslağı henüz oluşturulmadı.</b>AI Raporundaki bulgulara dayalı bir taslak üretebiliriz.</div>';
  document.getElementById('detail').innerHTML=
    '<div class="det-head"><div><h2 class="det-name">'+esc(L.name)+'</h2><div class="det-meta"><span class="pill '+STATUS_CLASS[st]+'" onclick="changeStatus()">'+STATUS_LABEL[st]+'</span><span class="dot"></span><span>Son analiz</span><span style="color:var(--text-2);font-weight:500">'+esc(L.last_analyzed||'—')+'</span>'+(L.city?'<span class="dot"></span><span>'+esc(L.city)+'</span>':'')+'</div></div><div class="det-score"><div class="ring" data-tone="'+gradeTone(g)+'" data-score="'+score+'"><svg viewBox="0 0 70 70"><circle class="track" cx="35" cy="35" r="30"></circle><circle class="prog" cx="35" cy="35" r="30" stroke-dasharray="188.5" stroke-dashoffset="'+(188.5*(1-score/100))+'"></circle></svg><div class="num">'+score+'<small>/100</small></div></div><div class="grade" data-g="'+g+'">'+g+'</div></div></div>'+
    '<div class="det-divider"></div><div class="links">'+links+'</div><div class="det-grid"><div><div class="col-label problems">Sorunlar <span class="lbl-line"></span><span class="n">'+String(issuesOf(L).length).padStart(2,'0')+'</span></div><div class="pillset">'+problems+'</div></div><div><div class="col-label opps">Fırsatlar <span class="lbl-line"></span><span class="n">'+String(oppsOf(L).length).padStart(2,'0')+'</span></div><div class="pillset">'+opps+'</div></div></div>'+
    '<div class="accs"><div class="acc"><div class="acc-head" onclick="toggleAcc(this)"><div class="acc-title"><div class="acc-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 9 9l-7 1 5 5-1 7 6-3 6 3-1-7 5-5-7-1z"/></svg></div><span class="acc-label">AI Raporu</span><span class="acc-sub">'+esc(teaser(L.ai_report,70))+'</span></div><svg class="chev" viewBox="0 0 20 20" fill="none"><path d="M5 8l5 5 5-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="acc-body"><div class="acc-inner">'+report+'</div></div></div><div class="acc"><div class="acc-head" onclick="toggleAcc(this)"><div class="acc-title"><div class="acc-icon mail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></div><span class="acc-label">Satış Maili</span><span class="acc-sub">'+esc(mail.subject||teaser(L.ai_email,55))+'</span></div><svg class="chev" viewBox="0 0 20 20" fill="none"><path d="M5 8l5 5 5-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="acc-body"><div class="acc-inner">'+mailBlock+'</div></div></div></div>';
}

function toggleAcc(el){el.closest('.acc').classList.toggle('open');}
function changeStatus(){var next=cycleStatus(activeLeadName);renderTabs();renderRail();renderDetail(activeLeadName);toast(activeLeadName+' → '+STATUS_LABEL[next]);}
function copyMail(){var L=leads.find(function(l){return l.name===activeLeadName;});if(!L||!L.ai_email)return;navigator.clipboard.writeText(L.ai_email).then(function(){toast('Mail panoya kopyalandı.');});}
function exportCSV(){
  var rows=[['Ad','Şehir','Skor','Grade','Durum','Web','Instagram','Son Analiz','Sorunlar','Fırsatlar']];
  leads.forEach(function(l){rows.push([l.name,l.city||'',scoreOf(l),gradeOf(l),STATUS_LABEL[getStatus(l.name)],(l.website&&l.website.website_url)||'',(l.social&&l.social.instagram_url)||'',l.last_analyzed||'',issuesOf(l).join('; '),oppsOf(l).join('; ')]);});
  var csv=rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var a=document.createElement('a');a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);a.download='zeplin_leads_'+new Date().toISOString().slice(0,10)+'.csv';a.click();toast('CSV indirildi.');
}

renderStats();renderTabs();renderChart();renderRail();if(activeLeadName)renderDetail(activeLeadName);
</script>
</body>
</html>
