  <script type="text/babel">
  // ── Helpers ────────────────────────────────────────────────────────────────

  function fmt(n) {
    if (!n) return '0';
    if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
    if (n >= 1000) return Math.round(n / 1000) + 'K';
    return String(n);
  }

  function fmtDate(str) {
    if (!str) return '';
    try {
      const d = new Date(str.replace(' ', 'T'));
      if (isNaN(d)) return str;
      return d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', year: 'numeric' });
    } catch(e) { return str; }
  }

  function readLocalStatuses() {
    try { return JSON.parse(localStorage.getItem(STATUS_KEY) || '{}'); } catch(e) { return {}; }
  }
  function writeLocalStatuses(obj) {
    localStorage.setItem(STATUS_KEY, JSON.stringify(obj || {}));
  }
  function getStatuses() {
    return Object.assign({}, readLocalStatuses(), remoteStatuses);
  }
  function persistStatus(name, s) {
    if (!apiReady) return Promise.resolve();
    return fetch('/api/status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, status: s }),
    }).then(res => {
      if (!res.ok) throw new Error('status_save_failed');
      return res.json();
    }).catch(err => {
      apiReady = false;
      console.warn('Status save fallback:', err);
    });
  }
  function setStatusLS(name, s) {
    const next = getStatuses();
    next[name] = s;
    remoteStatuses[name] = s;
    writeLocalStatuses(next);
    return persistStatus(name, s);
  }

  function readLocalOutreach() {
    try { return JSON.parse(localStorage.getItem(OUTREACH_KEY) || '[]'); } catch(e) { return []; }
  }
  function normalizeOutreachEvent(item) {
    if (!item) return null;
    return {
      lead: item.lead || item.lead_name || '',
      action: item.action || 'note',
      date: item.date || item.happened_at || item.created_at || new Date().toISOString(),
      note: item.note || '',
      ts: item.ts || item.id || Date.now(),
    };
  }
  function getOutreach() {
    return outreachEvents.length ? outreachEvents : readLocalOutreach().map(normalizeOutreachEvent).filter(Boolean);
  }
  function saveOutreach(arr) {
    outreachEvents = (arr || []).map(normalizeOutreachEvent).filter(Boolean);
    localStorage.setItem(OUTREACH_KEY, JSON.stringify(outreachEvents));
  }
  function getLeadEvents(name) {
    return getOutreach().filter(e => e.lead === name).sort((a, b) => b.date.localeCompare(a.date));
  }
  function persistOutreachEvent(evt) {
    if (!apiReady) return Promise.resolve();
    return fetch('/api/outreach', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        lead_name: evt.lead,
        action: evt.action,
        happened_at: evt.date,
        note: evt.note,
      }),
    }).then(res => {
      if (!res.ok) throw new Error('outreach_save_failed');
      return res.json();
    }).catch(err => {
      apiReady = false;
      console.warn('Outreach save fallback:', err);
    });
  }
  function addOutreach(name, action, date, note) {
    const arr = getOutreach();
    const evt = { lead: name, action, date, note, ts: Date.now() };
    arr.push(evt);
    saveOutreach(arr);
    const act = ACTIONS[action];
    if (act && act.status) setStatusLS(name, act.status);
    return persistOutreachEvent(evt);
  }

  function applyRemoteLeads(rows) {
    if (!Array.isArray(rows) || rows.length === 0) return;
    leads = rows.slice();
    remoteStatuses = {};
    leads.forEach(l => { remoteStatuses[l.name] = l.status || 'yeni'; });
    writeLocalStatuses(getStatuses());
  }

  function applyRemoteOutreach(rows) {
    if (!Array.isArray(rows)) return;
    outreachEvents = rows.map(normalizeOutreachEvent).filter(Boolean);
    localStorage.setItem(OUTREACH_KEY, JSON.stringify(outreachEvents));
  }

  function fetchJSON(url, options) {
    return fetch(url, options || {}).then(res => {
      if (!res.ok) throw new Error(`request_failed_${res.status}`);
      return res.json();

  }

  function openExternal(url) {

  function startLeadAction(lead) {
    const nextAction = lead.next_action || 'Sonraki aksiyon başlatıldı';
    const needsContactCompletion = /telefon|adres/i.test(nextAction) || (!lead.phone && !lead.address);

    if (needsContactCompletion) {
      openExternal(lead.maps_url || lead.website?.website_url || lead.social?.instagram_url);
      return addOutreach(
        lead.name,
        'data_enrichment_started',
        new Date().toISOString(),
        nextAction

        lead.name,
        'call_made',
        new Date().toISOString(),
        nextAction
      ).then(() => ({ feedback: 'Arama aksiyonu kaydedildi.' }));
    }

    if (lead.ai_email) {
      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(lead.ai_email).catch(() => {});

      return addOutreach(
        lead.name,

        new Date().toISOString(),

      lead.name,
      'outreach_review_started',
      new Date().toISOString(),
      nextAction

  }

  function getPipelineStage(lead) {
    const st = getStatuses()[lead.name] || 'yeni';
    if (st === 'converted') return 'won';
    const evs = getLeadEvents(lead.name);
    const last = evs.find(e => e.action !== 'note');
    if (!last) return st === 'contacted' ? 'contacted' : 'new';
    const map = { data_enrichment_started: 'enrich', draft_prepared: 'draft', outreach_review_started: 'draft', email_sent: 'contacted', reply_received: 'contacted', call_made: 'contacted',
                  meeting_scheduled: 'meeting', deal_won: 'won', deal_lost: 'lost' };
    return map[last.action] || (st === 'contacted' ? 'contacted' : 'new');
  }

  function hasContactInfo(lead) {
    return Boolean(lead.phone || lead.address);
  }

  function needsContactCompletion(lead) {
    const nextAction = lead.next_action || '';
    return /telefon|adres/i.test(nextAction) || !hasContactInfo(lead);

  function getPrimaryActionMeta(lead) {
    if (needsContactCompletion(lead)) {
      return {

      intent: 'review',

  }

  function getLeadReadiness(lead) {
    return [

      { label: 'AI raporu', ready: Boolean(lead.ai_report) },
      { label: 'Mail taslagi', ready: Boolean(lead.ai_email) },

  function triggerQuickLeadAction(lead) {
    const meta = getPrimaryActionMeta(lead);
    if (meta.intent === 'call' && lead.phone) {
      openExternal(`tel:${lead.phone.replace(/\s+/g, '')}`);
      return;
    }
    if (meta.intent === 'draft' && lead.ai_email && navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(lead.ai_email).catch(() => {});
      return;
    }
    if (meta.intent === 'enrich') {
      openExternal(lead.maps_url || lead.website?.website_url || lead.social?.instagram_url);
      return;
    }
    openExternal(lead.website?.website_url || lead.maps_url || lead.social?.instagram_url);
  }

  function getDailyTasks(arr, statuses) {
    return arr
      .filter(lead => (statuses[lead.name] || 'yeni') !== 'converted')
      .slice()
      .sort((a, b) => {
        const delta = (b.sales_priority_score || 0) - (a.sales_priority_score || 0);
        if (delta !== 0) return delta;
        return (b.estimated_value_tl || 0) - (a.estimated_value_tl || 0);
      })
      .slice(0, 5)
      .map(lead => {
        const meta = getPrimaryActionMeta(lead);
        let reason = 'Sonraki adim belirginlestirilmeli.';
        if (needsContactCompletion(lead)) {
          reason = 'Temas öncesi telefon veya adres eksigi kapatilmali.';
        } else if (lead.phone) {
          reason = 'Telefon bilgisi hazir; bugun sicak temas kurulabilir.';
        } else if (lead.ai_email) {
          reason = 'Taslak hazir; gonderim oncesi son kontrol yeterli.';
        }
        return { lead, meta, reason };
      });
  }

  function issueToSeverity(text) {
    if (!text) return 'Bilgi';
    const t = text.toLowerCase();
    if (t.includes('ssl') || t.includes('https')) return 'Kritik';
    if (t.includes('web sitesi yok') || t.includes('website yok') || t.includes('site yok')) return 'Yüksek';
    if (t.includes('schema') || t.includes('og') || t.includes('open graph')) return 'Orta';
    if (t.includes('telefon') || t.includes('adres') || t.includes('tamamla') || t.includes('instagram yok')) return 'Düşük';
    return 'Bilgi';
  }

  function scoreDash(score) { return 326.7 * (1 - score / 100); }

  function computeKPIs(arr) {
    const total = arr.length || 1;
    return {
      packagedCount: arr.filter(l => l.matched_services && l.matched_services.length > 0).length,
      packagedPct:   Math.round(arr.filter(l => l.matched_services && l.matched_services.length > 0).length / total * 100),
      phoneCount:    arr.filter(l => l.phone).length,
      phonePct:      Math.round(arr.filter(l => l.phone).length / total * 100),
      aiCount:       arr.filter(l => l.ai_report).length,
      aiPct:         Math.round(arr.filter(l => l.ai_report).length / total * 100),
      auditCount:    arr.filter(l => l.scoring && l.scoring.issues && l.scoring.issues.length > 0).length,
      auditPct:      Math.round(arr.filter(l => l.scoring && l.scoring.issues && l.scoring.issues.length > 0).length / total * 100),
    };
  }

  function computeTabCounts(arr, statuses) {
    return {
      total:     arr.length,
      yeni:      arr.filter(l => (statuses[l.name] || 'yeni') === 'yeni').length,
      contacted: arr.filter(l => statuses[l.name] === 'contacted').length,
      converted: arr.filter(l => statuses[l.name] === 'converted').length,
      low:       arr.filter(l => l.scoring && l.scoring.score < 50).length,
    };
  }

  function computeReadinessBuckets(arr) {
    return {
      readyToCall: arr.filter(lead => Boolean(lead.phone)).length,
      needsData: arr.filter(lead => needsContactCompletion(lead)).length,
      proposalReady: arr.filter(lead => Boolean(lead.ai_report) && Boolean(lead.ai_email) && Boolean(lead.matched_services?.length)).length,
    };
  }

            <svg width="100%" height="52" viewBox="0 0 200 52">
              {/* Arc: center (100,129) r=121 → endpoints (10,48) and (190,48), peak (100,8) */}
              <path d="M10 48 A121 121 0 0 1 190 48" fill="none" stroke="#FFD3B0" strokeWidth="7" strokeLinecap="round"/>
              {(() => {
                const pct = Math.min(Math.max(kpi.phonePct, 0), 100) / 100;
                if (pct <= 0) return null;
                const cx = 100, cy = 129, r = 121;
                const a0 = 222 * Math.PI / 180;
                const a1 = 318 * Math.PI / 180;
                const a  = a0 + pct * (a1 - a0);
                const ex = (cx + r * Math.cos(a)).toFixed(1);
                const ey = (cy + r * Math.sin(a)).toFixed(1);
                return <path d={`M10 48 A121 121 0 0 1 ${ex} ${ey}`} fill="none" stroke="#FF6B3D" strokeWidth="7" strokeLinecap="round"/>;

    segActive:     { padding: '4px 10px', background: '#fff', borderRadius: 6, color: '#0A0A0A', fontWeight: 600 },
    chartCard:     { background: '#fff', border: '1px solid #ECECEC', borderRadius: 16, padding: '20px 18px 14px' },
    chartBars:     { display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 10, height: 140, alignItems: 'end' },
    barCol:        { display: 'flex', flexDirection: 'column', alignItems: 'center', height: '100%', justifyContent: 'flex-end', gap: 6 },
    barLabel:      { position: 'absolute', top: -18, left: '50%', transform: 'translateX(-50%)', fontSize: 10, fontFamily: '"JetBrains Mono"', color: '#0A0A0A' },
    barX:          { fontSize: 10.5, color: '#9A9A9A', fontFamily: '"JetBrains Mono"' },
    miniList:      { display: 'flex', flexDirection: 'column', gap: 1, background: '#ECECEC', border: '1px solid #ECECEC', borderRadius: 16, overflow: 'hidden' },
    miniRow:       { display: 'flex', alignItems: 'center', gap: 12, padding: '14px 16px', background: '#fff' },
    miniIni:       { width: 32, height: 32, borderRadius: 8, background: '#F4F4F2', display: 'grid', placeItems: 'center', fontSize: 12, fontWeight: 600, flexShrink: 0 },
    miniName:      { fontSize: 13.5, fontWeight: 500 },
    miniMeta:      { fontSize: 11.5, color: '#9A9A9A', fontFamily: '"JetBrains Mono"', marginTop: 2 },
    linkSm:        { fontSize: 12, color: '#6B6B6B', cursor: 'pointer', fontFamily: '"JetBrains Mono"' },
  };

  // ── Lead Detail ────────────────────────────────────────────────────────────

  function sevStyle(s) {
    return ({ Kritik: { background: '#FFE0E0', color: '#A12020' }, Yüksek: { background: '#FFE9D9', color: '#A14C20' }, Orta: { background: '#FFF6CC', color: '#7A5A00' }, Düşük: { background: '#E8EEFF', color: '#1F3A8A' }, Bilgi: { background: '#F4F4F2', color: '#3A3A3A' } })[s] || { background: '#F4F4F2', color: '#3A3A3A' };
  }

  function LeadDetail({ lead, idx, total, status, onStatusChange, onBack, onPrev, onNext, onDataChange }) {
    const [showReport, setShowReport] = React.useState(false);
    const [showEmail,  setShowEmail]  = React.useState(false);
    const [copied,     setCopied]     = React.useState(false);
    const [note,       setNote]       = React.useState('');
    const [feedback,   setFeedback]   = React.useState('');
    const [busy,       setBusy]       = React.useState(false);
    const issues     = lead.scoring.issues || [];
    const hasPackage = lead.matched_services?.length > 0 && lead.recommended_package?.name !== 'Veri tamamlama';
    const svc = lead.recommended_package || {};
    const ms  = (lead.matched_services || [])[0] || {};
    const events     = getLeadEvents(lead.name);
    const actionMeta = getPrimaryActionMeta(lead);
    const readiness  = getLeadReadiness(lead);
    const lastEvent  = events[0] || null;

    React.useEffect(() => {
      if (!feedback) return;
      const timer = setTimeout(() => setFeedback(''), 2400);
      return () => clearTimeout(timer);
    }, [feedback]);

    function copyEmail() {
      navigator.clipboard.writeText(lead.ai_email || '').then(() => { setCopied(true); setTimeout(() => setCopied(false), 2000); });
    }

    function saveNote() {
      const value = note.trim();
      if (!value) return;
      setBusy(true);
      addOutreach(lead.name, 'note', new Date().toISOString(), value).then(() => {
        setFeedback('Not kaydedildi.');
      }).catch(() => {
        setFeedback('Not yerelde kaydedildi.');
      }).finally(() => {
        setBusy(false);
        setNote('');
        if (onDataChange) onDataChange();
      });
    }

    function skipLead() {
      onNext();
    }

    function handlePrimaryAction() {
      setBusy(true);
      startLeadAction(lead).then(result => {
        setFeedback((result && result.feedback) || 'Aksiyon kaydedildi.');
      }).catch(() => {
        setFeedback('Aksiyon yerelde işlendi.');
      }).finally(() => {
        setBusy(false);
        if (onDataChange) onDataChange();
      });
    }

    return (
      <div style={ld.root}>
        <header style={ld.top}>
          <div style={ld.crumbs}>
            <span style={{ ...ld.crumb, cursor: 'pointer', color: '#6B6B6B' }} onClick={onBack}>Cockpit</span>
            <span style={ld.crumbSep}>/</span><span style={ld.crumb}>Leadler</span>
            <span style={ld.crumbSep}>/</span>
            <span style={{ ...ld.crumb, color: '#0A0A0A', fontWeight: 600 }}>{lead.name}</span>
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            <button style={{ ...ld.btnGhost, opacity: idx === 0 ? 0.4 : 1 }} onClick={onPrev} disabled={idx === 0}>← Önceki</button>
            <button style={{ ...ld.btnGhost, opacity: idx === total-1 ? 0.4 : 1 }} onClick={onNext} disabled={idx === total-1}>Sonraki →</button>
            <button style={ld.btnDark} onClick={onBack}>← Cockpit</button>
          </div>
        </header>

        <section style={ld.hero}>
          <div style={ld.heroLeft}>
            <div style={ld.statusRow}>
              <span style={ld.statusBadge}>● {(status || 'yeni').toUpperCase()}</span>
              {(lead.category || lead.sector) && <span style={ld.metaTag}>{lead.category || lead.sector}</span>}
              {lead.city && <span style={ld.metaTag}>{lead.city}</span>}
              {lead.last_analyzed && <span style={ld.metaText}>Son analiz · {fmtDate(lead.last_analyzed)}</span>}
            </div>
            <h1 style={ld.h1}>{lead.name}</h1>
            <div style={ld.urls}>
              {lead.website?.website_url && <a href={lead.website.website_url} target="_blank" rel="noopener noreferrer" style={ld.urlChip}>{lead.website.website_url.replace(/^https?:\/\//, '').replace(/\/$/, '')} ↗</a>}
              {lead.social?.instagram_url && <a href={lead.social.instagram_url} target="_blank" rel="noopener noreferrer" style={ld.urlChip}>@{lead.social.instagram_username || 'instagram'} ↗</a>}
              {lead.maps_url && <a href={lead.maps_url} target="_blank" rel="noopener noreferrer" style={ld.urlChip}>Google Maps ↗</a>}
              {lead.phone && <span style={ld.urlChip}>{lead.phone}</span>}
            </div>
            <div style={ld.quickActions}>
              {lead.phone && <a href={`tel:${lead.phone.replace(/\s+/g, '')}`} style={ld.quickBtn}>Telefonu aç</a>}
              {lead.website?.website_url && <button style={ld.quickBtn} onClick={() => openExternal(lead.website.website_url)}>Siteyi aç</button>}
              {lead.social?.instagram_url && <button style={ld.quickBtn} onClick={() => openExternal(lead.social.instagram_url)}>Instagram aç</button>}
              {lead.maps_url && <button style={ld.quickBtn} onClick={() => openExternal(lead.maps_url)}>Maps aç</button>}
              {lead.ai_email && <button style={ld.quickBtn} onClick={copyEmail}>{copied ? 'Taslak kopyalandi' : 'Taslagi kopyala'}</button>}
            </div>
          </div>
          <div style={ld.heroRight}>
            <div>
              <svg width="120" height="120" viewBox="0 0 120 120">
                <circle cx="60" cy="60" r="52" fill="none" stroke="#F4F4F2" strokeWidth="6"/>
                <circle cx="60" cy="60" r="52" fill="none" stroke="#0A0A0A" strokeWidth="6" strokeDasharray="326.7" strokeDashoffset={scoreDash(lead.scoring.score)} transform="rotate(-90 60 60)" strokeLinecap="round"/>
                <text x="60" y="60" textAnchor="middle" fontSize="32" fontWeight="600" fill="#0A0A0A" fontFamily="Inter Tight">{lead.scoring.score}</text>
                <text x="60" y="80" textAnchor="middle" fontSize="11" fill="#9A9A9A" fontFamily="JetBrains Mono">/100</text>
              </svg>
            </div>
            <div style={ld.gradePill}>{lead.scoring.grade}</div>
          </div>
        </section>

        {lead.next_action && (
          <div style={ld.nextAction}>
            <div>
              <div style={ld.naEyebrow}>SONRAKİ EN İYİ AKSİYON · ÖNCELİK {lead.sales_priority_score || '—'}</div>
              <div style={ld.naTitle}>{lead.next_action}</div>
              {lead.priority_reason && <div style={ld.naDesc}>{lead.priority_reason}</div>}
              <div style={ld.naHelper}>{actionMeta.helper}</div>
              {feedback && <div style={ld.inlineFeedback}>{feedback}</div>}
            </div>
            <div style={{ display: 'flex', gap: 8 }}>
              <button style={{ ...ld.btnGhost, opacity: busy ? 0.7 : 1 }} onClick={skipLead} disabled={busy}>Atla</button>
              <button style={{ ...ld.btnDark, opacity: busy ? 0.7 : 1 }} onClick={handlePrimaryAction} disabled={busy}>{busy ? 'Kaydediliyor…' : `${actionMeta.label} →`}</button>
            </div>
          </div>
        )}

        <section style={ld.cols}>
          <div>
            <div style={ld.statsCard}>
              <div style={ld.statsHeader}><div style={ld.eyebrow}>SOSYAL SİNYALLER</div><div style={ld.cardTitle}>Etkileşim ve büyüme</div></div>
              <div style={ld.statsGrid}>
                {[
                  ['Instagram', lead.social?.has_instagram ? '✓' : '✗'],
                  ['Takipçi',   lead.social?.stats?.followers  ? String(lead.social.stats.followers)  : '—'],
                  ['Gönderi',   lead.social?.stats?.post_count  ? String(lead.social.stats.post_count)  : '—'],
                  ['Ort. beğeni',lead.social?.stats?.avg_likes   ? String(lead.social.stats.avg_likes)   : '—'],
                  ['Etkileşim', lead.social?.stats?.engagement_rate ? `%${lead.social.stats.engagement_rate}` : '—'],
                ].map(([l, v], i) => (
                  <div key={i} style={{ ...ld.stat, ...(i === 4 ? { borderRight: 'none' } : {}) }}>
                    <div style={ld.statLabel}>{l}</div>
                    <div style={ld.statVal}>{v}</div>
                  </div>
                ))}
              </div>
            </div>

            {hasPackage ? (
              <div style={ld.packCard}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 16 }}>
                  <div style={{ flex: 1 }}>
                    <div style={ld.eyebrow}>ÖNERİLEN PAKET · {(svc.category || 'DİJİTAL').toUpperCase()}</div>
                    <h3 style={ld.packTitle}>{svc.name}</h3>
                    <div style={ld.packDesc}>{svc.summary || svc.description || 'Dijital varlığınızı güçlendirir.'}</div>
                  </div>
                  {(ms.price_min || ms.price_max) ? (
                    <div style={ld.packRight}>
                      <div style={ld.packPrice}>~{fmt(ms.price_min)} ₺ <span style={{ fontSize: 11, color: '#9A9A9A' }}>/ay</span></div>
                      <div style={ld.packRange}>{(ms.price_min||0).toLocaleString('tr-TR')} – {(ms.price_max||0).toLocaleString('tr-TR')} ₺ <span style={{ color: '#9A9A9A' }}>tek seferlik</span></div>
                    </div>
                  ) : null}
                </div>
                <div style={ld.packTags}>
                  {[svc.category, svc.name].filter(Boolean).map((t, i) => <span key={i} style={i === 0 ? ld.tagPrimary : ld.tag}>{t}</span>)}
                </div>
              </div>
            ) : (
              <div style={{ ...ld.packCard, background: '#F9F9F7' }}>
                <div style={ld.eyebrow}>ÖNERİLEN PAKET</div>
                <div style={{ fontSize: 14, color: '#9A9A9A', marginTop: 8 }}>Paket önerisi için lead verisi tamamlanmalı.</div>
              </div>
            )}

            <div style={ld.findCard}>
              <div style={ld.findHeader}><div style={ld.eyebrow}>TARAMA BULGULARI</div><div style={ld.cardTitle}>{issues.length > 0 ? `${issues.length} sinyal` : 'Temiz'}</div></div>
              {issues.length === 0
                ? <div style={{ padding: '16px 24px', color: '#9A9A9A', fontSize: 13 }}>Sorun tespit edilmedi.</div>
                : issues.map((issue, i) => {
                    const sev = issueToSeverity(issue);
                    return (
                      <div key={i} style={ld.findRow}>
                        <div style={{ ...ld.sevPill, ...sevStyle(sev) }}>{sev}</div>
                        <div style={{ flex: 1 }}><div style={ld.findTitle}>{issue}</div></div>
                        <button style={ld.findBtn} onClick={() => openFixContext(lead, issue)}>Düzelt →</button>
                      </div>
                    );
                  })
              }
            </div>

            {lead.ai_report && (
              <div style={{ ...ld.findCard, marginTop: 16 }}>
                <div style={{ ...ld.findHeader, cursor: 'pointer', userSelect: 'none' }} onClick={() => setShowReport(r => !r)}>
                  <div><div style={ld.eyebrow}>AI RAPORU</div><div style={ld.cardTitle}>Zeplin AI Analizi {showReport ? '▲' : '▼'}</div></div>
                </div>
                {showReport && <div style={{ padding: '16px 24px', fontSize: 13.5, color: '#3A3A3A', lineHeight: 1.7, whiteSpace: 'pre-wrap' }}>{lead.ai_report}</div>}
              </div>
            )}

            {lead.ai_email && (
              <div style={{ ...ld.findCard, marginTop: 16 }}>
                <div style={{ ...ld.findHeader, cursor: 'pointer', userSelect: 'none' }} onClick={() => setShowEmail(e => !e)}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', width: '100%' }}>
                    <div><div style={ld.eyebrow}>SATIŞ E-POSTASI</div><div style={ld.cardTitle}>Hazır taslak {showEmail ? '▲' : '▼'}</div></div>
                    {showEmail && <button style={ld.findBtn} onClick={e => { e.stopPropagation(); copyEmail(); }}>{copied ? '✓ Kopyalandı' : 'Kopyala'}</button>}
                  </div>
                </div>
                {showEmail && <div style={{ padding: '16px 24px', fontSize: 13, color: '#3A3A3A', lineHeight: 1.7, whiteSpace: 'pre-wrap', fontFamily: '"JetBrains Mono"', background: '#FAFAF9' }}>{lead.ai_email}</div>}
              </div>
            )}
          </div>

          <aside style={ld.side}>
            <div style={ld.sideCard}>
              <div style={ld.eyebrow}>HAZIRLIK</div>
              <div style={{ ...ld.cardTitle, marginBottom: 14 }}>Temas checklist</div>
              <div style={ld.readinessGrid}>
                {readiness.map(item => (
                  <div key={item.label} style={item.ready ? ld.readyItemOk : ld.readyItemWarn}>
                    <span>{item.ready ? 'Hazır' : 'Eksik'}</span>
                    <strong>{item.label}</strong>
                  </div>
                ))}
              </div>
            </div>

            <div style={ld.sideCard}>
              <div style={ld.eyebrow}>DURUM</div>
              <div style={{ ...ld.cardTitle, marginBottom: 14 }}>Pipeline konumu</div>
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                {[{ key: 'yeni', label: 'Yeni' }, { key: 'contacted', label: 'Temasta' }, { key: 'converted', label: 'Kazanıldı' }].map(s => (
                  <button key={s.key} style={{ ...ld.findBtn, background: status === s.key ? '#0A0A0A' : '#fff', color: status === s.key ? '#fff' : '#0A0A0A', fontWeight: status === s.key ? 600 : 400 }} onClick={() => onStatusChange(s.key)}>{s.label}</button>
                ))}
              </div>
            </div>

            <div style={ld.sideCard}>
              <div style={ld.eyebrow}>AKTİVİTE</div>
              <div style={{ ...ld.cardTitle, marginBottom: 14 }}>Zaman çizelgesi</div>
              {lastEvent && (
                <div style={ld.lastEventBanner}>
                  <div style={ld.lastEventLabel}>Son hareket</div>
                  <div style={ld.lastEventText}>{(ACTIONS[lastEvent.action] || ACTIONS.note).label}</div>
                </div>
              )}
              {events.map((event, eventIdx) => {
                const meta = ACTIONS[event.action] || ACTIONS.note;
                return (
                  <div key={`${event.ts}-${eventIdx}`} style={ld.actRow}>
                    <div style={ld.actDot}/>
                    <div style={{ flex: 1 }}>
                      <div style={ld.actKind}>{meta.label}</div>
                      <div style={ld.actMeta}>
                        {fmtDate(event.date)}
                        {event.note ? ` · ${event.note}` : ''}
                      </div>
                    </div>
                  </div>
                );
              })}
              {lead.last_analyzed && (
                <div style={ld.actRow}><div style={ld.actDot}/><div style={{ flex: 1 }}><div style={ld.actKind}>Tarama tamamlandı</div><div style={ld.actMeta}>{fmtDate(lead.last_analyzed)} · Skor {lead.scoring.score}</div></div></div>
              )}
              <div style={ld.actRow}><div style={ld.actDot}/><div style={{ flex: 1 }}><div style={ld.actKind}>Lead listesine eklendi</div><div style={ld.actMeta}>{lead.city || '—'}</div></div></div>
            </div>

            <div style={ld.sideCard}>
              <div style={ld.eyebrow}>NOT</div>
              <div style={{ ...ld.cardTitle, marginBottom: 12 }}>Hızlı not</div>
              <textarea style={ld.textarea} value={note} onChange={e => setNote(e.target.value)} placeholder="Lead hakkında not ekle..."/>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 12, marginTop: 10 }}>
                <div style={ld.noteHint}>{feedback || 'Kısa notu zaman çizelgesine ekler.'}</div>
                <button style={{ ...ld.btnDarkSm, opacity: busy || !note.trim() ? 0.7 : 1 }} onClick={saveNote} disabled={busy || !note.trim()}>{busy ? 'Kaydediliyor…' : 'Kaydet'}</button>
              </div>
            </div>
          </aside>
        </section>
      </div>
    );
  }

  const ld = {
    root:        { padding: '24px 48px 48px', overflowY: 'auto', flex: 1, fontFamily: '"Inter", system-ui, sans-serif', color: '#0A0A0A', background: '#FAFAF9', minWidth: 0 },
    top:         { display: 'flex', justifyContent: 'space-between', alignItems: 'center', paddingBottom: 18, borderBottom: '1px solid #ECECEC', marginBottom: 32 },
    crumbs:      { display: 'flex', gap: 10, fontSize: 13, color: '#9A9A9A', alignItems: 'center', flexWrap: 'wrap' },
    crumb:       { fontFamily: '"JetBrains Mono"' },
    crumbSep:    { color: '#D0D0CE' },
    btnGhost:    { padding: '8px 14px', background: '#fff', border: '1px solid #ECECEC', borderRadius: 8, fontSize: 12.5, color: '#3A3A3A', cursor: 'pointer' },
    btnDark:     { padding: '8px 14px', background: '#0A0A0A', color: '#fff', border: 'none', borderRadius: 8, fontSize: 12.5, fontWeight: 500, cursor: 'pointer' },
    btnDarkSm:   { padding: '6px 12px', background: '#0A0A0A', color: '#fff', border: 'none', borderRadius: 7, fontSize: 11.5, fontWeight: 500, cursor: 'pointer' },
    hero:        { display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 32, marginBottom: 24 },
    heroLeft:    { flex: 1 },
    statusRow:   { display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' },
    statusBadge: { fontSize: 11, fontFamily: '"JetBrains Mono"', background: '#FFE0E0', color: '#A12020', padding: '4px 10px', borderRadius: 99, fontWeight: 600, letterSpacing: 0.5 },
    metaTag:     { fontSize: 11.5, fontFamily: '"JetBrains Mono"', background: '#fff', border: '1px solid #ECECEC', padding: '4px 10px', borderRadius: 99, color: '#3A3A3A' },
    metaText:    { fontSize: 11.5, color: '#9A9A9A', fontFamily: '"JetBrains Mono"', marginLeft: 6 },
    h1:          { fontFamily: '"Inter Tight"', fontSize: 52, fontWeight: 600, letterSpacing: -2, lineHeight: 1.05, margin: '20px 0 0' },
    urls:        { display: 'flex', gap: 8, marginTop: 18, flexWrap: 'wrap' },
    quickActions:{ display: 'flex', gap: 8, marginTop: 16, flexWrap: 'wrap' },
    quickBtn:    { padding: '8px 14px', background: '#FAFAF9', border: '1px solid #ECECEC', borderRadius: 10, fontSize: 12, color: '#0A0A0A', cursor: 'pointer', fontWeight: 500 },
    urlChip:     { padding: '8px 14px', background: '#fff', border: '1px solid #ECECEC', borderRadius: 99, fontSize: 12.5, color: '#3A3A3A', cursor: 'pointer', fontFamily: '"JetBrains Mono"' },
    heroRight:   { display: 'flex', alignItems: 'center', gap: 16, flexShrink: 0 },
    gradePill:   { width: 56, height: 56, borderRadius: 14, background: '#0A0A0A', color: '#fff', display: 'grid', placeItems: 'center', fontFamily: '"Inter Tight"', fontSize: 26, fontWeight: 600 },
    nextAction:  { display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 24, padding: '20px 24px', background: '#fff', border: '1px solid #ECECEC', borderRadius: 14, marginBottom: 28 },
    naEyebrow:   { fontSize: 10.5, fontFamily: '"JetBrains Mono"', textTransform: 'uppercase', letterSpacing: 1.2, color: '#A14C20' },
    naTitle:     { fontFamily: '"Inter Tight"', fontSize: 22, fontWeight: 600, letterSpacing: -0.4, marginTop: 6 },
    naDesc:      { fontSize: 13, color: '#6B6B6B', marginTop: 4, maxWidth: 600 },
    naHelper:    { fontSize: 12, color: '#9A9A9A', marginTop: 8, lineHeight: 1.45 },
    inlineFeedback:{ fontSize: 12, color: '#1F6B3B', marginTop: 10, fontWeight: 500 },
    cols:        { display: 'grid', gridTemplateColumns: '1.7fr 1fr', gap: 24 },
    side:        { display: 'flex', flexDirection: 'column', gap: 16 },
    eyebrow:     { fontSize: 11, fontFamily: '"JetBrains Mono"', textTransform: 'uppercase', letterSpacing: 1.2, color: '#9A9A9A' },
    cardTitle:   { fontFamily: '"Inter Tight"', fontSize: 20, fontWeight: 600, letterSpacing: -0.4, marginTop: 6 },
    statsCard:   { background: '#fff', border: '1px solid #ECECEC', borderRadius: 14, padding: 24, marginBottom: 16 },
    statsHeader: { marginBottom: 18 },
    statsGrid:   { display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: 0, borderTop: '1px solid #ECECEC', paddingTop: 18 },
    stat:        { padding: '0 14px', borderRight: '1px solid #ECECEC' },
    statLabel:   { fontSize: 10.5, color: '#9A9A9A', textTransform: 'uppercase', letterSpacing: 1, fontFamily: '"JetBrains Mono"' },
    statVal:     { fontFamily: '"Inter Tight"', fontSize: 22, fontWeight: 600, letterSpacing: -0.6, marginTop: 8 },
    packCard:    { background: '#fff', border: '1px solid #ECECEC', borderRadius: 14, padding: 22, marginBottom: 16 },
    packTitle:   { fontFamily: '"Inter Tight"', fontSize: 22, fontWeight: 600, letterSpacing: -0.4, margin: '8px 0 6px' },
    packDesc:    { fontSize: 13, color: '#6B6B6B', maxWidth: 480 },
    packRight:   { textAlign: 'right', minWidth: 160 },
    packPrice:   { fontFamily: '"Inter Tight"', fontSize: 20, fontWeight: 600, letterSpacing: -0.4, color: '#1F8B3B' },
    packRange:   { fontSize: 12, color: '#3A3A3A', fontFamily: '"JetBrains Mono"', marginTop: 4 },
    packTags:    { display: 'flex', gap: 6, marginTop: 14, paddingTop: 14, borderTop: '1px solid #ECECEC', flexWrap: 'wrap' },
    tag:         { fontSize: 11, fontFamily: '"JetBrains Mono"', background: '#F4F4F2', padding: '4px 10px', borderRadius: 6, color: '#3A3A3A' },
    tagPrimary:  { fontSize: 11, fontFamily: '"JetBrains Mono"', background: '#0A0A0A', color: '#fff', padding: '4px 10px', borderRadius: 6 },
    findCard:    { background: '#fff', border: '1px solid #ECECEC', borderRadius: 14, overflow: 'hidden' },

  // ── Pipeline View ──────────────────────────────────────────────────────────

  function PipelineView({ leads, onSelect, onDataChange }) {
    const [tick, setTick] = React.useState(0);
    const [busyLead, setBusyLead] = React.useState('');
    const dragRef = React.useRef('');

    function refresh() { setTick(t => t + 1); }

    const byStage = {};
    PIPE_STAGES.forEach(s => { byStage[s.key] = []; });
    leads.forEach(l => { const stage = getPipelineStage(l); (byStage[stage] = byStage[stage] || []).push(l); });

    const won = byStage['won'].length;
    const active = ['draft','contacted','meeting'].reduce((a, k) => a + (byStage[k]||[]).length, 0);

    function runCardAction(lead, event) {
      event.stopPropagation();
      setBusyLead(lead.name);
      startLeadAction(lead)
        .finally(() => {
          setBusyLead('');
          if (onDataChange) onDataChange();
          refresh();
        });
    }

    function handleDrop(e, stageKey) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');
      const name = dragRef.current;
      if (!name) return;
      const stageObj = PIPE_STAGES.find(s => s.key === stageKey);
      if (!stageObj) return;
      if (stageObj.actions.length) {
        addOutreach(name, stageObj.actions[0], new Date().toISOString().slice(0,16), '');
      } else if (stageKey === 'new') {
        setStatusLS(name, 'yeni');
      } else if (stageKey === 'won') {
        addOutreach(name, 'deal_won', new Date().toISOString().slice(0,16), '');
      } else if (stageKey === 'lost') {
        addOutreach(name, 'deal_lost', new Date().toISOString().slice(0,16), '');
      }
      dragRef.current = '';
      if (onDataChange) onDataChange();
      refresh();
    }

    return (
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0, background: '#FAFAF9', overflowY: 'auto' }}>
        <div style={pv.header}>
          <div>
            <div style={pv.pageEyebrow}>PIPELINE</div>
            <h1 style={pv.pageTitle}>Satış kanalı</h1>
            <p style={pv.pageSub}>{leads.length} lead · {won} kazanıldı · {active} aktif temasta</p>
          </div>
        </div>
        <div style={pv.board}>
          {PIPE_STAGES.map(stage => {
            const cards = byStage[stage.key] || [];
            return (
              <div
                key={stage.key}
                style={pv.col}
                className="pipe-col"
                onDragOver={e => { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }}
                onDragLeave={e => e.currentTarget.classList.remove('drag-over')}
                onDrop={e => handleDrop(e, stage.key)}
              >
                <div style={pv.colHead}>
                  <span style={{ ...pv.colDot, background: stage.color }}/>
                  <span style={pv.colTitle}>{stage.label}</span>
                  <span style={pv.colCnt}>{cards.length}</span>
                </div>
                <div style={pv.cards}>
                  {cards.map(l => {
                    const globalIdx = leads.indexOf(l);
                    const val = l.estimated_value_tl || 0;
                    return (
                      <div
                        key={l.name}
                        style={pv.card}
                        className="pipe-card"
                        draggable
                        onDragStart={e => { dragRef.current = l.name; e.currentTarget.classList.add('dragging'); }}
                        onDragEnd={e => e.currentTarget.classList.remove('dragging')}
                        onClick={() => onSelect(globalIdx)}
                      >
                        <div style={pv.cardName}>{l.name}</div>
                        <div style={pv.cardActionLabel}>{getPrimaryActionMeta(l).label}</div>
                        <div style={pv.cardMeta}>
                          <span style={{ ...pv.cardScore, background: stage.color + '22', color: stage.color }}>{l.scoring.grade} {l.scoring.score}</span>
                          {val > 0 && <span style={pv.cardVal}>~{fmt(val)} ₺</span>}
                        </div>
                        <div style={pv.cardActions}>
                          <button
                            style={{ ...pv.cardBtn, ...(busyLead === l.name ? pv.cardBtnMuted : null) }}
                            onClick={e => runCardAction(l, e)}
                            disabled={busyLead === l.name}
                          >
                            {busyLead === l.name ? 'Kaydediliyor…' : getPrimaryActionMeta(l).label}
                          </button>
                          <button style={pv.cardBtnGhost} onClick={e => { e.stopPropagation(); triggerQuickLeadAction(l); }}>
                            Hızlı aç
                          </button>
                        </div>
                      </div>
                    );
                  })}
                  {cards.length === 0 && <div style={pv.empty}>Buraya sürükle</div>}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  // ── Raporlar View ──────────────────────────────────────────────────────────

  function RaporlarView({ leads, statuses, onSelect }) {
    const [sort, setSort] = React.useState('score');
    const [cityFilter, setCityFilter] = React.useState('all');
    const [statusFilter, setStatusFilter] = React.useState('all');
    const [readinessFilter, setReadinessFilter] = React.useState('all');
    const cities = React.useMemo(() => ['all', ...Array.from(new Set(leads.map(l => l.city).filter(Boolean))).sort()], [leads]);
    const filtered = React.useMemo(() => {
      return leads.filter(lead => {
        const status = statuses[lead.name] || 'yeni';
        if (cityFilter !== 'all' && lead.city !== cityFilter) return false;
        if (statusFilter !== 'all' && status !== statusFilter) return false;
        if (readinessFilter === 'ready-call' && !lead.phone) return false;
        if (readinessFilter === 'needs-data' && !needsContactCompletion(lead)) return false;
        if (readinessFilter === 'proposal-ready' && !(lead.ai_report && lead.ai_email && lead.matched_services?.length)) return false;
        return true;
      });
    }, [leads, statuses, cityFilter, statusFilter, readinessFilter]);
    const sorted = React.useMemo(() => {
      const arr = filtered.slice();
      if (sort === 'score')    arr.sort((a, b) => b.scoring.score - a.scoring.score);
      if (sort === 'value')    arr.sort((a, b) => (b.estimated_value_tl||0) - (a.estimated_value_tl||0));
      if (sort === 'priority') arr.sort((a, b) => (b.sales_priority_score||0) - (a.sales_priority_score||0));
      return arr;
    }, [filtered, sort]);

    const totalPipeline = leads.reduce((a, l) => a + (l.estimated_value_tl||0), 0);
    const readyToContact = leads.filter(l => l.phone || l.address).length;

    return (

          <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap', justifyContent: 'flex-end' }}>

            </select>
            <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} style={rv.select}>
              <option value="all">Tum durumlar</option>
              <option value="yeni">Yeni</option>
              <option value="contacted">Temasta</option>
              <option value="converted">Kazanildi</option>
            </select>
            <select value={readinessFilter} onChange={e => setReadinessFilter(e.target.value)} style={rv.select}>
              <option value="all">Tum hazirliklar</option>
              <option value="ready-call">Hazir arama</option>
              <option value="needs-data">Veri tamamlama</option>
              <option value="proposal-ready">Teklif hazir</option>
            </select>
            <span style={{ fontSize: 12, color: '#6B6B6B', fontFamily: '"JetBrains Mono"' }}>Sırala:</span>
            {[['score','Puan'],['value','Değer'],['priority','Öncelik']].map(([k,l]) => (
              <button key={k} style={{ padding: '7px 12px', borderRadius: 8, border: '1px solid #ECECEC', background: sort===k ? '#0A0A0A' : '#fff', color: sort===k ? '#fff' : '#3A3A3A', fontSize: 12, cursor: 'pointer', fontWeight: sort===k ? 600 : 400 }} onClick={() => setSort(k)}>{l}</button>
            ))}
          </div>
        </div>
        <div style={{ padding: '24px 32px 40px', display: 'flex', flexDirection: 'column', gap: 12 }}>
          {sorted.map((l, i) => {
            const originalIdx = leads.indexOf(l);
            const st = statuses[l.name] || 'yeni';
            const statusColors = { yeni: '#FFE0E0', contacted: '#E8EEFF', converted: '#EAFBD3' };
            const statusTextColors = { yeni: '#A12020', contacted: '#1F3A8A', converted: '#1F6B3B' };
            const statusLabels = { yeni: 'Yeni', contacted: 'Temasta', converted: 'Kazanıldı' };
            return (
              <div key={l.name} style={{ background: '#fff', border: '1px solid #ECECEC', borderRadius: 14, padding: '18px 24px', cursor: 'pointer', display: 'grid', gridTemplateColumns: '60px 1fr 180px 120px', gap: 20, alignItems: 'center' }} onClick={() => onSelect(originalIdx)}>
                <div style={{ fontFamily: '"Inter Tight"', fontSize: 28, fontWeight: 700, letterSpacing: -1, color: '#0A0A0A' }}>{l.scoring.score}<span style={{ fontSize: 12, color: '#9A9A9A', fontWeight: 400 }}>/100</span></div>
                <div>
                  <div style={{ fontFamily: '"Inter Tight"', fontSize: 16, fontWeight: 600, letterSpacing: -0.3 }}>{l.name}</div>

          })}

  const rv = {

  // ── App ────────────────────────────────────────────────────────────────────

  function App() {
    const [view,        setView]        = React.useState('cockpit');
    const [selectedIdx, setSelectedIdx] = React.useState(0);
    const [leadRows,    setLeadRows]    = React.useState(() => leads.slice());
    const [statuses,    setStatuses]    = React.useState(() => getStatuses());

    const sorted = React.useMemo(
      () => [...leadRows].sort((a, b) => b.scoring.score - a.scoring.score),
      [leadRows]
    );

    function syncSharedState() {
      setLeadRows(leads.slice());
      setStatuses({ ...getStatuses() });
    }

    function handleStatusChange(name, s) {
      setStatusLS(name, s).finally(syncSharedState);
    }

    function navigate(v) { setView(v); }

    function selectLead(i) { setSelectedIdx(i); setView('detail'); }

    function openReports() { setView('raporlar'); }

    function openSearch() { promptLeadSearch(sorted, selectLead); }

    function handleAutomationClick() { copyAutomationPlan(); }

    React.useEffect(() => {
      Promise.all([
        fetchJSON('/api/leads?limit=500').then(rows => {
          apiReady = true;
          applyRemoteLeads(rows);
        }).catch(err => {
          apiReady = false;
          console.warn('Lead API fallback:', err);
        }),
        fetchJSON('/api/outreach?limit=1000').then(rows => {
          apiReady = true;
          applyRemoteOutreach(rows);
        }).catch(err => {
          console.warn('Outreach API fallback:', err);
          outreachEvents = readLocalOutreach().map(normalizeOutreachEvent).filter(Boolean);
        }),
      ]).finally(syncSharedState);
    }, []);

    React.useEffect(() => {
      if (selectedIdx > Math.max(sorted.length - 1, 0)) {
        setSelectedIdx(0);
      }
    }, [selectedIdx, sorted.length]);

    function renderContent() {
      if (!sorted.length) {
        return <div style={{ flex: 1, display: 'grid', placeItems: 'center', color: '#6B6B6B', background: '#FAFAF9' }}>Lead verisi bulunamadı.</div>;
      }
      switch (view) {
        case 'detail':
          return (
            <LeadDetail
              lead={sorted[selectedIdx]}
              idx={selectedIdx}
              total={sorted.length}
              status={statuses[sorted[selectedIdx].name] || 'yeni'}
              onStatusChange={s => handleStatusChange(sorted[selectedIdx].name, s)}
              onDataChange={syncSharedState}
              onBack={() => setView('cockpit')}
              onPrev={() => setSelectedIdx(i => Math.max(0, i - 1))}
              onNext={() => setSelectedIdx(i => Math.min(sorted.length - 1, i + 1))}
            />
          );
        case 'pipeline':
          return <PipelineView leads={sorted} onSelect={selectLead} onDataChange={syncSharedState}/>;
        case 'hizmetler':
          return <HizmetlerView leads={leadRows} />;
        case 'raporlar':
          return <RaporlarView leads={sorted} statuses={statuses} onSelect={selectLead}/>;
        default:
          return <CockpitMain leads={sorted} statuses={statuses} onSelect={selectLead} onOpenReports={openReports} onOpenSearch={openSearch}/>;
      }
    }

    return (
      <div style={{ display: 'flex', minHeight: '100vh', width: '100%' }}>
        <Sidebar view={view} onNav={navigate} leadCount={leadRows.length} onAutomationClick={handleAutomationClick}/>
        {renderContent()}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
