<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Zeplin Media · Lead Cockpit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100vh; background: #FAFAF9; }
    body { font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    #root { min-height: 100vh; }
    button { font-family: inherit; }
    textarea { font-family: inherit; }
    a { text-decoration: none; }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script>
    var leads    = JSON.parse(atob('__DATA__'));
    var services = JSON.parse(atob('__SERVICES__'));
    var STATUS_KEY = 'zeplin_lead_statuses_v2';
  </script>

  <script type="text/babel">
  // ── Helpers ────────────────────────────────────────────────────────────────

  function fmt(n) {
    if (!n) return '0';
    if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
    if (n >= 1000) return Math.round(n / 1000) + 'K';
    return String(n);
  }

  function fmtDate(str) {
    if (!str) return '';
    try {
      const d = new Date(str.replace(' ', 'T'));
      if (isNaN(d)) return str;
      return d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', year: 'numeric' });
    } catch(e) { return str; }
  }

  function getStatuses() {
    try { return JSON.parse(localStorage.getItem(STATUS_KEY) || '{}'); } catch(e) { return {}; }
  }
  function setStatusLS(name, s) {
    const a = getStatuses(); a[name] = s;
    localStorage.setItem(STATUS_KEY, JSON.stringify(a));
  }

  function issueToSeverity(text) {
    if (!text) return 'Bilgi';
    const t = text.toLowerCase();
    if (t.includes('ssl') || t.includes('https')) return 'Kritik';
    if (t.includes('web sitesi yok') || t.includes('website yok') || t.includes('site yok')) return 'Yüksek';
    if (t.includes('schema') || t.includes('og') || t.includes('open graph')) return 'Orta';
    if (t.includes('telefon') || t.includes('adres') || t.includes('tamamla') || t.includes('instagram yok')) return 'Düşük';
    return 'Bilgi';
  }

  function scoreDash(score) {
    const circ = 326.7;
    return circ * (1 - score / 100);
  }

  function computeKPIs(arr) {
    const total = arr.length || 1;
    return {
      packagedCount: arr.filter(l => l.matched_services && l.matched_services.length > 0).length,
      packagedPct:   Math.round(arr.filter(l => l.matched_services && l.matched_services.length > 0).length / total * 100),
      phoneCount:    arr.filter(l => l.phone).length,
      phonePct:      Math.round(arr.filter(l => l.phone).length / total * 100),
      aiCount:       arr.filter(l => l.ai_report).length,
      aiPct:         Math.round(arr.filter(l => l.ai_report).length / total * 100),
      auditCount:    arr.filter(l => l.scoring && l.scoring.issues && l.scoring.issues.length > 0).length,
      auditPct:      Math.round(arr.filter(l => l.scoring && l.scoring.issues && l.scoring.issues.length > 0).length / total * 100),
    };
  }

  function computeTabCounts(arr, statuses) {
    return {
      total:     arr.length,
      yeni:      arr.filter(l => (statuses[l.name] || 'yeni') === 'yeni').length,
      contacted: arr.filter(l => statuses[l.name] === 'contacted').length,
      converted: arr.filter(l => statuses[l.name] === 'converted').length,
      low:       arr.filter(l => l.scoring && l.scoring.score < 50).length,
    };
  }

  // ── V1Plus Sub-components ──────────────────────────────────────────────────

  function SideIc({ name }) {
    const paths = {
      cockpit:  <><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9"/></>,
      leads:    <><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/></>,
      pipeline: <><path d="M3 6h18"/><path d="M5 12h14"/><path d="M8 18h8"/></>,
      audit:    <><path d="M9 11l3 3 8-8"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></>,
      reports:  <><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 12v4"/><path d="M12 8v8"/><path d="M16 14v2"/></>,
      settings: <><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></>,
    };
    return (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
        {paths[name]}
      </svg>
    );
  }

  function SH({ eyebrow, title, right }) {
    return (
      <div style={vp.sectionHeader}>
        <div>
          <div style={vp.eyebrowSm}>{eyebrow}</div>
          <h2 style={vp.h2}>{title}</h2>
        </div>
        {right}
      </div>
    );
  }

  function KpiHead({ label, hint }) {
    return (
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <div style={{ fontSize: 11, fontFamily: '"JetBrains Mono"', textTransform: 'uppercase', letterSpacing: 1, color: '#3A3A3A' }}>{label}</div>
        <div style={{ fontSize: 10.5, fontFamily: '"JetBrains Mono"', color: '#3A3A3A', background: 'rgba(0,0,0,0.06)', padding: '2px 7px', borderRadius: 6 }}>{hint}</div>
      </div>
    );
  }

  // ── V1Plus Component ───────────────────────────────────────────────────────

  function V1Plus({ leads, statuses, onSelect }) {
    const [activeTab, setActiveTab] = React.useState('Tümü');

    const kpi    = computeKPIs(leads);
    const counts = computeTabCounts(leads, statuses);

    const tabs = [
      ['Tümü',       counts.total],
      ['Yeni',       counts.yeni],
      ['Contacted',  counts.contacted],
      ['Converted',  counts.converted],
      ['Düşük skor', counts.low],
    ];

    const filteredLeads = React.useMemo(() => {
      if (activeTab === 'Tümü')       return leads;
      if (activeTab === 'Yeni')       return leads.filter(l => (statuses[l.name] || 'yeni') === 'yeni');
      if (activeTab === 'Contacted')  return leads.filter(l => statuses[l.name] === 'contacted');
      if (activeTab === 'Converted')  return leads.filter(l => statuses[l.name] === 'converted');
      if (activeTab === 'Düşük skor') return leads.filter(l => l.scoring && l.scoring.score < 50);
      return leads;
    }, [leads, statuses, activeTab]);

    const topLead    = leads[0];
    const queueLeads = filteredLeads.slice(0, 4);
    const miniLeads  = leads.slice(4);

    const totalVal      = leads.reduce((s, l) => s + (l.estimated_value_tl || 0), 0);
    const criticalCount = leads.filter(l =>
      l.scoring && l.scoring.issues && l.scoring.issues.some(i => issueToSeverity(i) === 'Kritik')
    ).length;
    const packagedCount = leads.filter(l => l.matched_services && l.matched_services.length > 0).length;
    const lastDate      = topLead ? fmtDate(topLead.last_analyzed) : '—';

    const pipelineMax = Math.max(leads.length, 1);

    return (
      <div style={vp.root}>

        {/* ── Sidebar ── */}
        <aside style={vp.sidebar}>
          <div style={vp.sideBrand}>
            <div style={vp.logo}>
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
                <ellipse cx="12" cy="12" rx="10" ry="6" stroke="#0A0A0A" strokeWidth="1.5"/>
                <path d="M22 12 L24 13 L22 14" stroke="#0A0A0A" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                <circle cx="9" cy="12" r="1" fill="#0A0A0A"/>
              </svg>
            </div>
            <div>
              <div style={vp.brandName}>Zeplin Media</div>
              <div style={vp.brandSub}>Lead Intelligence</div>
            </div>
          </div>

          <nav style={vp.sideNav}>
            {[
              { ic: 'cockpit',  name: 'Cockpit',  active: true, badge: leads.length },
              { ic: 'leads',    name: 'Leadler' },
              { ic: 'pipeline', name: 'Pipeline' },
              { ic: 'audit',    name: 'Audit' },
              { ic: 'reports',  name: 'Raporlar' },
              { ic: 'settings', name: 'Ayarlar' },
            ].map((n, i) => (
              <a key={i} style={n.active ? vp.sideNavActive : vp.sideNavItem}>
                <SideIc name={n.ic} />
                <span style={{ flex: 1 }}>{n.name}</span>
                {n.badge !== undefined && (
                  <span style={n.active ? vp.sideBadgeA : vp.sideBadge}>{n.badge}</span>
                )}
              </a>
            ))}
          </nav>

          <div style={{ marginTop: 'auto' }}>
            <div style={vp.upgradeCard}>
              <div style={vp.upgradeEyebrow}>OTOMASYON</div>
              <div style={vp.upgradeTitle}>Otomatik tarayıcı</div>
              <div style={vp.upgradeBody}>15 dakikada bir tarama. Yeni leadler otomatik dosyalansın.</div>
              <button style={vp.upgradeBtn}>Etkinleştir →</button>
            </div>
          </div>
        </aside>

        {/* ── Main ── */}
        <main style={vp.main}>

          {/* Top bar */}
          <header style={vp.topbar}>
            <div style={vp.search}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9A9A9A" strokeWidth="2">
                <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
              </svg>
              <span>Lead, firma veya hizmet ara</span>
              <kbd style={vp.kbd}>⌘K</kbd>
            </div>
            <div style={vp.topRight}>
              <div style={vp.statusChip}>
                <span style={vp.pulseDot}/>
                <span>BOT AKTİF · son 2 dk</span>
              </div>
              <button style={vp.iconBtn}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" strokeWidth="1.6">
                  <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
                  <path d="M10 21a2 2 0 0 0 4 0"/>
                </svg>
              </button>
              <div style={vp.user}>
                <div style={vp.avatar}>MA</div>
                <div>
                  <div style={{ fontWeight: 600, fontSize: 13 }}>Mert Aslan</div>
                  <div style={{ fontSize: 11, color: '#9A9A9A' }}>Sales Lead</div>
                </div>
              </div>
            </div>
          </header>

          {/* Hero */}
          <section style={vp.hero}>
            <div style={vp.heroLeft}>
              <div style={vp.eyebrow}>
                <span style={vp.pulseDot}/>
                ZEPLİN OS · CANLI TARAMA
              </div>
              <h1 style={vp.h1}>Lead Cockpit<span style={vp.h1Accent}>.</span></h1>
              <p style={vp.lede}>
                {leads.length} işletme tarandı. Bot{' '}
                <em style={vp.em}>{packagedCount} lead</em>{' '}
                için satılabilir hizmet paketi çıkardı;{' '}
                <em style={vp.em}>{criticalCount} işletmede</em> kritik açık var.
              </p>
              <div style={vp.heroMeta}>
                <span>Son güncelleme</span>
                <strong>{lastDate}</strong>
                <span style={vp.heroMetaSep}>·</span>
                <span>Toplam pipeline</span>
                <strong>~{fmt(totalVal)} ₺</strong>
              </div>

              <div style={vp.tabs}>
                {tabs.map(([name, count]) => {
                  const active = activeTab === name;
                  return (
                    <button key={name} onClick={() => setActiveTab(name)} style={active ? vp.tabActive : vp.tab}>
                      {name}
                      <span style={active ? vp.tabCountActive : vp.tabCount}>{count}</span>
                    </button>
                  );
                })}
              </div>
            </div>

            {topLead && (
              <div style={vp.heroRight}>
                <div style={vp.focusCard}>
                  <div style={vp.focusEyebrow}>BUGÜNÜN ODAĞI</div>
                  <div style={vp.focusTitle}>{topLead.name}</div>
                  <div style={vp.focusSub}>
                    {topLead.category || topLead.sector || 'İşletme'} · {topLead.city}
                  </div>
                  <div style={vp.focusStats}>
                    <div>
                      <div style={vp.focusStatLabel}>Potansiyel</div>
                      <div style={vp.focusStatValue}>
                        {topLead.estimated_value_tl > 0 ? `~${fmt(topLead.estimated_value_tl)} ₺` : '—'}
                      </div>
                    </div>
                    <div>
                      <div style={vp.focusStatLabel}>Skor</div>
                      <div style={vp.focusStatValue}>
                        {topLead.scoring.score}<span style={vp.focusStatUnit}>/100</span>
                      </div>
                    </div>
                    <div>
                      <div style={vp.focusStatLabel}>Sınıf</div>
                      <div style={vp.focusStatValue}>{topLead.scoring.grade}</div>
                    </div>
                  </div>
                  <div style={vp.focusActions}>
                    <button style={vp.btnLime} onClick={() => onSelect(0)}>
                      {topLead.next_action || 'Detay gör'} →
                    </button>
                    <button style={vp.btnGhostDark} onClick={() => onSelect(0)}>Rapor</button>
                  </div>
                </div>
              </div>
            )}
          </section>

          {/* KPI row */}
          <section style={vp.kpiRow}>
            <div style={{ ...vp.kpiCard, background: '#EAFBD3' }}>
              <KpiHead label="Paketlenen fırsat" hint={`${kpi.packagedCount}/${leads.length}`} />
              <div style={vp.kpiBig}>%{kpi.packagedPct}</div>
              <div style={vp.kpiBars}>
                {[5,7,6,9,8,11,10,12].map((v, i) => (
                  <div key={i} style={{ height: `${v*4}px`, flex: 1, background: '#0A0A0A', borderRadius: 2, opacity: 0.85 }}/>
                ))}
              </div>
              <div style={vp.kpiCap}>lead hizmete bağlandı</div>
            </div>

            <div style={{ ...vp.kpiCard, background: '#FFE9D9' }}>
              <KpiHead label="Temas hazırlığı" hint={`${kpi.phoneCount}/${leads.length}`} />
              <div style={vp.kpiBig}>%{kpi.phonePct}</div>
              <svg width="100%" height="48" viewBox="0 0 200 48">
                <path d="M10 42 A50 50 0 0 1 190 42" fill="none" stroke="#FFD3B0" strokeWidth="7" strokeLinecap="round"/>
                <path d={`M10 42 A50 50 0 0 1 ${10 + 180 * Math.min(kpi.phonePct, 100) / 100} 42`} fill="none" stroke="#FF6B3D" strokeWidth="7" strokeLinecap="round"/>
              </svg>
              <div style={vp.kpiCap}>lead telefon bilgisi içeriyor</div>
            </div>

            <div style={{ ...vp.kpiCard, background: '#E8EEFF' }}>
              <KpiHead label="AI dosyası" hint={`${kpi.aiCount}/${leads.length}`} />
              <div style={vp.kpiBig}>%{kpi.aiPct}</div>
              <div style={vp.dotsRow}>
                {Array.from({ length: leads.length }).map((_, i) => (
                  <span key={i} style={{
                    width: 11, height: 11, borderRadius: 99, display: 'inline-block',
                    background: i < kpi.aiCount ? '#3D5BFF' : '#C8D0FF',
                  }}/>
                ))}
              </div>
              <div style={vp.kpiCap}>rapor ve mail hazır</div>
            </div>

            <div style={{ ...vp.kpiCard, background: '#FFE0E0' }}>
              <KpiHead label="Audit derinliği" hint={`${kpi.auditCount}/${leads.length}`} />
              <div style={vp.kpiBig}>%{kpi.auditPct}</div>
              <div style={vp.dotsRow}>
                {Array.from({ length: leads.length }).map((_, i) => (
                  <span key={i} style={{
                    width: 11, height: 11, borderRadius: 99, display: 'inline-block',
                    background: i < kpi.auditCount ? '#E04545' : '#FFC0C0',
                  }}/>
                ))}
              </div>
              <div style={vp.kpiCap}>teknik sinyalli</div>
            </div>
          </section>

          <div style={vp.note}>
            Güvenlik notu — Takım kullanımı için sıradaki aşama: kullanıcı yetkileri, kalıcı veritabanı ve audit log. Şu an pipeline aksiyonları bu tarayıcıda saklanır.
          </div>

          {/* Two column */}
          <section style={vp.twoCol}>

            {/* Focus queue */}
            <div>
              <SH eyebrow="FOCUS QUEUE" title="Öncelik masası" right={<button style={vp.btnGhost}>Tüm raporlar →</button>}/>
              <div style={vp.queue}>
                {queueLeads.length === 0 ? (
                  <div style={{ padding: 24, background: '#fff', color: '#9A9A9A', fontSize: 13, textAlign: 'center' }}>
                    Bu kategoride lead yok.
                  </div>
                ) : queueLeads.map((r, i) => {
                  const globalIdx = leads.indexOf(r);
                  return (
                    <article
                      key={r.name}
                      style={{ ...vp.queueRow, cursor: 'pointer' }}
                      onClick={() => onSelect(globalIdx)}
                    >
                      <div style={vp.queueIdx}>
                        <div style={vp.queueIdxNum}>{String(i + 1).padStart(2, '0')}</div>
                        <div style={vp.queueIdxScore}>
                          {r.scoring.score}
                          <span style={{ color: '#9A9A9A', fontSize: 12, fontWeight: 400 }}>/100</span>
                        </div>
                      </div>
                      <div>
                        <h3 style={vp.queueTitle}>{r.name}</h3>
                        <div style={vp.queueSub}>
                          {r.city} · {r.scoring.grade} sınıfı ·{' '}
                          <strong>{r.estimated_value_tl > 0 ? `~${fmt(r.estimated_value_tl)} ₺` : '—'}</strong>
                        </div>
                        <div style={vp.queueTags}>
                          {r.next_action && <span style={vp.tagPrimary}>{r.next_action}</span>}
                          {(r.scoring.issues || []).slice(0, 2).map((t, ti) => (
                            <span key={ti} style={vp.tag}>{t}</span>
                          ))}
                        </div>
                      </div>
                      <div style={vp.queueCta}>
                        <div style={vp.queueCtaLabel}>Sıradaki aksiyon</div>
                        <button
                          style={vp.btnPrimarySm}
                          onClick={e => { e.stopPropagation(); onSelect(globalIdx); }}
                        >
                          {r.next_action || 'Detay gör'} →
                        </button>
                      </div>
                    </article>
                  );
                })}
              </div>
            </div>

            {/* Sidebar col */}
            <aside style={vp.colSide}>

              <SH eyebrow="PIPELINE" title="Satış sağlığı"/>
              <div style={vp.healthCard}>
                {[
                  { name: 'Yeni',      val: counts.yeni,      color: '#0A0A0A' },
                  { name: 'Temasta',   val: counts.contacted, color: '#C6F24E' },
                  { name: 'Kazanıldı', val: counts.converted, color: '#FF6B3D' },
                ].map(h => (
                  <div key={h.name} style={vp.healthRow}>
                    <div style={vp.healthLabel}>{h.name}</div>
                    <div style={vp.healthBarWrap}>
                      <div style={{ height: '100%', width: `${(h.val / pipelineMax) * 100}%`, background: h.color, borderRadius: 99 }}/>
                    </div>
                    <div style={vp.healthVal}>{h.val}</div>
                  </div>
                ))}
              </div>

              <SH
                eyebrow="HAFTALIK TEMPO"
                title="Ekip ritmi"
                right={
                  <div style={vp.segCtl}>
                    <span style={vp.segActive}>Hafta</span>
                    <span style={{ padding: '4px 10px' }}>Ay</span>
                  </div>
                }
              />
              <div style={vp.chartCard}>
                <div style={vp.chartBars}>
                  {[42,55,68,88,87,40,18].map((v, i) => (
                    <div key={i} style={vp.barCol}>
                      <div style={{
                        height: `${v}%`, width: '100%', borderRadius: 6,
                        position: 'relative', minHeight: 6,
                        background: (i === 3 || i === 4) ? '#0A0A0A' : '#E8E8E6',
                      }}>
                        {(i === 3 || i === 4) && <span style={vp.barLabel}>{v}</span>}
                      </div>
                      <div style={vp.barX}>{['PZT','SAL','ÇAR','PER','CUM','CMT','PAZ'][i]}</div>
                    </div>
                  ))}
                </div>
              </div>

              <SH eyebrow="LEAD KUYRUĞU" title="Sıradakiler" right={<a style={vp.linkSm}>Tümünü gör →</a>}/>
              <div style={vp.miniList}>
                {miniLeads.slice(0, 5).map((m, i) => {
                  const globalIdx = leads.indexOf(m);
                  return (
                    <div key={i} style={{ ...vp.miniRow, cursor: 'pointer' }} onClick={() => onSelect(globalIdx)}>
                      <div style={vp.miniIni}>{m.name.charAt(0)}</div>
                      <div style={{ flex: 1 }}>
                        <div style={vp.miniName}>{m.name}</div>
                        <div style={vp.miniMeta}>Skor {m.scoring.score} · Öncelik {m.sales_priority_score || '—'}</div>
                      </div>
                      <div style={{ color: '#9A9A9A' }}>→</div>
                    </div>
                  );
                })}
              </div>
            </aside>
          </section>
        </main>
      </div>
    );
  }

  const vp = {
    root:         { width: '100%', minHeight: '100vh', background: '#FAFAF9', fontFamily: '"Inter", system-ui, sans-serif', color: '#0A0A0A', display: 'grid', gridTemplateColumns: '244px 1fr' },
    sidebar:      { padding: '24px 18px', borderRight: '1px solid #ECECEC', display: 'flex', flexDirection: 'column', gap: 22, background: '#fff', position: 'sticky', top: 0, height: '100vh', overflowY: 'auto' },
    sideBrand:    { display: 'flex', alignItems: 'center', gap: 10, padding: '0 8px' },

  // ── LeadDetail sevStyle helper ─────────────────────────────────────────────

  function sevStyle(s) {
    return ({
      Kritik: { background: '#FFE0E0', color: '#A12020' },
      Yüksek: { background: '#FFE9D9', color: '#A14C20' },
      Orta:   { background: '#FFF6CC', color: '#7A5A00' },
      Düşük:  { background: '#E8EEFF', color: '#1F3A8A' },
      Bilgi:  { background: '#F4F4F2', color: '#3A3A3A' },
    })[s] || { background: '#F4F4F2', color: '#3A3A3A' };
  }

  // ── LeadDetail Component ───────────────────────────────────────────────────

  function LeadDetail({ lead, idx, total, status, onStatusChange, onBack, onPrev, onNext }) {
    const [showReport, setShowReport] = React.useState(false);
    const [showEmail,  setShowEmail]  = React.useState(false);
    const [copied,     setCopied]     = React.useState(false);
    const [note,       setNote]       = React.useState('');

    const issues     = lead.scoring.issues || [];
    const hasPackage = lead.matched_services && lead.matched_services.length > 0
                    && lead.recommended_package
                    && lead.recommended_package.name !== 'Veri tamamlama';
    const svc = lead.recommended_package || {};
    const ms  = (lead.matched_services || [])[0] || {};

    function copyEmail() {
      navigator.clipboard.writeText(lead.ai_email || '').then(() => {
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      });
    }

    return (
      <div style={ld.root}>

        {/* Top nav */}
        <header style={ld.top}>
          <div style={ld.crumbs}>
            <span style={{ ...ld.crumb, cursor: 'pointer', color: '#6B6B6B' }} onClick={onBack}>Cockpit</span>
            <span style={ld.crumbSep}>/</span>
            <span style={ld.crumb}>Leadler</span>
            <span style={ld.crumbSep}>/</span>
            <span style={{ ...ld.crumb, color: '#0A0A0A', fontWeight: 600 }}>{lead.name}</span>
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            <button style={{ ...ld.btnGhost, opacity: idx === 0 ? 0.4 : 1 }} onClick={onPrev} disabled={idx === 0}>← Önceki</button>
            <button style={{ ...ld.btnGhost, opacity: idx === total - 1 ? 0.4 : 1 }} onClick={onNext} disabled={idx === total - 1}>Sonraki →</button>
            <button style={ld.btnDark} onClick={onBack}>← Cockpit</button>
          </div>
        </header>

        {/* Hero */}
        <section style={ld.hero}>
          <div style={ld.heroLeft}>
            <div style={ld.statusRow}>
              <span style={ld.statusBadge}>● {(status || 'yeni').toUpperCase()}</span>
              {(lead.category || lead.sector) && (
                <span style={ld.metaTag}>{lead.category || lead.sector}</span>
              )}
              {lead.city && <span style={ld.metaTag}>{lead.city}</span>}
              {lead.last_analyzed && (
                <span style={ld.metaText}>Son analiz · {fmtDate(lead.last_analyzed)}</span>
              )}
            </div>
            <h1 style={ld.h1}>{lead.name}</h1>
            <div style={ld.urls}>
              {lead.website && lead.website.website_url && (
                <a href={lead.website.website_url} target="_blank" rel="noopener noreferrer" style={ld.urlChip}>
                  {lead.website.website_url.replace(/^https?:\/\//, '').replace(/\/$/, '')} ↗
                </a>
              )}
              {lead.social && lead.social.instagram_url && (
                <a href={lead.social.instagram_url} target="_blank" rel="noopener noreferrer" style={ld.urlChip}>
                  @{lead.social.instagram_username || 'instagram'} ↗
                </a>
              )}
              {lead.maps_url && (
                <a href={lead.maps_url} target="_blank" rel="noopener noreferrer" style={ld.urlChip}>Google Maps ↗</a>
              )}
              {lead.phone && <span style={ld.urlChip}>{lead.phone}</span>}
            </div>
          </div>

          <div style={ld.heroRight}>
            <div style={ld.scoreCircle}>
              <svg width="120" height="120" viewBox="0 0 120 120">
                <circle cx="60" cy="60" r="52" fill="none" stroke="#F4F4F2" strokeWidth="6"/>
                <circle cx="60" cy="60" r="52" fill="none" stroke="#0A0A0A" strokeWidth="6"
                  strokeDasharray="326.7"
                  strokeDashoffset={scoreDash(lead.scoring.score)}
                  transform="rotate(-90 60 60)"
                  strokeLinecap="round"/>
                <text x="60" y="60" textAnchor="middle" fontSize="32" fontWeight="600" fill="#0A0A0A" fontFamily="Inter Tight">{lead.scoring.score}</text>
                <text x="60" y="80" textAnchor="middle" fontSize="11" fill="#9A9A9A" fontFamily="JetBrains Mono">/100</text>
              </svg>
            </div>
            <div style={ld.gradePill}>{lead.scoring.grade}</div>
          </div>
        </section>

        {/* Next action banner */}
        {lead.next_action && (
          <div style={ld.nextAction}>
            <div>
              <div style={ld.naEyebrow}>SONRAKİ EN İYİ AKSİYON · ÖNCELİK {lead.sales_priority_score || '—'}</div>
              <div style={ld.naTitle}>{lead.next_action}</div>
              {lead.priority_reason && <div style={ld.naDesc}>{lead.priority_reason}</div>}
            </div>
            <div style={{ display: 'flex', gap: 8 }}>
              <button style={ld.btnGhost}>Atla</button>
              <button style={ld.btnDark}>Aksiyonu başlat →</button>
            </div>
          </div>
        )}

        {/* Two col */}
        <section style={ld.cols}>

          {/* Left */}
          <div>

            {/* Social signals */}
            <div style={ld.statsCard}>
              <div style={ld.statsHeader}>
                <div style={ld.eyebrow}>SOSYAL SİNYALLER</div>
                <div style={ld.cardTitle}>Etkileşim ve büyüme</div>
              </div>
              <div style={ld.statsGrid}>
                {[
                  ['Instagram', lead.social && lead.social.has_instagram ? '✓' : '✗'],
                  ['Takipçi',   lead.social && lead.social.stats && lead.social.stats.followers  ? String(lead.social.stats.followers)  : '—'],
                  ['Gönderi',   lead.social && lead.social.stats && lead.social.stats.post_count  ? String(lead.social.stats.post_count)  : '—'],
                  ['Ort. beğeni',lead.social && lead.social.stats && lead.social.stats.avg_likes   ? String(lead.social.stats.avg_likes)   : '—'],
                  ['Etkileşim', lead.social && lead.social.stats && lead.social.stats.engagement_rate ? `%${lead.social.stats.engagement_rate}` : '—'],
                ].map(([l, v], i) => (
                  <div key={i} style={{ ...ld.stat, ...(i === 4 ? { borderRight: 'none' } : {}) }}>
                    <div style={ld.statLabel}>{l}</div>
                    <div style={ld.statVal}>{v}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* Recommended package */}
            {hasPackage ? (
              <div style={ld.packCard}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 16 }}>
                  <div style={{ flex: 1 }}>
                    <div style={ld.eyebrow}>ÖNERİLEN PAKET · {(svc.category || 'DİJİTAL').toUpperCase()}</div>
                    <h3 style={ld.packTitle}>{svc.name}</h3>
                    <div style={ld.packDesc}>{svc.summary || svc.description || 'Dijital varlığınızı güçlendirir.'}</div>
                  </div>
                  {(ms.price_min || ms.price_max) ? (
                    <div style={ld.packRight}>
                      <div style={ld.packPrice}>
                        ~{fmt(ms.price_min)} ₺{' '}
                        <span style={{ fontSize: 11, color: '#9A9A9A' }}>/ay potansiyel</span>
                      </div>
                      <div style={ld.packRange}>
                        {(ms.price_min || 0).toLocaleString('tr-TR')} – {(ms.price_max || 0).toLocaleString('tr-TR')} ₺{' '}
                        <span style={{ color: '#9A9A9A' }}>tek seferlik</span>
                      </div>
                    </div>
                  ) : null}
                </div>
                <div style={ld.packTags}>
                  {[svc.category, svc.name].filter(Boolean).map((t, i) => (
                    <span key={i} style={i === 0 ? ld.tagPrimary : ld.tag}>{t}</span>
                  ))}
                  {(lead.scoring.issues || []).slice(0, 2).map((t, i) => (
                    <span key={`iss-${i}`} style={ld.tag}>{t}</span>
                  ))}
                </div>
              </div>
            ) : (
              <div style={{ ...ld.packCard, background: '#F9F9F7' }}>
                <div style={ld.eyebrow}>ÖNERİLEN PAKET</div>
                <div style={{ fontSize: 14, color: '#9A9A9A', marginTop: 8 }}>
                  Paket önerisi için lead verisi tamamlanmalı.
                </div>
              </div>
            )}

            {/* Audit findings */}
            <div style={ld.findCard}>
              <div style={ld.findHeader}>
                <div style={ld.eyebrow}>TARAMA BULGULARI</div>
                <div style={ld.cardTitle}>{issues.length > 0 ? `${issues.length} sinyal` : 'Temiz'}</div>
              </div>
              {issues.length === 0 ? (
                <div style={{ padding: '16px 24px', color: '#9A9A9A', fontSize: 13 }}>Sorun tespit edilmedi.</div>
              ) : issues.map((issue, i) => {
                const sev = issueToSeverity(issue);
                return (
                  <div key={i} style={ld.findRow}>
                    <div style={{ ...ld.sevPill, ...sevStyle(sev) }}>{sev}</div>
                    <div style={{ flex: 1 }}>
                      <div style={ld.findTitle}>{issue}</div>
                    </div>
                    <button style={ld.findBtn}>Düzelt →</button>
                  </div>
                );
              })}
            </div>

            {/* AI Report */}
            {lead.ai_report && (
              <div style={{ ...ld.findCard, marginTop: 16 }}>
                <div style={{ ...ld.findHeader, cursor: 'pointer', userSelect: 'none' }} onClick={() => setShowReport(r => !r)}>
                  <div>
                    <div style={ld.eyebrow}>AI RAPORU</div>
                    <div style={ld.cardTitle}>Zeplin AI Analizi {showReport ? '▲' : '▼'}</div>
                  </div>
                </div>
                {showReport && (
                  <div style={{ padding: '16px 24px', fontSize: 13.5, color: '#3A3A3A', lineHeight: 1.7, whiteSpace: 'pre-wrap' }}>
                    {lead.ai_report}
                  </div>
                )}
              </div>
            )}

            {/* AI Email */}
            {lead.ai_email && (
              <div style={{ ...ld.findCard, marginTop: 16 }}>
                <div style={{ ...ld.findHeader, cursor: 'pointer', userSelect: 'none' }} onClick={() => setShowEmail(e => !e)}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', width: '100%' }}>
                    <div>
                      <div style={ld.eyebrow}>SATIŞ E-POSTASI</div>
                      <div style={ld.cardTitle}>Hazır taslak {showEmail ? '▲' : '▼'}</div>
                    </div>
                    {showEmail && (
                      <button style={ld.findBtn} onClick={e => { e.stopPropagation(); copyEmail(); }}>
                        {copied ? '✓ Kopyalandı' : 'Kopyala'}
                      </button>
                    )}
                  </div>
                </div>
                {showEmail && (
                  <div style={{ padding: '16px 24px', fontSize: 13, color: '#3A3A3A', lineHeight: 1.7, whiteSpace: 'pre-wrap', fontFamily: '"JetBrains Mono"', background: '#FAFAF9' }}>
                    {lead.ai_email}
                  </div>
                )}
              </div>
            )}
          </div>

          {/* Right sidebar */}
          <aside style={ld.side}>

            {/* Status */}
            <div style={ld.sideCard}>
              <div style={ld.eyebrow}>DURUM</div>
              <div style={{ ...ld.cardTitle, marginBottom: 14 }}>Pipeline konumu</div>
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                {[
                  { key: 'yeni',      label: 'Yeni' },
                  { key: 'contacted', label: 'Temasta' },
                  { key: 'converted', label: 'Kazanıldı' },
                ].map(s => (
                  <button
                    key={s.key}
                    style={{
                      ...ld.findBtn,
                      background: status === s.key ? '#0A0A0A' : '#fff',
                      color:      status === s.key ? '#fff'    : '#0A0A0A',
                      fontWeight: status === s.key ? 600       : 400,
                    }}
                    onClick={() => onStatusChange(s.key)}
                  >
                    {s.label}
                  </button>
                ))}
              </div>
            </div>

            {/* Activity */}
            <div style={ld.sideCard}>
              <div style={ld.eyebrow}>AKTİVİTE</div>
              <div style={{ ...ld.cardTitle, marginBottom: 14 }}>Zaman çizelgesi</div>
              {lead.last_analyzed && (
                <div style={ld.actRow}>
                  <div style={ld.actDot}/>
                  <div style={{ flex: 1 }}>
                    <div style={ld.actKind}>Tarama tamamlandı</div>
                    <div style={ld.actMeta}>{fmtDate(lead.last_analyzed)} · Skor {lead.scoring.score}</div>
                  </div>
                </div>
              )}
              <div style={ld.actRow}>
                <div style={ld.actDot}/>
                <div style={{ flex: 1 }}>
                  <div style={ld.actKind}>Lead listesine eklendi</div>
                  <div style={ld.actMeta}>{lead.city || '—'}</div>
                </div>
              </div>
            </div>

            {/* Notes */}
            <div style={ld.sideCard}>
              <div style={ld.eyebrow}>NOT</div>
              <div style={{ ...ld.cardTitle, marginBottom: 12 }}>Hızlı not</div>
              <textarea
                style={ld.textarea}
                value={note}
                onChange={e => setNote(e.target.value)}
                placeholder="Lead hakkında not ekle..."
              />
              <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: 10 }}>
                <button style={ld.btnDarkSm}>Kaydet</button>
              </div>
            </div>
          </aside>
        </section>
      </div>
    );
  }

  // ── App ────────────────────────────────────────────────────────────────────

  function App() {
    const [view,        setView]        = React.useState('cockpit');
    const [selectedIdx, setSelectedIdx] = React.useState(0);
    const [statuses,    setStatuses]    = React.useState(() => getStatuses());

    const sorted = React.useMemo(
      () => [...leads].sort((a, b) => b.scoring.score - a.scoring.score),
      []
    );

    function handleStatusChange(name, s) {
      setStatusLS(name, s);
      setStatuses(getStatuses());
    }

    if (view === 'detail') {
      const lead = sorted[selectedIdx];
      return (
        <LeadDetail
          lead={lead}
          idx={selectedIdx}
          total={sorted.length}
          status={statuses[lead.name] || 'yeni'}
          onStatusChange={s => handleStatusChange(lead.name, s)}
          onBack={() => setView('cockpit')}
          onPrev={() => setSelectedIdx(i => Math.max(0, i - 1))}
          onNext={() => setSelectedIdx(i => Math.min(sorted.length - 1, i + 1))}
        />
      );
    }

    return (
      <V1Plus
        leads={sorted}
        statuses={statuses}
        onSelect={i => { setSelectedIdx(i); setView('detail'); }}
        onStatusChange={handleStatusChange}
      />
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
