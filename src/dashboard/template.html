<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Zeplin Media · Lead Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root, [data-theme="dark"] {
      --accent: #c5f24a; --accent-ink: #12140a;
      --bg: #0a0a0b; --panel: #141418; --panel2: #17171c; --raised: #1c1c22;
      --line: rgba(255,255,255,0.07); --line2: rgba(255,255,255,0.12);
      --tx: #f3f3f0; --sub: #93938f; --muted: #5c5c5a;
      --glow: radial-gradient(1200px 600px at 78% -8%, rgba(197,242,74,0.06), transparent 60%);
      --r: 26px; --rs: 18px;
    }
    [data-theme="light"] {
      --accent: #c5f24a; --accent-ink: #12140a;
      --bg: #faf9f4; --panel: #ffffff; --panel2: #f3f1e9; --raised: #efece0;
      --line: #e9e4d6; --line2: #ddd6c2;
      --tx: #0c0b08; --sub: #4a4535; --muted: #8b856f;
      --glow: radial-gradient(1200px 600px at 78% -8%, rgba(197,242,74,0.14), transparent 60%);
    }
    html, body { min-height: 100vh; background: var(--bg); overflow-x: hidden; }
    body { font-family: 'Instrument Sans', system-ui, sans-serif; color: var(--tx); -webkit-font-smoothing: antialiased; background: var(--glow), var(--bg); transition: background-color .2s, color .2s; }
    #root { min-height: 100vh; display: flex; flex-direction: column; }
    button { font-family: inherit; }
    textarea, input, select { font-family: inherit; }
    a { text-decoration: none; color: inherit; }
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 99px; }
    ::-webkit-scrollbar-track { background: transparent; }
    .pipe-card.dragging { opacity: 0.4; }
    .pipe-col.drag-over { background: var(--raised); }
    .ll-row:hover { background: var(--raised); }
    .hide-sb { scrollbar-width: none; -ms-overflow-style: none; }
    .hide-sb::-webkit-scrollbar { display: none; }
    @keyframes zspin { to { transform: rotate(360deg); } }
    @media (max-width: 1080px) {
      .tb-search-label { display: none !important; }
      .tb-nav-item { padding: 9px 11px !important; font-size: 12px !important; }
    }
    @media (max-width: 760px) {
      .responsive-kpis, .responsive-main, .responsive-detail, .responsive-admin, .responsive-report {
        grid-template-columns: 1fr !important;
      }
      .responsive-stats { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
      .responsive-opportunity-columns { grid-template-columns: 1fr !important; }
      .responsive-main, .responsive-kpis, .responsive-detail, .responsive-admin, .responsive-report {
        padding-left: 14px !important;
        padding-right: 14px !important;
      }
      .responsive-table { overflow-x: auto !important; padding-left: 14px !important; padding-right: 14px !important; }
      .responsive-table-head, .responsive-table-row { min-width: 760px; }
      .responsive-pipeline { overflow-x: auto !important; padding-left: 14px !important; padding-right: 14px !important; }
      .responsive-pipeline > * { min-width: 270px; }
      .responsive-report > [style*="grid-column"] { grid-column: auto !important; }
    }
  </style>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('zeplin_theme');
        document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.28.4/babel.min.js" crossorigin></script>
</head>
<body>
  <div id="root"></div>

  <script>
    var BOOTSTRAP_LEADS = JSON.parse(atob('__DATA__'));
    var leads    = BOOTSTRAP_LEADS.slice();
    var services = JSON.parse(atob('__SERVICES__'));
    var STATUS_KEY   = 'zeplin_lead_statuses_v4';
    var OUTREACH_KEY = 'zeplin_outreach_v2';
    try {
      [
        'zeplin_lead_statuses_v1',
        'zeplin_lead_statuses_v2',
        'zeplin_lead_statuses_v3',
        'zeplin_outreach_v1',
      ].forEach(key => localStorage.removeItem(key));
    } catch(e) {}
    var remoteStatuses = {};
    var outreachEvents = [];
    var apiReady = false;
  </script>

  <script type="text/babel">
  // ── Helpers ────────────────────────────────────────────────────────────────

  function fmt(n) {
    if (n === null || n === undefined || n === '') return '—';
    const value = Number(n);
    if (!Number.isFinite(value)) return '—';
    if (value === 0) return '0';
    if (value >= 1000000) return (value / 1000000).toFixed(1) + 'M';
    if (value >= 1000) return Math.round(value / 1000) + 'K';
    return String(value);
  }

  function fmtDate(str) {
    if (!str) return '';
    try {
      const d = new Date(str.replace(' ', 'T'));
      if (isNaN(d)) return str;
      return d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', year: 'numeric' });
    } catch(e) { return str; }
  }

  function readLocalStatuses() {
    try { return JSON.parse(localStorage.getItem(STATUS_KEY) || '{}'); } catch(e) { return {}; }
  }
  function writeLocalStatuses(obj) {
    localStorage.setItem(STATUS_KEY, JSON.stringify(obj || {}));
  }
  function getStatuses() {
    return Object.assign({}, readLocalStatuses(), remoteStatuses);
  }
  function persistStatus(name, s) {
    if (!apiReady) return Promise.reject(new Error('api_not_ready'));
    return fetch('/api/status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, status: s }),
    }).then(res => {
      if (!res.ok) throw new Error('status_save_failed');
      return res.json();
    });
  }
  function setStatusLS(name, s) {
    const previous = remoteStatuses[name];
    remoteStatuses[name] = s;
    return persistStatus(name, s).catch(err => {
      if (previous === undefined) delete remoteStatuses[name];
      else remoteStatuses[name] = previous;
      throw err;
    });
  }

  function readLocalOutreach() {
    try { return JSON.parse(localStorage.getItem(OUTREACH_KEY) || '[]'); } catch(e) { return []; }
  }
  function normalizeOutreachEvent(item) {
    if (!item) return null;
    return {
      lead: item.lead || item.lead_name || '',
      action: item.action || 'note_added',
      date: item.date || item.happened_at || item.created_at || new Date().toISOString(),
      note: item.note || '',
      channel: item.channel || null,
      channelLabel: item.channel_label || null,
      outcome: item.outcome || null,
      outcomeLabel: item.outcome_label || null,
      followUpAt: item.follow_up_at || null,
      serviceSlugs: item.service_slugs || [],
      contactName: item.contact_name || null,
      ts: item.ts || item.id || Date.now(),
    };
  }
  function getOutreach() {
    return outreachEvents.length ? outreachEvents : readLocalOutreach().map(normalizeOutreachEvent).filter(Boolean);
  }
  function saveOutreach(arr) {
    outreachEvents = (arr || []).map(normalizeOutreachEvent).filter(Boolean);
    localStorage.setItem(OUTREACH_KEY, JSON.stringify(outreachEvents));
  }
  function getLeadEvents(name) {
    return getOutreach().filter(e => e.lead === name).sort((a, b) => b.date.localeCompare(a.date));
  }
  function persistOutreachEvent(evt) {
    if (!apiReady) return Promise.reject(new Error('api_not_ready'));
    return fetch('/api/outreach', {
      method: 'POST',
      keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        lead_name: evt.lead,
        action: evt.action,
        happened_at: evt.date,
        note: evt.note,
        channel: evt.channel,
        outcome: evt.outcome,
        follow_up_at: evt.followUpAt,
        service_slugs: evt.serviceSlugs,
        contact_name: evt.contactName,
        source: 'dashboard',
        idempotency_key: `dashboard-${evt.ts}`,
      }),
    }).then(res => {
      if (!res.ok) throw new Error('outreach_save_failed');
      return res.json();
    });
  }
  function addOutreach(name, action, date, note) {
    const evt = { lead: name, action, date, note, ts: Date.now() };
    return persistOutreachEvent(evt).then(() => {
      const arr = getOutreach();
      arr.push(evt);
      saveOutreach(arr);
      const act = ACTIONS[action];
      if (act && act.status) return setStatusLS(name, act.status);
    });
  }

  function saveContactResult(lead, values) {
    const evt = {
      lead: lead.name,
      action: 'contact_result_recorded',
      date: new Date().toISOString(),
      note: values.note || '',
      channel: values.channel,
      outcome: values.outcome,
      followUpAt: values.followUpAt || null,
      serviceSlugs: values.serviceSlugs || [],
      contactName: values.contactName || null,
      ts: Date.now(),
    };
    return persistOutreachEvent(evt).then(data => {
      const saved = normalizeOutreachEvent((data && data.event) || evt);
      const arr = getOutreach();
      arr.push(saved);
      saveOutreach(arr);
      if (data && data.status) remoteStatuses[lead.name] = data.status;
      return data;
    });
  }

  function applyRemoteLeads(rows) {
    if (!Array.isArray(rows)) return;
    leads = rows.slice();
    remoteStatuses = {};
    leads.forEach(l => { remoteStatuses[l.name] = l.status || 'yeni'; });
    writeLocalStatuses(getStatuses());
  }

  function applyRemoteOutreach(rows) {
    if (!Array.isArray(rows)) return;
    outreachEvents = rows.map(normalizeOutreachEvent).filter(Boolean);
    localStorage.setItem(OUTREACH_KEY, JSON.stringify(outreachEvents));
  }

  function fetchJSON(url, options) {
    const opts = { credentials: 'same-origin', ...(options || {}) };
    return fetch(url, opts).then(res => {
      if (!res.ok) {
        return res.json().catch(() => ({})).then(data => {
          throw new Error(data.error || `request_failed_${res.status}`);
        });
      }
      return res.json();
    });
  }

  function fetchAdminJSON(url, options) {
    const opts = { credentials: 'same-origin', ...(options || {}) };
    opts.headers = { 'Content-Type': 'application/json', ...((options || {}).headers || {}) };
    return fetch(url, opts).then(res => {
      if (!res.ok) {
        return res.json().catch(() => ({})).then(data => {
          throw new Error(data.error || `request_failed_${res.status}`);
        });
      }
      return res.json();
    });
  }

  function openExternal(url) {
    if (!url) return;
    window.open(url, '_blank', 'noopener,noreferrer');
  }

  function startLeadAction(lead) {
    const nextAction = lead.next_action || 'Sonraki aksiyon başlatıldı';
    const meta = getPrimaryActionMeta(lead);

    if (meta.intent === 'enrich' || meta.intent === 'verify') {
      openExternal(lead.maps_url || lead.website?.website_url || lead.social?.instagram_url);
      return addOutreach(
        lead.name,
        'data_enrichment_started',
        new Date().toISOString(),
        nextAction
      ).then(() => ({
        feedback: meta.intent === 'verify'
          ? 'Doğrulama kaynağı açıldı; uygun hizmeti görüşmede netleştir.'
          : 'Veri tamamlama aksiyonu kaydedildi.',
      }));
    }

    if (meta.intent === 'generate_ai') {
      return fetchJSON('/api/lead_ai', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: lead.name }),
      }).then(() => addOutreach(
        lead.name,
        'email_drafted',
        new Date().toISOString(),
        'AI ihtiyaç özeti ve e-posta taslağı üretildi'
      )).then(() => ({ feedback: 'AI raporu ve e-posta taslağı hazırlandı.' }));
    }

    if (meta.intent === 'draft' && lead.ai_email) {
      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(lead.ai_email).catch(() => {});
      }
      return addOutreach(
        lead.name,
        'email_drafted',
        new Date().toISOString(),
        'Hazır taslak panoya kopyalandı'
      ).then(() => ({ feedback: 'Mail taslağı panoya kopyalandı.' }));
    }

    if (meta.intent === 'call' && lead.phone) {
      window.location.href = `tel:${lead.phone.replace(/\s+/g, '')}`;
      return addOutreach(
        lead.name,
        'call_started',
        new Date().toISOString(),
        nextAction
      ).then(() => ({ feedback: 'Arama ekranı açıldı. Görüşme bitince sonucu ayrıca kaydet.' }));
    }

    return addOutreach(
      lead.name,
      'email_drafted',
      new Date().toISOString(),
      nextAction
    ).then(() => ({ feedback: 'Aksiyon kaydedildi.' }));
  }

  function openFixContext(lead, issue) {
    const target = issue?.source_url || lead.website?.website_url || lead.maps_url || lead.social?.instagram_url;
    const issueText = typeof issue === 'string'
      ? issue
      : [issue?.title, issue?.evidence, issue?.verification].filter(Boolean).join(' — ');
    if (issue && navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(`${lead.name}: ${issueText}`).catch(() => {});
    }
    if (target) {
      openExternal(target);
      return 'Doğrulama kaynağı yeni sekmede açıldı.';
    }
    return `${lead.name} için açılabilecek doğrulama kaynağı bulunamadı.`;
  }

  function createProposal(lead) {
    const recommendation = lead.recommended_package || {};
    const primary = (lead.matched_services || [])[0] || {};
    const evidence = (primary.evidence || recommendation.evidence || []).map(item => `- ${item}`).join('\n');
    const deliverables = (primary.deliverables || recommendation.deliverables || []).slice(0, 3).map(item => `- ${item}`).join('\n');
    const questions = (primary.discovery_questions || recommendation.discovery_questions || []).slice(0, 3).map(item => `- ${item}`).join('\n');
    const text = [
      `ZEPLIN MEDIA GÖRÜŞME HAZIRLIK NOTU`,
      `İşletme: ${lead.name}`,
      `Önerilen hizmet: ${recommendation.primary_service || recommendation.name || 'Görüşmede netleştirilecek'}`,
      `Durum: ${recommendation.stage || 'Keşif'}`,
      ``,
      `DOĞRULANAN AÇIKLAR`,
      evidence || `- Yeterli kanıt yok; önce veri doğrulanmalı.`,
      ``,
      `SUNABİLECEĞİMİZ İŞLER`,
      deliverables || `- İhtiyaç görüşmesinde netleştirilecek.`,
      ``,
      `GÖRÜŞMEDE SOR`,
      questions || `- İşletmenin öncelikli hedefi ve mevcut süreci nedir?`,
      ``,
      `Bu belge iç hazırlık notudur; müşteriye teklif olarak gönderilmez.`,
    ].join('\n');
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `${lead.name.replace(/[^\wçğıöşüÇĞİÖŞÜ-]+/g, '-')}-gorusme-notu.txt`;
    link.click();
    URL.revokeObjectURL(link.href);
    return addOutreach(lead.name, 'proposal_created', new Date().toISOString(), recommendation.name || 'Görüşme notu');
  }

  function initialsFor(value) {
    const parts = String(value || '').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return 'ZM';
    return parts.slice(0, 2).map(part => part.charAt(0).toUpperCase()).join('');
  }

  function roleLabel(role) {
    return role === 'admin' ? 'Patron' : 'Çalışan';
  }

  function roleTone(role) {
    return role === 'admin'
      ? { bg: 'var(--accent)', fg: 'var(--accent-ink)', bd: 'transparent' }
      : { bg: 'var(--raised)', fg: 'var(--sub)', bd: 'var(--line)' };
  }

  function searchLeads(rows, query) {
    const term = String(query || '').trim().toLocaleLowerCase('tr-TR');
    if (!term) return rows.slice(0, 8);
    return rows.filter(lead => {
      const haystack = [
        lead.name,
        lead.city,
        lead.category,
        lead.sector,
        lead.next_action,
        lead.phone,
        lead.address,
        ...(lead.audit_findings || []).map(item => `${item.title || ''} ${item.evidence || ''}`),
        ...(lead.matched_services || []).map(item => item.name),
      ].filter(Boolean).join(' ').toLocaleLowerCase('tr-TR');
      return haystack.includes(term);
    }).slice(0, 12);
  }

  const ACTIONS = {
    data_enrichment_started: { label: 'Veri Tamamlama Başladı', icon: '🧭', status: null },
    email_drafted:      { label: 'Mail Taslağı Hazır', icon: '📝', status: null },
    outreach_review_started: { label: 'Aksiyon İnceleniyor', icon: '🗂️', status: null },
    email_sent:        { label: 'Mail Gönderildi',   icon: '✉️', status: 'contacted' },
    reply_received:    { label: 'Cevap Alındı',       icon: '💬', status: 'contacted' },
    call_started:      { label: 'Arama Başlatıldı',   icon: '📞', status: null },
    call_completed:    { label: 'Arama Tamamlandı',   icon: '📞', status: 'contacted' },
    contact_result_recorded: { label: 'Temas Sonucu Kaydedildi', icon: '✓', status: null },
    follow_up_scheduled:{ label: 'Takip Planlandı',    icon: '📅', status: 'follow_up' },
    note_added:        { label: 'Not Eklendi',         icon: '📝', status: null },
    proposal_created:  { label: 'Teklif Taslağı Hazır',icon: '📄', status: null },
    proposal_sent:     { label: 'Teklif Gönderildi',    icon: '📤', status: 'contacted' },
    deal_won:          { label: 'Anlaşma Yapıldı 🎉', icon: '🎉', status: 'converted' },
    deal_lost:         { label: 'Anlaşma Düştü',      icon: '❌', status: 'lost' },
  };

  const PIPE_STAGES = [
    { key: 'new',      label: 'Yeni',              color: '#93938f', actions: [] },
    { key: 'enrich',   label: 'Veri Tamamlama',    color: '#ffb36b', actions: ['data_enrichment_started'] },
    { key: 'draft',    label: 'Taslak Hazır',      color: '#76a6ff', actions: ['email_drafted'] },
    { key: 'contacted',label: 'Temasta',           color: '#b9a8ff', actions: [] },
    { key: 'meeting',  label: 'Takip',             color: '#ff9f43', actions: ['follow_up_scheduled'] },
    { key: 'won',      label: 'Kazanıldı',         color: '#7ce2b5', actions: ['deal_won'] },
    { key: 'lost',     label: 'Kaybedildi',        color: '#ff6770', actions: ['deal_lost'] },
  ];

  function getPipelineStage(lead) {
    const st = getStatuses()[lead.name] || 'yeni';
    if (st === 'converted') return 'won';
    if (st === 'lost') return 'lost';
    if (st === 'follow_up') return 'meeting';
    if (st === 'missing_info') return 'enrich';
    if (st === 'ready') return 'draft';
    const evs = getLeadEvents(lead.name);
    const last = evs.find(e => !['note', 'note_added'].includes(e.action));
    if (!last) return st === 'contacted' ? 'contacted' : 'new';
    const map = { data_enrichment_started: 'enrich', email_drafted: 'draft', draft_prepared: 'draft', outreach_review_started: 'draft', email_sent: 'contacted', reply_received: 'contacted', call_completed: 'contacted', call_made: 'contacted',
                  follow_up_scheduled: 'meeting', meeting_scheduled: 'meeting', deal_won: 'won', deal_lost: 'lost' };
    return map[last.action] || (st === 'contacted' ? 'contacted' : 'new');
  }

  function hasContactInfo(lead) {
    const researchEmails = lead.research?.website?.emails || [];
    const verifiedInstagram = lead.social?.has_instagram === true
      && Number(lead.social?.identity_confidence || 0) >= 70;
    return Boolean(lead.phone || researchEmails.length || verifiedInstagram);
  }

  function needsContactCompletion(lead) {
    const nextAction = lead.next_action || '';
    return /telefon|adres/i.test(nextAction) || !hasContactInfo(lead);
  }

  function getPrimaryActionMeta(lead) {
    if (needsContactCompletion(lead)) {
      return {
        label: 'Veriyi tamamla',
        helper: 'Maps ya da siteyi açar; pipeline durumu değişmez.',
        intent: 'enrich',
      };
    }
    if (!lead.matched_services || !lead.matched_services.length) {
      return {
        label: 'İhtiyacı doğrula',
        helper: 'Kaynağı açar; kanıt olmadan hizmet veya AI taslağı üretmez.',
        intent: 'verify',
      };
    }
    if (!lead.ai_report) {
      return {
        label: 'İhtiyaç raporu üret',
        helper: 'Kanıtlanan açık ve eşleşen hizmetten araştırma raporu; kanıt yeterliyse e-posta taslağı oluşturur.',
        intent: 'generate_ai',
      };
    }
    if (lead.ai_email) {
      return {
        label: 'Taslağı kopyala',
        helper: 'Hazır e-postayı panoya kopyalar; otomatik göndermez.',
        intent: 'draft',
      };
    }
    if (lead.phone) {
      return {
        label: 'Telefonu aç',
        helper: 'Mail için güçlü kanıt yok; raporu kullanarak telefon görüşmesi yap.',
        intent: 'call',
      };
    }
    return {
      label: 'Aksiyonu kaydet',
      helper: 'Sadece takip icin aktivite olusturur.',
      intent: 'review',
    };
  }

  function getLeadReadiness(lead) {
    const scoreStatus = lead.scoring?.score_status || 'insufficient';
    return [
      { label: 'İletişim kanalı', ready: hasContactInfo(lead) },
      { label: 'Denetim kanıtı', ready: scoreStatus !== 'insufficient' && Boolean(lead.audit_findings?.length) },
      { label: 'AI raporu', ready: Boolean(lead.ai_report) },
      { label: 'Kanıtlı hizmet', ready: Boolean(lead.matched_services?.length) },
    ];
  }

  function triggerQuickLeadAction(lead) {
    const meta = getPrimaryActionMeta(lead);
    if (meta.intent === 'call' && lead.phone) {
      openExternal(`tel:${lead.phone.replace(/\s+/g, '')}`);
      return;
    }
    if (meta.intent === 'draft' && lead.ai_email && navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(lead.ai_email).catch(() => {});
      return;
    }
    if (meta.intent === 'enrich') {
      openExternal(lead.maps_url || lead.website?.website_url || lead.social?.instagram_url);
      return;
    }
    openExternal(lead.website?.website_url || lead.maps_url || lead.social?.instagram_url);
  }

  function getDailyTasks(arr, statuses) {
    return arr
      .filter(lead => (statuses[lead.name] || 'yeni') !== 'converted')
      .slice()
      .sort((a, b) => {
        const delta = (b.sales_priority_score || 0) - (a.sales_priority_score || 0);
        if (delta !== 0) return delta;
        return (b.estimated_value_tl || 0) - (a.estimated_value_tl || 0);
      })
      .slice(0, 5)
      .map(lead => {
        const meta = getPrimaryActionMeta(lead);
        let reason = 'Sonraki adim belirginlestirilmeli.';
        if (needsContactCompletion(lead)) {
          reason = 'Temas öncesi telefon veya adres eksigi kapatilmali.';
        } else if (lead.phone) {
          reason = 'Telefon bilgisi hazir; bugun sicak temas kurulabilir.';
        } else if (lead.ai_email) {
          reason = 'Taslak hazir; gonderim oncesi son kontrol yeterli.';
        }
        return { lead, meta, reason };
      });
  }

  function issueToSeverity(text) {
    if (!text) return 'Bilgi';
    const t = text.toLowerCase();
    if (t.includes('ssl') || t.includes('https')) return 'Kritik';
    if (t.includes('web sitesi yok') || t.includes('website yok') || t.includes('site yok')) return 'Yüksek';
    if (t.includes('schema') || t.includes('og') || t.includes('open graph')) return 'Orta';
    if (t.includes('telefon') || t.includes('adres') || t.includes('tamamla') || t.includes('instagram yok')) return 'Düşük';
    return 'Bilgi';
  }

  function findingSeverity(finding) {
    const severity = finding?.severity;
    return ({ critical: 'Kritik', high: 'Yüksek', medium: 'Orta', low: 'Düşük' })[severity]
      || issueToSeverity(finding?.title || String(finding || ''));
  }

  function scoreIsAvailable(lead) {
    return (lead?.scoring?.score_status || 'insufficient') !== 'insufficient';
  }

  function verifiedInstagram(lead) {
    return lead?.social?.has_instagram === true
      && Number(lead?.social?.identity_confidence || 0) >= 70;
  }

  function scoreDash(score) { return 326.7 * (1 - score / 100); }

  function computeKPIs(arr) {
    const total = arr.length || 1;
    return {
      packagedCount: arr.filter(l => l.matched_services && l.matched_services.length > 0).length,
      packagedPct:   Math.round(arr.filter(l => l.matched_services && l.matched_services.length > 0).length / total * 100),
      phoneCount:    arr.filter(l => l.phone).length,
      phonePct:      Math.round(arr.filter(l => l.phone).length / total * 100),
      aiCount:       arr.filter(l => l.ai_report).length,
      aiPct:         Math.round(arr.filter(l => l.ai_report).length / total * 100),
      auditCount:    arr.filter(l => (l.audit_findings || []).length > 0).length,
      auditPct:      Math.round(arr.filter(l => (l.audit_findings || []).length > 0).length / total * 100),
    };
  }

  function computeTabCounts(arr, statuses) {
    return {
      total:     arr.length,
      yeni:      arr.filter(l => (statuses[l.name] || 'yeni') === 'yeni').length,
      contacted: arr.filter(l => statuses[l.name] === 'contacted').length,
      converted: arr.filter(l => statuses[l.name] === 'converted').length,
      low:       arr.filter(l => scoreIsAvailable(l) && l.scoring.score < 50).length,
    };
  }

  function computeReadinessBuckets(arr) {
    return {
      readyToCall: arr.filter(lead => Boolean(lead.phone)).length,
      needsData: arr.filter(lead => needsContactCompletion(lead)).length,
      proposalReady: arr.filter(lead => Boolean(lead.ai_report) && Boolean(lead.ai_email) && Boolean(lead.matched_services?.length)).length,
    };
  }

  function ScoreRing({ score, grade, scoreStatus = 'reliable', size = 56, stroke = 4 }) {
    const available = scoreStatus !== 'insufficient';
    const r = (size - stroke) / 2;
    const c = 2 * Math.PI * r;
    const off = available ? c * (1 - Math.min(Math.max(score || 0, 0), 100) / 100) : c;
    return (
      <div style={{ position: 'relative', width: size, height: size, flexShrink: 0 }}>
        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ transform: 'rotate(-90deg)' }}>
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--line2)" strokeWidth={stroke}/>
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={available ? gradeColor(grade) : 'var(--muted)'} strokeWidth={stroke} strokeLinecap="round" strokeDasharray={c} strokeDashoffset={off} style={{ transition: 'stroke-dashoffset .9s cubic-bezier(.22,1,.36,1)' }}/>
        </svg>
        <div style={{ position: 'absolute', inset: 0, display: 'grid', placeItems: 'center' }}>
          <span style={{ fontFamily: "'Space Grotesk'", fontSize: size >= 70 ? 22 : (size >= 50 ? 15 : 13), fontWeight: 700, color: 'var(--tx)' }}>{available ? score : '—'}</span>
        </div>
      </div>
    );
  }

  function auditFor(l) {
    const yes = { bg: 'rgba(182,242,74,0.16)', fg: '#b6f24a', mark: '✓' };
    const no  = { bg: 'rgba(255,107,107,0.14)', fg: '#ff8f8f', mark: '✕' };
    const unknown = { bg: 'var(--raised)', fg: 'var(--muted)', mark: '?' };
    const preferred = [
      'website.presence',
      'identity.website_name',
      'website.https',
      'website.viewport',
      'seo.indexable',
      'seo.schema',
      'social.instagram_presence',
      'maps.reputation',
    ];
    const checks = l.audit_checks || [];
    return preferred
      .map(code => checks.find(check => check.code === code))
      .filter(Boolean)
      .slice(0, 6)
      .map(check => ({
        label: check.label,
        note: check.note,
        ...(check.status === 'pass' ? yes : check.status === 'fail' ? no : unknown),
      }));
  }

  function chipsFor(l) {
    const base = { display: 'inline-flex', alignItems: 'center', gap: 5, fontSize: 11.5, fontWeight: 500, padding: '5px 11px', borderRadius: 999, whiteSpace: 'nowrap' };
    const on  = { ...base, background: 'var(--panel2)', border: '1px solid var(--line)', color: 'var(--sub)' };
    const off = { ...base, background: 'transparent', border: '1px dashed var(--line2)', color: 'var(--muted)' };
    const w = l.website || {}, s = l.social || {};
    const chips = [];
    const webAbsent = (l.audit_findings || []).some(f => ['website.absent','website.invalid_candidate'].includes(f.code));
    chips.push(w.has_website
      ? { label: (w.website_url||'').replace(/^https?:\/\//,'').replace(/\/$/,''), dot: true, style: on }
      : { label: webAbsent ? 'Web yok' : 'Web doğrulanmadı', dot: false, style: off });
    chips.push(verifiedInstagram(l) ? { label: '@'+(s.instagram_username||'instagram'), dot: true, style: on } : { label: 'Instagram doğrulanmadı', dot: false, style: off });
    if (l.maps_url) chips.push({ label: 'Google Maps', dot: true, style: on });
    return chips;
  }

  function computeWeekBuckets(leads) {
    const now = new Date();
    const buckets = new Array(8).fill(0);
    leads.forEach(l => {
      if (!l.last_analyzed) return;
      const d = new Date(l.last_analyzed.replace(' ', 'T'));
      if (isNaN(d)) return;
      const diffDays = Math.floor((now - d) / 86400000);
      const weekIdx = Math.floor(diffDays / 7);
      if (weekIdx >= 0 && weekIdx < 8) buckets[7 - weekIdx] += 1;
    });
    return buckets;
  }

  function mostCommonCity(leads) {
    const counts = {};
    leads.forEach(l => { if (l.city) counts[l.city] = (counts[l.city]||0) + 1; });
    const entries = Object.entries(counts).sort((a,b) => b[1]-a[1]);
    return entries.length ? entries[0][0] : '';
  }

  function exportLeadsCSV(leads) {
    const cols = ['name','city','category','scoring.score','scoring.grade','estimated_value_tl','sales_priority_score','phone'];
    const get = (obj, path) => path.split('.').reduce((o,k) => (o||{})[k], obj);
    const header = ['İşletme','Şehir','Kategori','Skor','Sınıf','Tahmini Değer','Öncelik','Telefon'];
    const rows = leads.map(l => cols.map(c => { const v = get(l, c); return v === undefined || v === null ? '' : String(v).replace(/"/g,'""'); }));
    const csv = [header, ...rows].map(r => r.map(v => `"${v}"`).join(',')).join('\n');
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'zeplin-leadler.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function tomorrowAtTen() {
    const date = new Date();
    date.setDate(date.getDate() + 1);
    date.setHours(10, 0, 0, 0);
    const pad = value => String(value).padStart(2, '0');
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
  }

  function isToday(value) {
    if (!value) return false;
    const date = new Date(value);
    const now = new Date();
    return date.getFullYear() === now.getFullYear()
      && date.getMonth() === now.getMonth()
      && date.getDate() === now.getDate();
  }

  function latestContactResult(leadName) {
    return getLeadEvents(leadName).find(event => event.action === 'contact_result_recorded') || null;
  }

  function taskMetaForLead(lead) {
    const last = latestContactResult(lead.name);
    const followUp = last?.followUpAt ? new Date(last.followUpAt) : null;
    const now = new Date();
    const due = followUp && followUp <= now;
    const dueToday = followUp && isToday(followUp);
    const assignmentDue = lead.assignment_due_at ? new Date(lead.assignment_due_at) : null;
    let rank = 40;
    let label = 'İlk temas bekliyor';
    let detail = lead.priority_reason || 'Lead’i incele ve ilk teması gerçekleştir.';
    if (due) {
      rank = 100;
      label = dueToday ? 'Bugün takip' : 'Takip gecikti';
      detail = `${last.outcomeLabel || 'Önceki temas'} sonrası yeniden iletişime geç.`;
    } else if (assignmentDue && assignmentDue <= now) {
      rank = 80;
      label = 'Atama tarihi geldi';
      detail = lead.priority_reason || 'Atanan lead için aksiyon bekleniyor.';
    } else if (last) {
      rank = 25;
      label = last.outcomeLabel || 'Sonuç kaydedildi';
      detail = followUp
        ? `Takip: ${followUp.toLocaleString('tr-TR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}`
        : 'Yeni aksiyon için lead detayını kontrol et.';
    }
    return {
      rank: rank + Number(lead.sales_priority_score || 0) / 100,
      label,
      detail,
      followUp,
      completedToday: Boolean(last && isToday(last.date)),
    };
  }

  function CockpitMain({ leads, statuses, onSelect, onOpenAdmin, user, summary }) {
    const [filter, setFilter] = React.useState('hepsi');
    const [selectedName, setSelectedName] = React.useState(leads[0]?.name);

    React.useEffect(() => {
      if (!leads.some(l => l.name === selectedName)) setSelectedName(leads[0]?.name);
    }, [leads]);

    const filtered = React.useMemo(() => filterLeads(leads, filter), [leads, filter]);
    const selected = leads.find(l => l.name === selectedName) || leads[0];
    const selIdx   = leads.indexOf(selected);

    const totalVal  = leads.reduce((s, l) => s + (l.estimated_value_tl || 0), 0);
    const avgScore  = Math.round(leads.reduce((s, l) => s + (l.scoring?.score || 0), 0) / (leads.length || 1));
    const gradeA    = leads.filter(l => l.scoring.grade === 'A').length;
    const assignedCount = summary?.assigned_count ?? leads.filter(l => l.assigned_to || l.assigned_user_id).length;
    const todayCalls = summary?.today_call_count ?? 0;
    const converted = summary?.won_count ?? leads.filter(l => statuses[l.name] === 'converted').length;
    const followUps = summary?.follow_up_count ?? 0;
    const weekBuckets = React.useMemo(() => computeWeekBuckets(leads), [leads]);
    const weekMax = Math.max(...weekBuckets, 1);
    const topCity = React.useMemo(() => mostCommonCity(leads), [leads]);
    const dateStr = React.useMemo(() => new Date().toLocaleDateString('tr-TR', { day: '2-digit', month: 'long', year: 'numeric' }), []);

    const kpis = [
      { label: user?.role === 'admin' ? 'Atanan Lead' : 'Bana Atanan', value: String(assignedCount || leads.length), delta: `${leads.length} aktif kayıt`, dot: 'var(--accent)' },
      { label: 'Bugünkü Arama', value: String(todayCalls),    delta: 'gerçek aktivite',  dot: '#ffcf4a' },
      { label: 'Takip Bekleyen',value: String(followUps),     delta: 'yeniden temas',    dot: '#7cc5ff' },
      { label: 'Kazanılan',     value: String(converted),     delta: 'müşteri oldu',     dot: '#b6f24a' },

    return (

  function sevStyle(s) {
    return ({ Kritik: { background: 'rgba(255,107,107,0.14)', color: '#ff8f8f' }, Yüksek: { background: 'rgba(255,159,67,0.14)', color: '#ffb36b' }, Orta: { background: 'rgba(255,207,74,0.14)', color: '#ffcf4a' }, Düşük: { background: 'rgba(124,197,255,0.14)', color: '#7cc5ff' }, Bilgi: { background: 'var(--raised)', color: 'var(--sub)' } })[s] || { background: 'var(--raised)', color: 'var(--sub)' };
  }

  function LeadDetail({ lead, idx, total, status, onStatusChange, onBack, onPrev, onNext, onDataChange, onOpenResult }) {
    const [showReport, setShowReport] = React.useState(false);
    const [showEmail,  setShowEmail]  = React.useState(false);
    const [copied,     setCopied]     = React.useState(false);
    const [note,       setNote]       = React.useState('');
    const [feedback,   setFeedback]   = React.useState('');
    const [busy,       setBusy]       = React.useState(false);
    const findings   = lead.audit_findings || [];
    const opportunityFindings = findings.filter(finding => finding.finding_type === 'opportunity');
    const gapFindings = findings.filter(finding => finding.finding_type !== 'opportunity');
    const unknownChecks = (lead.audit_checks || []).filter(check => check.status === 'unknown');
    const serviceMatches = lead.matched_services || [];
    const discoveryMatches = lead.discovery_services || [];
    const displayedServices = serviceMatches.length > 0 ? serviceMatches : discoveryMatches;
    const hasRecommendation = displayedServices.length > 0;
    const isDiscoveryOnly = serviceMatches.length === 0;
    const svc = lead.recommended_package || {};
    const events     = getLeadEvents(lead.name);
    const actionMeta = getPrimaryActionMeta(lead);
    const readiness  = getLeadReadiness(lead);
    const lastEvent  = events[0] || null;
    const socialVerified = verifiedInstagram(lead);
    const socialStatsVerified = socialVerified
      && lead.social?.stats?.lookup_status === 'found';
    const scoreAvailable = scoreIsAvailable(lead);
    const playbook = lead.sales_playbook || {};

    React.useEffect(() => {
      if (!feedback) return;
      const timer = setTimeout(() => setFeedback(''), 2400);
      return () => clearTimeout(timer);
    }, [feedback]);

    function copyEmail() {
      navigator.clipboard.writeText(lead.ai_email || '').then(() => {
        return addOutreach(lead.name, 'email_drafted', new Date().toISOString(), 'Taslak panoya kopyalandı');
      }).then(() => { setCopied(true); setTimeout(() => setCopied(false), 2000); });
    }

    function copySalesText(text, label) {
      if (!text || !navigator.clipboard?.writeText) return;
      navigator.clipboard.writeText(text).then(() => setFeedback(`${label} kopyalandı.`));
    }

    function saveNote() {
      const value = note.trim();
      if (!value) return;
      setBusy(true);
      addOutreach(lead.name, 'note_added', new Date().toISOString(), value).then(() => {
        setFeedback('Not kaydedildi.');
      }).catch(() => {
        setFeedback('Not kaydedilemedi. Bağlantıyı kontrol et.');
      }).finally(() => {
        setBusy(false);
        setNote('');
        if (onDataChange) onDataChange();
      });
    }

    function skipLead() {
      onNext();
    }

    function handlePrimaryAction() {
      setBusy(true);
      startLeadAction(lead).then(result => {
        setFeedback((result && result.feedback) || 'Aksiyon kaydedildi.');
      }).catch(() => {
        setFeedback('Aksiyon kaydedilemedi. Bağlantıyı kontrol et.');
      }).finally(() => {
        setBusy(false);
        if (onDataChange) onDataChange();
      });
    }

    return (

            <span style={ld.crumbSep}>/</span>
            <span style={{ ...ld.crumb, color: 'var(--tx)', fontWeight: 600 }}>{lead.name}</span>
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            <button style={{ ...ld.btnGhost, opacity: idx === 0 ? 0.4 : 1 }} onClick={onPrev} disabled={idx === 0}>← Önceki</button>
            <button style={{ ...ld.btnGhost, opacity: idx === total-1 ? 0.4 : 1 }} onClick={onNext} disabled={idx === total-1}>Sonraki →</button>
            <button style={ld.btnDark} onClick={onBack}>← Workspace</button>
          </div>
        </header>

        <section style={ld.hero}>
          <div style={ld.heroLeft}>
            <div style={ld.statusRow}>
              <span style={ld.statusBadge}>● {(status || 'yeni').toUpperCase()}</span>
              {(lead.category || lead.sector) && <span style={ld.metaTag}>{lead.category || lead.sector}</span>}
              {lead.city && <span style={ld.metaTag}>{lead.city}</span>}
              {lead.last_analyzed && <span style={ld.metaText}>Son analiz · {fmtDate(lead.last_analyzed)}</span>}

            <h1 style={ld.h1}>{lead.name}</h1>
            <div style={ld.urls}>
              {lead.website?.website_url && <a href={lead.website.website_url} target="_blank" rel="noopener noreferrer" style={ld.urlChip}>{lead.website.website_url.replace(/^https?:\/\//, '').replace(/\/$/, '')} ↗</a>}
              {socialVerified && lead.social?.instagram_url && <a href={lead.social.instagram_url} target="_blank" rel="noopener noreferrer" style={ld.urlChip}>@{lead.social.instagram_username || 'instagram'} ↗</a>}
              {lead.maps_url && <a href={lead.maps_url} target="_blank" rel="noopener noreferrer" style={ld.urlChip}>Google Maps ↗</a>}
              {lead.phone && <span style={ld.urlChip}>{lead.phone}</span>}

              {lead.website?.website_url && <button style={ld.quickBtn} onClick={() => openExternal(lead.website.website_url)}>Siteyi aç</button>}
              {socialVerified && lead.social?.instagram_url && <button style={ld.quickBtn} onClick={() => openExternal(lead.social.instagram_url)}>Instagram aç</button>}

            </div>

          <div style={ld.heroRight}>

          </div>
        </section>

        {lead.next_action && (
          <div style={ld.nextAction}>
            <div>
              <div style={ld.naEyebrow}>SONRAKİ EN İYİ AKSİYON · ÖNCELİK {lead.sales_priority_score || '—'}</div>

              {lead.priority_reason && <div style={ld.naDesc}>{lead.priority_reason}</div>}

              {feedback && <div style={ld.inlineFeedback}>{feedback}</div>}

            <div style={{ display: 'flex', gap: 8 }}>
              <button style={{ ...ld.btnGhost, opacity: busy ? 0.7 : 1 }} onClick={skipLead} disabled={busy}>Atla</button>

          </div>

        <section className="responsive-detail" style={ld.cols}>
          <div>
            <div style={ld.statsCard}>
              <div style={ld.statsHeader}><div style={ld.eyebrow}>SOSYAL SİNYALLER</div><div style={ld.cardTitle}>Etkileşim ve büyüme</div></div>

                {[
                  ['Instagram', socialVerified ? 'Doğrulandı' : 'Doğrulanmadı'],

                  ['Gönderi',   socialStatsVerified && lead.social?.stats?.post_count !== null ? String(lead.social.stats.post_count) : '—'],
                  ['Ort. beğeni',socialStatsVerified && lead.social?.stats?.avg_likes !== null ? String(lead.social.stats.avg_likes) : '—'],

                    <div style={ld.cardTitle}>Bu işletmeyle nasıl konuşacağız?</div>
                  </div>
                  <span style={playbook.discovery_only ? ld.discoveryBadge : ld.verifiedBadge}>
                    {playbook.discovery_only ? 'Keşif görüşmesi' : 'Kanıta dayalı'}
                  </span>
                </div>
                <div style={ld.salesSummary}>{playbook.summary}</div>
                {(playbook.evidence_points || []).length > 0 && (
                  <div style={ld.salesEvidenceGrid}>
                    {playbook.evidence_points.slice(0, 3).map((item, itemIndex) => (
                      <div key={`${item.title}-${itemIndex}`} style={ld.salesEvidence}>
                        <div style={ld.miniLabel}>KANIT {itemIndex + 1}</div>
                        <strong>{item.title}</strong>
                        <span>{item.evidence}</span>
                      </div>

                  </div>

                <div style={ld.callScript}>
                  <div style={ld.miniLabel}>ARAMAYA BÖYLE BAŞLA</div>
                  <div style={ld.callScriptText}>“{playbook.call_opener}”</div>
                  <button style={ld.findBtn} onClick={() => copySalesText(playbook.call_opener, 'Arama metni')}>Kopyala</button>
                </div>
                <div className="responsive-opportunity-columns" style={ld.scriptGrid}>
                  <div style={{ ...ld.scriptPanel, margin: 0 }}>
                    <div style={ld.miniLabel}>WHATSAPP</div>
                    <div style={ld.scriptText}>{playbook.whatsapp_message}</div>
                    <button style={ld.findBtn} onClick={() => copySalesText(playbook.whatsapp_message, 'WhatsApp metni')}>Kopyala</button>
                  </div>
                  <div style={{ ...ld.scriptPanel, margin: 0 }}>
                    <div style={ld.miniLabel}>INSTAGRAM DM</div>
                    <div style={ld.scriptText}>{playbook.instagram_dm}</div>
                    <button style={ld.findBtn} onClick={() => copySalesText(playbook.instagram_dm, 'Instagram mesajı')}>Kopyala</button>
                  </div>
                </div>
                <div style={ld.scriptPanel}>
                  <div style={ld.miniLabel}>E-POSTA</div>
                  <div style={{ ...ld.scriptText, whiteSpace: 'pre-wrap' }}><strong>{playbook.email_subject}</strong>{'\n\n'}{playbook.email_body}</div>
                  <button style={ld.findBtn} onClick={() => copySalesText(`Konu: ${playbook.email_subject}\n\n${playbook.email_body}`, 'E-posta taslağı')}>Kopyala</button>
                </div>
                <div className="responsive-opportunity-columns" style={ld.scriptGrid}>
                  <div>
                    <div style={ld.miniLabel}>GÖRÜŞMEDE SOR</div>
                    <ul style={ld.cleanList}>
                      {(playbook.discovery_questions || []).slice(0, 4).map((item, itemIndex) => <li key={itemIndex}>{item}</li>)}
                    </ul>
                  </div>
                  <div>
                    <div style={ld.miniLabel}>İTİRAZA HAZIRLIK</div>
                    {(playbook.objection_responses || []).slice(0, 3).map((item, itemIndex) => (
                      <div key={itemIndex} style={ld.objectionRow}><strong>{item.objection}</strong><span>{item.response}</span></div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {hasRecommendation ? (
              <div style={ld.packCard}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 16 }}>
                  <div style={{ flex: 1 }}>
                    <div style={ld.eyebrow}>{isDiscoveryOnly ? 'GÖRÜŞMEDE DOĞRULA' : 'BİRİNCİL HİZMET ÖNERİSİ'}</div>
                    <h3 style={ld.packTitle}>{svc.primary_service || svc.name}</h3>
                    <div style={ld.packDesc}>{svc.summary || 'Öneri, doğrulanan tarama sinyallerine dayanır.'}</div>
                  </div>
                  <span style={svc.requires_discovery ? ld.discoveryBadge : ld.verifiedBadge}>
                    {svc.requires_discovery ? 'Görüşmede doğrula' : 'Kanıtlandı'}
                  </span>
                </div>
                <div style={ld.packTags}>
                  {(svc.evidence || []).map((item, i) => <span key={i} style={ld.tagPrimary}>{item}</span>)}
                </div>
              </div>
            ) : (
              <div style={{ ...ld.packCard, background: 'var(--panel2)' }}>
                <div style={ld.eyebrow}>HİZMET ÖNERİSİ</div>
                <div style={{ fontSize: 14, color: 'var(--sub)', marginTop: 8 }}>
                  Henüz doğrudan satış iddiası oluşturacak bir açık doğrulanmadı. Sektöre uygun keşif sorularını kullan.
                </div>
              </div>

            {hasRecommendation && (
              <div style={ld.opportunitySection}>
                <div style={ld.findHeader}>

                  </div>
                  <span style={ld.countBadge}>{isDiscoveryOnly ? `${displayedServices.length} keşif başlığı` : `${serviceMatches.length} hizmet sinyali`}</span>
                </div>
                {displayedServices.slice(0, 4).map((service, serviceIndex) => (
                  <div key={service.slug || serviceIndex} style={ld.opportunityRow}>
                    <div style={ld.opportunityTop}>
                      <div>
                        <div style={ld.opportunityIndex}>0{serviceIndex + 1} · {service.category || 'Hizmet'}</div>
                        <div style={ld.opportunityTitle}>{service.name}</div>
                        <div style={ld.opportunityDesc}>{service.desc}</div>
                      </div>
                      <span style={service.requires_discovery ? ld.discoveryBadge : ld.verifiedBadge}>
                        {service.requires_discovery ? 'Kontrol et' : `%${service.confidence || 0} güven`}
                      </span>
                    </div>

                    <div className="responsive-opportunity-columns" style={ld.opportunityColumns}>
                      {(service.evidence || []).length > 0 && <div>
                        <div style={ld.miniLabel}>TESPİT EDİLEN AÇIK</div>
                        <div style={ld.evidenceList}>
                          {(service.evidence || []).map((item, i) => (
                            <div key={i} style={ld.evidenceItem}><span style={ld.evidenceDot}></span>{item}</div>
                          ))}
                        </div>
                      </div>}
                      <div>
                        <div style={ld.miniLabel}>BİZ NE TESLİM EDERİZ?</div>
                        <ul style={ld.cleanList}>
                          {(service.deliverables || []).slice(0, 3).map((item, i) => <li key={i}>{item}</li>)}
                        </ul>
                      </div>
                    </div>

                    {(service.discovery_questions || []).length > 0 && (
                      <div style={ld.discoveryBox}>
                        <div style={ld.miniLabel}>GÖRÜŞMEDE SOR</div>
                        <div style={ld.questionList}>
                          {(service.discovery_questions || []).slice(0, 3).map((item, i) => (
                            <span key={i} style={ld.questionChip}>{item}</span>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            )}

            <div style={ld.findCard}>
              <div style={ld.findHeader}>
                <div style={{ display: 'flex', justifyContent: 'space-between', gap: 16, alignItems: 'flex-end' }}>
                  <div>
                    <div style={ld.eyebrow}>TARAMA BULGULARI VE FIRSATLAR</div>
                    <div style={ld.cardTitle}>{findings.length > 0 ? `${gapFindings.length} açık · ${opportunityFindings.length} büyüme fırsatı` : 'Kanıtlı açık yok'}</div>

                  <span style={ld.countBadge}>%{lead.scoring?.coverage || 0} kapsam · %{lead.scoring?.confidence || 0} güven</span>
                </div>
              </div>
              {findings.length === 0
                ? <div style={{ padding: '16px 24px', color: 'var(--sub)', fontSize: 13, lineHeight: 1.6 }}>
                    Bu “sorun yok” anlamına gelmez. {unknownChecks.length} kontrol henüz güvenilir biçimde tamamlanamadı.
                  </div>
                : findings.map((finding, i) => {
                    const sev = findingSeverity(finding);
                    return (
                      <div key={finding.code || i} style={{ ...ld.findRow, alignItems: 'flex-start' }}>
                        <div style={{ ...ld.sevPill, ...sevStyle(sev) }}>{finding.finding_type === 'opportunity' ? 'Fırsat' : sev}</div>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={ld.findTitle}>{finding.title}</div>
                          <div style={ld.findEvidence}><strong>Kanıt:</strong> {finding.evidence}</div>
                          <div style={ld.findImpact}><strong>İş etkisi:</strong> {finding.impact}</div>
                          {finding.talking_point && <div style={ld.talkingPoint}>Görüşmede söyle: “{finding.talking_point}”</div>}
                          {finding.verification && <div style={ld.verifyText}>Teyit: {finding.verification}</div>}
                        </div>
                        <div style={{ display: 'flex', flexDirection: 'column', gap: 8, alignItems: 'flex-end' }}>
                          <span style={ld.confidenceBadge}>%{finding.confidence || 0} güven</span>
                          <button style={ld.findBtn} onClick={() => setFeedback(openFixContext(lead, finding))}>Kaynağı aç →</button>
                        </div>
                      </div>
                    );
                  })
              }
            </div>

            {unknownChecks.length > 0 && (
              <div style={{ ...ld.findCard, marginTop: 16 }}>
                <div style={ld.findHeader}>
                  <div style={ld.eyebrow}>DOĞRULANMAYAN KONTROLLER</div>
                  <div style={ld.cardTitle}>{unknownChecks.length} başlık satış iddiası olarak kullanılmıyor</div>
                </div>
                {unknownChecks.slice(0, 8).map((check, i) => (
                  <div key={`${check.code}-${i}`} style={ld.unknownRow}>
                    <div>
                      <div style={ld.findTitle}>{check.label}</div>
                      <div style={ld.findEvidence}>{check.note}</div>
                    </div>
                    {check.source_url && <button style={ld.findBtn} onClick={() => openExternal(check.source_url)}>Kontrol et →</button>}
                  </div>
                ))}
              </div>
            )}

            {lead.ai_report && (
              <div style={{ ...ld.findCard, marginTop: 16 }}>

                {showReport && <div style={{ padding: '16px 24px', fontSize: 13.5, color: 'var(--sub)', lineHeight: 1.7, whiteSpace: 'pre-wrap' }}>{lead.ai_report}</div>}

              <div style={{ ...ld.findCard, marginTop: 16 }}>

          <aside style={ld.side}>
            <div style={ld.sideCard}>
              <div style={ld.eyebrow}>HAZIRLIK</div>

                {readiness.map(item => (
                  <div key={item.label} style={item.ready ? ld.readyItemOk : ld.readyItemWarn}>
                    <span>{item.ready ? 'Hazır' : 'Eksik'}</span>
                    <strong>{item.label}</strong>
                  </div>
                ))}
              </div>
            </div>

            <div style={ld.sideCard}>
              <div style={ld.eyebrow}>DURUM</div>
              <div style={{ ...ld.cardTitle, marginBottom: 14 }}>Pipeline konumu</div>
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                {STATUS_OPTIONS.map(([key, label]) => (
                  <button key={key} style={{ ...ld.findBtn, background: status === key ? 'var(--accent)' : 'var(--panel2)', color: status === key ? 'var(--accent-ink)' : 'var(--tx)', fontWeight: status === key ? 600 : 400, border: status === key ? 'none' : '1px solid var(--line)' }} onClick={() => onStatusChange(key)}>{label}</button>
                ))}
              </div>
            </div>

            <div style={ld.sideCard}>
              <div style={ld.eyebrow}>AKTİVİTE</div>
              <div style={{ ...ld.cardTitle, marginBottom: 14 }}>Zaman çizelgesi</div>

                <div style={ld.lastEventBanner}>
                  <div style={ld.lastEventLabel}>Son hareket</div>
                  <div style={ld.lastEventText}>{(ACTIONS[lastEvent.action] || ACTIONS.note_added).label}</div>
                </div>
              )}
              {events.map((event, eventIdx) => {
                const meta = ACTIONS[event.action] || ACTIONS.note_added;
                return (
                  <div key={`${event.ts}-${eventIdx}`} style={ld.actRow}>
                    <div style={ld.actDot}/>
                    <div style={{ flex: 1 }}>
                      <div style={ld.actKind}>{meta.label}</div>
                      <div style={ld.actMeta}>
                        {fmtDate(event.date)}
                        {event.channelLabel ? ` · ${event.channelLabel}` : ''}
                        {event.outcomeLabel ? ` · ${event.outcomeLabel}` : ''}
                        {event.note ? ` · ${event.note}` : ''}
                        {event.followUpAt ? ` · Takip ${new Date(event.followUpAt).toLocaleString('tr-TR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}` : ''}
                      </div>
                    </div>
                  </div>
                );
              })}
              {lead.last_analyzed && (
                <div style={ld.actRow}><div style={ld.actDot}/><div style={{ flex: 1 }}><div style={ld.actKind}>Tarama tamamlandı</div><div style={ld.actMeta}>{fmtDate(lead.last_analyzed)} · {scoreAvailable ? `Skor ${lead.scoring.score}` : `%${lead.scoring?.coverage || 0} kapsam`}</div></div></div>
              )}
              <div style={ld.actRow}><div style={ld.actDot}/><div style={{ flex: 1 }}><div style={ld.actKind}>Lead listesine eklendi</div><div style={ld.actMeta}>{lead.city || '—'}</div></div></div>
            </div>

            <div style={ld.sideCard}>
              <div style={ld.eyebrow}>NOT</div>
              <div style={{ ...ld.cardTitle, marginBottom: 12 }}>Hızlı not</div>
              <textarea style={ld.textarea} value={note} onChange={e => setNote(e.target.value)} placeholder="Lead hakkında not ekle..."/>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 12, marginTop: 10 }}>
                <div style={ld.noteHint}>{feedback || 'Kısa notu zaman çizelgesine ekler.'}</div>
                <button style={{ ...ld.btnDarkSm, opacity: busy || !note.trim() ? 0.7 : 1 }} onClick={saveNote} disabled={busy || !note.trim()}>{busy ? 'Kaydediliyor…' : 'Kaydet'}</button>
              </div>
            </div>
          </aside>
        </section>
      </div>
    );
  }

  // ── Pipeline View ──────────────────────────────────────────────────────────

  function PipelineView({ leads, onSelect, onDataChange }) {
    const [tick, setTick] = React.useState(0);
    const [busyLead, setBusyLead] = React.useState('');
    const dragRef = React.useRef('');

    function refresh() { setTick(t => t + 1); }

    const byStage = {};
    PIPE_STAGES.forEach(s => { byStage[s.key] = []; });
    leads.forEach(l => { const stage = getPipelineStage(l); (byStage[stage] = byStage[stage] || []).push(l); });

    const won = byStage['won'].length;
    const active = ['draft','contacted','meeting'].reduce((a, k) => a + (byStage[k]||[]).length, 0);

    function runCardAction(lead, event) {
      event.stopPropagation();
      setBusyLead(lead.name);
      startLeadAction(lead)
        .finally(() => {
          setBusyLead('');
          if (onDataChange) onDataChange();
          refresh();
        });
    }

    function handleDrop(e, stageKey) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');
      const name = dragRef.current;
      if (!name) return;
      const stageObj = PIPE_STAGES.find(s => s.key === stageKey);
      if (!stageObj) return;
      let operation;
      if (stageObj.actions.length) {
        operation = addOutreach(name, stageObj.actions[0], new Date().toISOString().slice(0,16), '');
      } else if (stageKey === 'new') {
        operation = setStatusLS(name, 'yeni');
      } else if (stageKey === 'contacted') {
        operation = setStatusLS(name, 'contacted');
      } else if (stageKey === 'won') {
        operation = addOutreach(name, 'deal_won', new Date().toISOString().slice(0,16), '');
      } else if (stageKey === 'lost') {
        operation = addOutreach(name, 'deal_lost', new Date().toISOString().slice(0,16), '');
      }
      dragRef.current = '';
      Promise.resolve(operation).then(() => {
        if (onDataChange) onDataChange();
        refresh();
      }).catch(err => console.error('Pipeline update failed:', err));
    }

    return (
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0, background: 'var(--bg)' }}>
        <div style={pv.header}>
          <div>
            <div style={pv.pageEyebrow}>PIPELINE</div>
            <h1 style={pv.pageTitle}>Satış kanalı</h1>
            <p style={pv.pageSub}>{leads.length} lead · {won} kazanıldı · {active} aktif temasta</p>
          </div>
        </div>
        <div className="responsive-pipeline" style={pv.board}>
          {PIPE_STAGES.map(stage => {
            const cards = byStage[stage.key] || [];
            return (
              <div
                key={stage.key}
                style={pv.col}
                className="pipe-col"
                onDragOver={e => { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }}
                onDragLeave={e => e.currentTarget.classList.remove('drag-over')}
                onDrop={e => handleDrop(e, stage.key)}
              >
                <div style={pv.colHead}>
                  <span style={{ ...pv.colDot, background: stage.color }}/>
                  <span style={pv.colTitle}>{stage.label}</span>
                  <span style={pv.colCnt}>{cards.length}</span>
                </div>
                <div style={pv.cards}>
                  {cards.map(l => {
                    const globalIdx = leads.indexOf(l);
                    const val = l.estimated_value_tl || 0;
                    return (
                      <div
                        key={l.name}
                        style={pv.card}
                        className="pipe-card"
                        draggable
                        onDragStart={e => { dragRef.current = l.name; e.currentTarget.classList.add('dragging'); }}
                        onDragEnd={e => e.currentTarget.classList.remove('dragging')}
                        onClick={() => onSelect(globalIdx)}
                      >
                        <div style={pv.cardName}>{l.name}</div>
                        <div style={pv.cardActionLabel}>{getPrimaryActionMeta(l).label}</div>
                        <div style={pv.cardMeta}>
                          <span style={{ ...pv.cardScore, background: stage.color + '22', color: stage.color }}>{l.scoring.grade} {l.scoring.score}</span>
                          {val > 0 && <span style={pv.cardVal}>~{fmt(val)} ₺</span>}
                        </div>
                        <div style={pv.cardActions}>
                          <button
                            style={{ ...pv.cardBtn, ...(busyLead === l.name ? pv.cardBtnMuted : null) }}
                            onClick={e => runCardAction(l, e)}
                            disabled={busyLead === l.name}
                          >
                            {busyLead === l.name ? 'Kaydediliyor…' : getPrimaryActionMeta(l).label}
                          </button>
                          <button style={pv.cardBtnGhost} onClick={e => { e.stopPropagation(); triggerQuickLeadAction(l); }}>
                            Hızlı aç
                          </button>
                        </div>
                      </div>
                    );
                  })}
                  {cards.length === 0 && <div style={pv.empty}>Buraya sürükle</div>}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  function HizmetlerView({ leads }) {
    const svcMap = {};
    leads.forEach(l => {

      });

      const confirmed = active.matches.filter(item => item.match.match_type === 'confirmed_gap');

      const opportunities = active.matches.filter(item => item.match.match_type === 'qualified_opportunity');

    }).sort((a, b) => b.matches.length - a.matches.length);

  function AdminView({ user }) {
    const [query, setQuery] = React.useState('restoran');
    const [city, setCity] = React.useState('Istanbul Kadıköy');
    const [maxResults, setMaxResults] = React.useState(10);
    const [deepResearch, setDeepResearch] = React.useState(true);
    const [aiMode, setAiMode] = React.useState('smart');
    const [jobs, setJobs] = React.useState([]);
    const [tokens, setTokens] = React.useState(null);
    const [feedback, setFeedback] = React.useState('');
    const [busy, setBusy] = React.useState(false);
    const isAdmin = user?.role === 'admin';

    const estimatedTokens = maxResults * (deepResearch ? 9000 : 5200);
    const estimatedCost = (estimatedTokens / 1000000 * 0.9).toFixed(4);

    function refreshAdmin() {
      return fetchAdminJSON('/api/admin_search')
        .then(data => {
          setJobs(data.jobs || []);
          setTokens(data.token_summary || null);
        })
        .catch(err => setFeedback(err.message));
    }

    React.useEffect(() => {
      if (isAdmin) refreshAdmin();
    }, [isAdmin]);

    function createJob(e) {
      e.preventDefault();
      setBusy(true);
      setFeedback('');
      fetchAdminJSON('/api/admin_search', {
        method: 'POST',
        body: JSON.stringify({
          query,
          city,
          max_results: Number(maxResults),
          deep_research: deepResearch,
          ai_mode: aiMode,
        }),
      })
        .then(data => {
          setFeedback(`Search job #${data.job.id} kuyruğa alındı. Tahmini ${data.estimate.estimated_tokens.toLocaleString('tr-TR')} token.`);
          return refreshAdmin();
        })
        .catch(err => setFeedback(err.message))
        .finally(() => setBusy(false));
    }

    if (!isAdmin) {
      return (
        <div style={av.root}>
          <div style={av.loginCard}>
            <div style={pv.pageEyebrow}>YETKİ</div>
            <h1 style={pv.pageTitle}>Admin alanı</h1>
            <p style={av.text}>Yeni search ve token bütçesi sadece patron hesaplarında açık.</p>
          </div>
        </div>

    return (
      <div style={av.root}>
        <div style={{ ...pv.header, display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
          <div>
            <div style={pv.pageEyebrow}>ADMIN</div>
            <h1 style={pv.pageTitle}>Search operasyonu</h1>
            <p style={pv.pageSub}>Yeni lead taraması, DeepSeek bütçesi ve Supabase job kuyruğu.</p>
          </div>
          <div style={av.userChip}>{user?.name || user?.email}</div>

        <div className="responsive-admin" style={av.grid}>
          <form style={av.panel} onSubmit={createJob}>
            <div style={ld.eyebrow}>YENİ SEARCH</div>
            <div style={ld.cardTitle}>Admin tarama başlat</div>
            <label style={av.label}>Arama tipi</label>
            <input value={query} onChange={e => setQuery(e.target.value)} style={av.input} placeholder="restoran, mağaza, kuaför" />
            <label style={av.label}>Bölge</label>
            <input value={city} onChange={e => setCity(e.target.value)} style={av.input} placeholder="Istanbul Kadıköy" />
            <div style={av.row}>
              <div style={{ flex: 1 }}>
                <label style={av.label}>Sonuç</label>

              </div>
              <div style={{ flex: 1 }}>
                <label style={av.label}>AI modu</label>
                <select value={aiMode} onChange={e => setAiMode(e.target.value)} style={av.input}>
                  <option value="smart">Smart</option>
                  <option value="flash">Flash</option>
                  <option value="pro">Pro</option>
                </select>
              </div>
            </div>
            <label style={av.checkRow}>
              <input type="checkbox" checked={deepResearch} onChange={e => setDeepResearch(e.target.checked)} />
              <span>Deep research açık</span>
            </label>
            <div style={av.estimate}>
              <div><strong>{estimatedTokens.toLocaleString('tr-TR')}</strong><span> tahmini token</span></div>
              <div><strong>${estimatedCost}</strong><span> tahmini maliyet</span></div>
            </div>
            {feedback && <div style={av.feedback}>{feedback}</div>}
            <button style={av.primaryBtn} disabled={busy || !query.trim() || !city.trim()}>{busy ? 'Kuyruğa alınıyor…' : 'Search job oluştur'}</button>
          </form>

          <div style={av.sideStack}>
            <div style={av.panel}>
              <div style={ld.eyebrow}>TOKEN</div>
              <div style={ld.cardTitle}>DeepSeek kullanımı</div>
              <div style={av.metricRow}><span>Reserve</span><strong>{(tokens?.estimated_tokens || 0).toLocaleString('tr-TR')}</strong></div>
              <div style={av.metricRow}><span>Gerçek</span><strong>{(tokens?.actual_tokens || 0).toLocaleString('tr-TR')}</strong></div>
              <div style={av.metricRow}><span>Tahmini maliyet</span><strong>${Number(tokens?.estimated_cost_usd || 0).toFixed(4)}</strong></div>
            </div>

            <div style={av.panel}>
              <div style={ld.eyebrow}>SON İŞLER</div>
              <div style={ld.cardTitle}>Search kuyruğu</div>
              <div style={av.jobs}>
                {jobs.length === 0 && <div style={av.muted}>Henüz job yok.</div>}
                {jobs.map(job => (
                  <div key={job.id} style={av.jobRow}>
                    <div>
                      <div style={av.jobTitle}>#{job.id} {job.query} · {job.city}</div>
                      <div style={av.muted}>{job.max_results} lead · {job.ai_mode} · {Number(job.estimated_tokens || 0).toLocaleString('tr-TR')} token</div>
                    </div>
                    <span style={av.jobStatus}>{job.status}</span>

              </div>
              <button style={ld.btnGhost} onClick={refreshAdmin}>Yenile</button>
            </div>

        </div>
      </div>

  }

  const av = {
    root:      { flex: 1, minWidth: 0, background: 'var(--bg)', fontFamily: "'Instrument Sans', system-ui, sans-serif", color: 'var(--tx)' },
    empty:     { padding: 40, color: 'var(--sub)' },
