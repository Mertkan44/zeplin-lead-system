<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Zeplin Media · Lead Cockpit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100vh; background: #FAFAF9; }
    body { font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    #root { min-height: 100vh; display: flex; }
    button { font-family: inherit; }
    textarea { font-family: inherit; }
    a { text-decoration: none; color: inherit; }
    .pipe-card.dragging { opacity: 0.4; }
    .pipe-col.drag-over { background: #F0F0EE; }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script>
    var leads    = JSON.parse(atob('__DATA__'));
    var services = JSON.parse(atob('__SERVICES__'));
    var STATUS_KEY   = 'zeplin_lead_statuses_v2';
    var OUTREACH_KEY = 'zeplin_outreach_v1';
  </script>

  <script type="text/babel">
  // ── Helpers ────────────────────────────────────────────────────────────────

  function fmt(n) {
    if (!n) return '0';
    if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
    if (n >= 1000) return Math.round(n / 1000) + 'K';
    return String(n);
  }

  function fmtDate(str) {
    if (!str) return '';
    try {
      const d = new Date(str.replace(' ', 'T'));
      if (isNaN(d)) return str;
      return d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', year: 'numeric' });
    } catch(e) { return str; }
  }

  function getStatuses() {
    try { return JSON.parse(localStorage.getItem(STATUS_KEY) || '{}'); } catch(e) { return {}; }
  }
  function setStatusLS(name, s) {
    const a = getStatuses(); a[name] = s;
    localStorage.setItem(STATUS_KEY, JSON.stringify(a));
  }

  function getOutreach() {
    try { return JSON.parse(localStorage.getItem(OUTREACH_KEY) || '[]'); } catch(e) { return []; }
  }
  function saveOutreach(arr) { localStorage.setItem(OUTREACH_KEY, JSON.stringify(arr)); }
  function getLeadEvents(name) {
    return getOutreach().filter(e => e.lead === name).sort((a, b) => b.date.localeCompare(a.date));
  }
  function addOutreach(name, action, date, note) {
    const arr = getOutreach();
    arr.push({ lead: name, action, date, note, ts: Date.now() });
    saveOutreach(arr);
    const act = ACTIONS[action];
    if (act && act.status) setStatusLS(name, act.status);
  }

  const ACTIONS = {
    email_sent:        { label: 'Mail Gönderildi',   icon: '✉️', status: 'contacted' },
    reply_received:    { label: 'Cevap Alındı',       icon: '💬', status: 'contacted' },
    call_made:         { label: 'Arama Yapıldı',      icon: '📞', status: 'contacted' },
    meeting_scheduled: { label: 'Toplantı Planlandı', icon: '📅', status: 'contacted' },
    note:              { label: 'Not Eklendi',         icon: '📝', status: null },
    deal_won:          { label: 'Anlaşma Yapıldı 🎉', icon: '🎉', status: 'converted' },
    deal_lost:         { label: 'Anlaşma Düştü',      icon: '❌', status: 'yeni' },
  };

  const PIPE_STAGES = [
    { key: 'new',      label: 'Yeni',           color: '#9A9A9A', actions: [] },
    { key: 'emailed',  label: 'Mail Atıldı',    color: '#76a6ff', actions: ['email_sent'] },
    { key: 'replied',  label: 'Cevap Alındı',   color: '#f7c560', actions: ['reply_received'] },
    { key: 'called',   label: 'Görüşüldü',      color: '#b9a8ff', actions: ['call_made'] },
    { key: 'meeting',  label: 'Toplantı',        color: '#ff9f43', actions: ['meeting_scheduled'] },
    { key: 'won',      label: 'Kazanıldı 🎉',  color: '#7ce2b5', actions: ['deal_won'] },
    { key: 'lost',     label: 'Kaybedildi',      color: '#ff6770', actions: ['deal_lost'] },
  ];

  function getPipelineStage(lead) {
    const st = getStatuses()[lead.name] || 'yeni';
    if (st === 'converted') return 'won';
    const evs = getLeadEvents(lead.name);
    const last = evs.find(e => e.action !== 'note');
    if (!last) return st === 'contacted' ? 'emailed' : 'new';
    const map = { email_sent: 'emailed', reply_received: 'replied', call_made: 'called',
                  meeting_scheduled: 'meeting', deal_won: 'won', deal_lost: 'lost' };
    return map[last.action] || 'emailed';
  }

  function issueToSeverity(text) {
    if (!text) return 'Bilgi';
    const t = text.toLowerCase();
    if (t.includes('ssl') || t.includes('https')) return 'Kritik';
    if (t.includes('web sitesi yok') || t.includes('website yok') || t.includes('site yok')) return 'Yüksek';
    if (t.includes('schema') || t.includes('og') || t.includes('open graph')) return 'Orta';
    if (t.includes('telefon') || t.includes('adres') || t.includes('tamamla') || t.includes('instagram yok')) return 'Düşük';
    return 'Bilgi';
  }

  function scoreDash(score) { return 326.7 * (1 - score / 100); }

  function computeKPIs(arr) {
    const total = arr.length || 1;
    return {
      packagedCount: arr.filter(l => l.matched_services && l.matched_services.length > 0).length,
      packagedPct:   Math.round(arr.filter(l => l.matched_services && l.matched_services.length > 0).length / total * 100),
      phoneCount:    arr.filter(l => l.phone).length,
      phonePct:      Math.round(arr.filter(l => l.phone).length / total * 100),
      aiCount:       arr.filter(l => l.ai_report).length,
      aiPct:         Math.round(arr.filter(l => l.ai_report).length / total * 100),
      auditCount:    arr.filter(l => l.scoring && l.scoring.issues && l.scoring.issues.length > 0).length,
      auditPct:      Math.round(arr.filter(l => l.scoring && l.scoring.issues && l.scoring.issues.length > 0).length / total * 100),
    };
  }

  function computeTabCounts(arr, statuses) {
    return {
      total:     arr.length,
      yeni:      arr.filter(l => (statuses[l.name] || 'yeni') === 'yeni').length,
      contacted: arr.filter(l => statuses[l.name] === 'contacted').length,
      converted: arr.filter(l => statuses[l.name] === 'converted').length,
      low:       arr.filter(l => l.scoring && l.scoring.score < 50).length,
    };
  }

  // ── Shared Sidebar ─────────────────────────────────────────────────────────

  function SideIc({ name }) {
    const paths = {
      cockpit:   <><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9"/></>,
      leads:     <><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/></>,
      pipeline:  <><path d="M3 6h18"/><path d="M5 12h14"/><path d="M8 18h8"/></>,
      audit:     <><path d="M9 11l3 3 8-8"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></>,
      raporlar:  <><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 12v4"/><path d="M12 8v8"/><path d="M16 14v2"/></>,
      hizmetler: <><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><path d="M12 12v4M10 14h4"/></>,
      settings:  <><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></>,
    };
    return (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
        {paths[name]}
      </svg>
    );
  }

  function Sidebar({ view, onNav, leadCount }) {
    const navItems = [
      { key: 'cockpit',   ic: 'cockpit',   label: 'Cockpit',   badge: leadCount },
      { key: 'raporlar',  ic: 'leads',     label: 'Leadler' },
      { key: 'pipeline',  ic: 'pipeline',  label: 'Pipeline' },
      { key: 'hizmetler', ic: 'hizmetler', label: 'Hizmetler' },
    ];
    const currentView = view === 'detail' ? 'raporlar' : view;

    return (
      <aside style={sb.sidebar}>
        <div style={sb.brand}>
          <div style={sb.logo}>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
              <ellipse cx="12" cy="12" rx="10" ry="6" stroke="#0A0A0A" strokeWidth="1.5"/>
              <path d="M22 12 L24 13 L22 14" stroke="#0A0A0A" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
              <circle cx="9" cy="12" r="1" fill="#0A0A0A"/>
            </svg>
          </div>
          <div>
            <div style={sb.brandName}>Zeplin Media</div>
            <div style={sb.brandSub}>Lead Intelligence</div>
          </div>
        </div>

        <nav style={sb.nav}>
          {navItems.map(n => {
            const active = currentView === n.key;
            return (
              <a key={n.key} style={active ? sb.itemActive : sb.item} onClick={() => onNav(n.key)}>
                <SideIc name={n.ic} />
                <span style={{ flex: 1 }}>{n.label}</span>
                {n.badge !== undefined && (
                  <span style={active ? sb.badgeActive : sb.badge}>{n.badge}</span>
                )}
              </a>
            );
          })}
        </nav>

        <div style={{ marginTop: 'auto' }}>
          <div style={sb.upgradeCard}>
            <div style={sb.upgradeEyebrow}>OTOMASYON</div>
            <div style={sb.upgradeTitle}>Otomatik tarayıcı</div>
            <div style={sb.upgradeBody}>15 dakikada bir tarama. Yeni leadler otomatik dosyalansın.</div>
            <button style={sb.upgradeBtn}>Etkinleştir →</button>
          </div>
        </div>
      </aside>
    );
  }

  const sb = {
    sidebar:      { width: 244, minHeight: '100vh', padding: '24px 18px', borderRight: '1px solid #ECECEC', display: 'flex', flexDirection: 'column', gap: 22, background: '#fff', position: 'sticky', top: 0, height: '100vh', overflowY: 'auto', flexShrink: 0 },
    brand:        { display: 'flex', alignItems: 'center', gap: 10, padding: '0 8px' },
    logo:         { width: 36, height: 36, display: 'grid', placeItems: 'center', borderRadius: 10, background: '#FAFAF9', border: '1px solid #ECECEC', flexShrink: 0 },
    brandName:    { fontFamily: '"Inter Tight"', fontWeight: 700, fontSize: 15, letterSpacing: -0.2 },
    brandSub:     { fontSize: 11, color: '#9A9A9A', marginTop: 1 },
    nav:          { display: 'flex', flexDirection: 'column', gap: 2, marginTop: 4 },
    item:         { display: 'flex', alignItems: 'center', gap: 12, padding: '10px 12px', borderRadius: 10, color: '#6B6B6B', cursor: 'pointer', fontSize: 13.5, fontWeight: 500 },
    itemActive:   { display: 'flex', alignItems: 'center', gap: 12, padding: '10px 12px', borderRadius: 10, background: '#0A0A0A', color: '#fff', cursor: 'pointer', fontSize: 13.5, fontWeight: 500 },
    badge:        { fontSize: 10.5, background: '#F4F4F2', color: '#3A3A3A', padding: '2px 7px', borderRadius: 99, fontFamily: '"JetBrains Mono"', fontWeight: 600 },
    badgeActive:  { fontSize: 10.5, background: '#C6F24E', color: '#0A0A0A', padding: '2px 7px', borderRadius: 99, fontFamily: '"JetBrains Mono"', fontWeight: 600 },
    upgradeCard:  { background: '#FAFAF9', border: '1px solid #ECECEC', borderRadius: 14, padding: 16 },
    upgradeEyebrow:{ fontSize: 10.5, fontFamily: '"JetBrains Mono"', textTransform: 'uppercase', letterSpacing: 1, color: '#6B6B6B' },
    upgradeTitle: { fontFamily: '"Inter Tight"', fontWeight: 600, fontSize: 15, marginTop: 8, letterSpacing: -0.2 },
    upgradeBody:  { fontSize: 12, color: '#6B6B6B', marginTop: 6, lineHeight: 1.45 },
    upgradeBtn:   { marginTop: 12, padding: '8px 12px', background: '#0A0A0A', color: '#fff', border: 'none', borderRadius: 8, fontSize: 12, fontWeight: 500, cursor: 'pointer', width: '100%' },
  };

  // ── Sub-components (cockpit) ───────────────────────────────────────────────

  function SH({ eyebrow, title, right }) {
    return (
      <div style={vp.sectionHeader}>
        <div>
          <div style={vp.eyebrowSm}>{eyebrow}</div>
          <h2 style={vp.h2}>{title}</h2>
        </div>
        {right}
      </div>
    );
  }

  function KpiHead({ label, hint }) {
    return (
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <div style={{ fontSize: 11, fontFamily: '"JetBrains Mono"', textTransform: 'uppercase', letterSpacing: 1, color: '#3A3A3A' }}>{label}</div>
        <div style={{ fontSize: 10.5, fontFamily: '"JetBrains Mono"', color: '#3A3A3A', background: 'rgba(0,0,0,0.06)', padding: '2px 7px', borderRadius: 6 }}>{hint}</div>
      </div>
    );
  }

  // ── Cockpit Main Content ───────────────────────────────────────────────────

  function CockpitMain({ leads, statuses, onSelect }) {
    const [activeTab, setActiveTab] = React.useState('Tümü');

    const kpi    = computeKPIs(leads);
    const counts = computeTabCounts(leads, statuses);
    const tabs   = [
      ['Tümü', counts.total], ['Yeni', counts.yeni], ['Contacted', counts.contacted],
      ['Converted', counts.converted], ['Düşük skor', counts.low],
    ];

    const filteredLeads = React.useMemo(() => {
      if (activeTab === 'Tümü')       return leads;
      if (activeTab === 'Yeni')       return leads.filter(l => (statuses[l.name] || 'yeni') === 'yeni');
      if (activeTab === 'Contacted')  return leads.filter(l => statuses[l.name] === 'contacted');
      if (activeTab === 'Converted')  return leads.filter(l => statuses[l.name] === 'converted');
      if (activeTab === 'Düşük skor') return leads.filter(l => l.scoring && l.scoring.score < 50);
      return leads;
    }, [leads, statuses, activeTab]);

    const topLead       = leads[0];
    const queueLeads    = filteredLeads.slice(0, 4);
    const miniLeads     = leads.slice(4);
    const totalVal      = leads.reduce((s, l) => s + (l.estimated_value_tl || 0), 0);
    const criticalCount = leads.filter(l => l.scoring?.issues?.some(i => issueToSeverity(i) === 'Kritik')).length;
    const lastDate      = topLead ? fmtDate(topLead.last_analyzed) : '—';
    const pipelineMax   = Math.max(leads.length, 1);

    return (
      <main style={vp.main}>
        {/* Topbar */}
        <header style={vp.topbar}>
          <div style={vp.search}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9A9A9A" strokeWidth="2">
              <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
            </svg>
            <span>Lead, firma veya hizmet ara</span>
            <kbd style={vp.kbd}>⌘K</kbd>
          </div>
          <div style={vp.topRight}>
            <div style={vp.statusChip}><span style={vp.pulseDot}/><span>BOT AKTİF · son 2 dk</span></div>
            <div style={vp.user}>
              <div style={vp.avatar}>MA</div>
              <div>
                <div style={{ fontWeight: 600, fontSize: 13 }}>Mert Aslan</div>
                <div style={{ fontSize: 11, color: '#9A9A9A' }}>Sales Lead</div>
              </div>
            </div>
          </div>
        </header>

        {/* Hero */}
        <section style={vp.hero}>
          <div>
            <div style={vp.eyebrow}><span style={vp.pulseDot}/>ZEPLİN OS · CANLI TARAMA</div>
            <h1 style={vp.h1}>Lead Cockpit<span style={vp.h1Accent}>.</span></h1>
            <p style={vp.lede}>
              {leads.length} işletme tarandı. Bot{' '}
              <em style={vp.em}>{kpi.packagedCount} lead</em> için satılabilir hizmet paketi çıkardı;{' '}
              <em style={vp.em}>{criticalCount} işletmede</em> kritik açık var.
            </p>
            <div style={vp.heroMeta}>
              <span>Son güncelleme</span><strong>{lastDate}</strong>
              <span style={vp.sep}>·</span>
              <span>Toplam pipeline</span><strong>~{fmt(totalVal)} ₺</strong>
            </div>
            <div style={vp.tabs}>
              {tabs.map(([name, count]) => {
                const active = activeTab === name;
                return (
                  <button key={name} onClick={() => setActiveTab(name)} style={active ? vp.tabActive : vp.tab}>
                    {name}<span style={active ? vp.tabCountActive : vp.tabCount}>{count}</span>
                  </button>
                );
              })}
            </div>
          </div>

          {topLead && (
            <div style={vp.heroRight}>
              <div style={vp.focusCard}>
                <div style={vp.focusEyebrow}>BUGÜNÜN ODAĞI</div>
                <div style={vp.focusTitle}>{topLead.name}</div>
                <div style={vp.focusSub}>{topLead.category || topLead.sector || 'İşletme'} · {topLead.city}</div>
                <div style={vp.focusStats}>
                  <div><div style={vp.fsl}>Potansiyel</div><div style={vp.fsv}>{topLead.estimated_value_tl > 0 ? `~${fmt(topLead.estimated_value_tl)} ₺` : '—'}</div></div>
                  <div><div style={vp.fsl}>Skor</div><div style={vp.fsv}>{topLead.scoring.score}<span style={vp.fsu}>/100</span></div></div>
                  <div><div style={vp.fsl}>Sınıf</div><div style={vp.fsv}>{topLead.scoring.grade}</div></div>
                </div>
                <div style={vp.focusActions}>
                  <button style={vp.btnLime} onClick={() => onSelect(0)}>{topLead.next_action || 'Detay gör'} →</button>
                  <button style={vp.btnGhostDark} onClick={() => onSelect(0)}>Rapor</button>
                </div>
              </div>
            </div>
          )}
        </section>

        {/* KPI row */}
        <section style={vp.kpiRow}>
          <div style={{ ...vp.kpiCard, background: '#EAFBD3' }}>
            <KpiHead label="Paketlenen fırsat" hint={`${kpi.packagedCount}/${leads.length}`}/>
            <div style={vp.kpiBig}>%{kpi.packagedPct}</div>
            <div style={vp.kpiBars}>{[5,7,6,9,8,11,10,12].map((v, i) => <div key={i} style={{ height: `${v*4}px`, flex: 1, background: '#0A0A0A', borderRadius: 2, opacity: 0.85 }}/>)}</div>
            <div style={vp.kpiCap}>lead hizmete bağlandı</div>
          </div>
          <div style={{ ...vp.kpiCard, background: '#FFE9D9' }}>
            <KpiHead label="Temas hazırlığı" hint={`${kpi.phoneCount}/${leads.length}`}/>
            <div style={vp.kpiBig}>%{kpi.phonePct}</div>
            <svg width="100%" height="52" viewBox="0 0 200 52">
              {/* Arc: center (100,129) r=121 → endpoints (10,48) and (190,48), peak (100,8) */}
              <path d="M10 48 A121 121 0 0 1 190 48" fill="none" stroke="#FFD3B0" strokeWidth="7" strokeLinecap="round"/>
              {(() => {
                const pct = Math.min(Math.max(kpi.phonePct, 0), 100) / 100;
                if (pct <= 0) return null;
                const cx = 100, cy = 129, r = 121;
                const a0 = 222 * Math.PI / 180;
                const a1 = 318 * Math.PI / 180;
                const a  = a0 + pct * (a1 - a0);
                const ex = (cx + r * Math.cos(a)).toFixed(1);
                const ey = (cy + r * Math.sin(a)).toFixed(1);
                return <path d={`M10 48 A121 121 0 0 1 ${ex} ${ey}`} fill="none" stroke="#FF6B3D" strokeWidth="7" strokeLinecap="round"/>;
              })()}
            </svg>
            <div style={vp.kpiCap}>lead telefon bilgisi içeriyor</div>
          </div>
          <div style={{ ...vp.kpiCard, background: '#E8EEFF' }}>
            <KpiHead label="AI dosyası" hint={`${kpi.aiCount}/${leads.length}`}/>
            <div style={vp.kpiBig}>%{kpi.aiPct}</div>
            <div style={vp.dotsRow}>{Array.from({ length: leads.length }).map((_, i) => <span key={i} style={{ width: 11, height: 11, borderRadius: 99, display: 'inline-block', background: i < kpi.aiCount ? '#3D5BFF' : '#C8D0FF' }}/>)}</div>
            <div style={vp.kpiCap}>rapor ve mail hazır</div>
          </div>
          <div style={{ ...vp.kpiCard, background: '#FFE0E0' }}>
            <KpiHead label="Audit derinliği" hint={`${kpi.auditCount}/${leads.length}`}/>
            <div style={vp.kpiBig}>%{kpi.auditPct}</div>
            <div style={vp.dotsRow}>{Array.from({ length: leads.length }).map((_, i) => <span key={i} style={{ width: 11, height: 11, borderRadius: 99, display: 'inline-block', background: i < kpi.auditCount ? '#E04545' : '#FFC0C0' }}/>)}</div>
            <div style={vp.kpiCap}>teknik sinyalli</div>
          </div>
        </section>

        <div style={vp.note}>Güvenlik notu — Takım kullanımı için sıradaki aşama: kullanıcı yetkileri, kalıcı veritabanı ve audit log. Şu an pipeline aksiyonları bu tarayıcıda saklanır.</div>

        {/* Two col */}
        <section style={vp.twoCol}>
          <div>
            <SH eyebrow="FOCUS QUEUE" title="Öncelik masası" right={<button style={vp.btnGhost}>Tüm raporlar →</button>}/>
            <div style={vp.queue}>
              {queueLeads.length === 0

  // ── Pipeline View ──────────────────────────────────────────────────────────

  function PipelineView({ leads, onSelect }) {
    const [tick, setTick] = React.useState(0);
    const dragRef = React.useRef('');

    function refresh() { setTick(t => t + 1); }

    const byStage = {};
    PIPE_STAGES.forEach(s => { byStage[s.key] = []; });
    leads.forEach(l => { const stage = getPipelineStage(l); (byStage[stage] = byStage[stage] || []).push(l); });

    const won = byStage['won'].length;
    const active = ['emailed','replied','called','meeting'].reduce((a, k) => a + (byStage[k]||[]).length, 0);

    function handleDrop(e, stageKey) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');
      const name = dragRef.current;
      if (!name) return;
      const stageObj = PIPE_STAGES.find(s => s.key === stageKey);
      if (!stageObj) return;
      if (stageObj.actions.length) {
        addOutreach(name, stageObj.actions[0], new Date().toISOString().slice(0,16), '');
      } else if (stageKey === 'new') {
        setStatusLS(name, 'yeni');
      } else if (stageKey === 'won') {
        addOutreach(name, 'deal_won', new Date().toISOString().slice(0,16), '');
      } else if (stageKey === 'lost') {
        addOutreach(name, 'deal_lost', new Date().toISOString().slice(0,16), '');
      }
      dragRef.current = '';
      refresh();
    }

    return (
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0, background: '#FAFAF9', overflowY: 'auto' }}>
        <div style={pv.header}>
          <div>
            <div style={pv.pageEyebrow}>PIPELINE</div>
            <h1 style={pv.pageTitle}>Satış kanalı</h1>
            <p style={pv.pageSub}>{leads.length} lead · {won} kazanıldı · {active} aktif temasta</p>
          </div>
        </div>
        <div style={pv.board}>
          {PIPE_STAGES.map(stage => {
            const cards = byStage[stage.key] || [];
            return (
              <div
                key={stage.key}
                style={pv.col}
                className="pipe-col"
                onDragOver={e => { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }}
                onDragLeave={e => e.currentTarget.classList.remove('drag-over')}
                onDrop={e => handleDrop(e, stage.key)}
              >
                <div style={pv.colHead}>
                  <span style={{ ...pv.colDot, background: stage.color }}/>
                  <span style={pv.colTitle}>{stage.label}</span>
                  <span style={pv.colCnt}>{cards.length}</span>
                </div>
                <div style={pv.cards}>
                  {cards.map(l => {
                    const globalIdx = leads.indexOf(l);
                    const val = l.estimated_value_tl || 0;
                    return (
                      <div
                        key={l.name}
                        style={pv.card}
                        className="pipe-card"
                        draggable
                        onDragStart={e => { dragRef.current = l.name; e.currentTarget.classList.add('dragging'); }}
                        onDragEnd={e => e.currentTarget.classList.remove('dragging')}
                        onClick={() => onSelect(globalIdx)}
                      >
                        <div style={pv.cardName}>{l.name}</div>
                        <div style={pv.cardMeta}>
                          <span style={{ ...pv.cardScore, background: stage.color + '22', color: stage.color }}>{l.scoring.grade} {l.scoring.score}</span>
                          {val > 0 && <span style={pv.cardVal}>~{fmt(val)} ₺</span>}
                        </div>
                      </div>
                    );
                  })}
                  {cards.length === 0 && <div style={pv.empty}>Buraya sürükle</div>}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  function HizmetlerView({ leads }) {
    const svcMap = {};
    leads.forEach(l => {

        if (!svcMap[svc.slug]) svcMap[svc.slug] = { svc, leads: [], totalVal: 0 };
        svcMap[svc.slug].leads.push(l);
        const mid = ((svc.price_min || 0) + (svc.price_max || 0)) / 2;
        svcMap[svc.slug].totalVal += svc.monthly ? mid : mid / 12;
      });
    });

    const entries = services.map(svc => {
      const active = svcMap[svc.slug] || { leads: [], totalVal: 0 };
      return { svc, leads: active.leads, totalVal: active.totalVal };

    const totalMonthly = Math.round(entries.reduce((a, e) => a + e.totalVal, 0));

                <div style={{ textAlign: 'right' }}>
                  <div style={{ fontFamily: '"Inter Tight"', fontSize: 16, fontWeight: 600, color: '#1F8B3B' }}>{l.estimated_value_tl > 0 ? `~${fmt(l.estimated_value_tl)} ₺` : '—'}</div>
                  {l.next_action && <div style={{ fontSize: 11.5, color: '#6B6B6B', marginTop: 4 }}>{l.next_action}</div>}
                </div>
                <div style={{ background: statusColors[st], color: statusTextColors[st], fontSize: 11, fontFamily: '"JetBrains Mono"', fontWeight: 600, padding: '6px 12px', borderRadius: 99, textAlign: 'center' }}>{statusLabels[st]}</div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  // ── App ────────────────────────────────────────────────────────────────────

  function App() {
    const [view,        setView]        = React.useState('cockpit');
    const [selectedIdx, setSelectedIdx] = React.useState(0);
    const [statuses,    setStatuses]    = React.useState(() => getStatuses());

    const sorted = React.useMemo(
      () => [...leads].sort((a, b) => b.scoring.score - a.scoring.score),
      []
    );

    function handleStatusChange(name, s) {
      setStatusLS(name, s);
      setStatuses(getStatuses());
    }

    function navigate(v) { setView(v); }

    function selectLead(i) { setSelectedIdx(i); setView('detail'); }

    function renderContent() {
      switch (view) {
        case 'detail':
          return (
            <LeadDetail
              lead={sorted[selectedIdx]}
              idx={selectedIdx}
              total={sorted.length}
              status={statuses[sorted[selectedIdx].name] || 'yeni'}
              onStatusChange={s => handleStatusChange(sorted[selectedIdx].name, s)}
              onBack={() => setView('cockpit')}
              onPrev={() => setSelectedIdx(i => Math.max(0, i - 1))}
              onNext={() => setSelectedIdx(i => Math.min(sorted.length - 1, i + 1))}
            />
          );
        case 'pipeline':
          return <PipelineView leads={sorted} onSelect={selectLead}/>;
        case 'hizmetler':
          return <HizmetlerView leads={leads} />;
        case 'raporlar':
          return <RaporlarView leads={sorted} statuses={statuses} onSelect={selectLead}/>;
        default:
          return <CockpitMain leads={sorted} statuses={statuses} onSelect={selectLead}/>;
      }
    }

    return (
      <div style={{ display: 'flex', minHeight: '100vh', width: '100%' }}>
        <Sidebar view={view} onNav={navigate} leadCount={leads.length}/>
        {renderContent()}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
